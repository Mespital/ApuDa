    aside{position:sticky;top:82px;align-self:start;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);max-height:calc(100vh - 100px);overflow:auto}

    .progress{height:8px;background:#e9eef5;border-radius:99px;overflow:hidden}.progress>div{height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--green));transition:.3s}

    main{min-width:0}

    .hero h1{margin:0 0 8px;font-size:clamp(24px,3vw,38px);line-height:1.15}.hero p{margin:0;color:#e8f4ff;max-width:800px}
    .hero-badge{min-width:165px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);border-radius:18px;padding:14px;text-align:center}.hero-badge b{display:block;font-size:30px}
    .notice{background:#fff9db;border:1px solid #ffe066;color:#7a5300;padding:12px 14px;border-radius:14px;margin-bottom:18px;font-size:14px}
    .section{display:none;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);margin-bottom:18px}
    .section.active{display:block}
    .section-head{display:flex;justify-content:space-between;gap:15px;align-items:flex-start;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:18px}
    .section h2{margin:0;font-size:22px}.section-head p{margin:4px 0 0;color:var(--muted)}
    .grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}.col-12{grid-column:span 12}.col-8{grid-column:span 8}.col-6{grid-column:span 6}.col-4{grid-column:span 4}.col-3{grid-column:span 3}
    label.field{display:block;font-weight:700;font-size:13px;color:#344054}.field input,.field select,.field textarea{width:100%;margin-top:6px;border:1px solid #cfd8e3;border-radius:11px;padding:11px 12px;background:#fff;outline:none}.field textarea{min-height:96px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(21,89,183,.12)}
    .help{font-size:12px;color:var(--muted);margin-top:5px;font-weight:400}.computed{background:#eef8ff!important;color:var(--blue);font-weight:800}
    .chips{display:flex;flex-wrap:wrap;gap:8px}.chip input{display:none}.chip label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 12px;font-weight:700;font-size:13px;cursor:pointer}.chip input:checked+label{background:#e8f3ff;border-color:var(--blue);color:var(--blue)}
    .subcard{border:1px solid var(--line);border-radius:15px;padding:15px;background:#fbfdff}.subcard h3{margin:0 0 12px;font-size:16px}
    .table-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px}.data-table{width:100%;border-collapse:collapse;min-width:780px}.data-table th,.data-table td{padding:9px;border-bottom:1px solid var(--line);vertical-align:top}.data-table th{background:#f5f8fc;text-align:left;font-size:12px;color:#475467;position:sticky;top:0}.data-table input,.data-table select,.data-table textarea{width:100%;border:1px solid #d8e0ea;border-radius:8px;padding:8px;background:white}.data-table textarea{min-height:42px}.data-table tr:last-child td{border-bottom:0}.icon-btn{border:0;background:#fff0f0;color:var(--danger);border-radius:9px;padding:7px 10px;font-weight:900}

    .med-class{display:inline-block;margin-top:4px;background:#e8f7ef;color:#13794d;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:800}
    .section-footer{display:flex;justify-content:space-between;gap:10px;margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
    .dashboard{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}.metric{background:white;border:1px solid var(--line);border-radius:15px;padding:14px}.metric span{display:block;color:var(--muted);font-size:12px}.metric b{font-size:24px;color:var(--blue)}

    .evidence{display:block;font-size:12px;color:var(--muted);margin-top:3px}.empty{color:var(--muted);font-size:14px}
    .timeline{display:grid;gap:10px}.timeline-item{display:grid;grid-template-columns:120px 1fr auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:13px;padding:11px}.timeline-item .date{font-weight:800;color:var(--blue)}

    .evidence-pill{display:inline-flex;align-items:center;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:900;margin:0 4px 4px 0}.evidence-a{background:#dcfce7;color:#166534}.evidence-b{background:#dbeafe;color:#1d4ed8}.evidence-c{background:#fff3bf;color:#8a5d00}.evidence-d{background:#f1f3f5;color:#495057}
    .decision-note{border:1px solid #cfe0f3;background:#f7fbff;border-radius:14px;padding:13px 14px;margin:0 0 14px}.decision-note b{color:var(--blue)}
    .age-guide{margin-top:14px;border-left:5px solid var(--blue);background:#f7fbff;border-radius:12px;padding:12px 14px;font-size:13px}.age-guide b{color:var(--blue)}
    .review-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.review-grid .subcard{height:100%}.review-grid ul{margin:0;padding-left:18px}.review-grid li{margin:5px 0;font-size:13px}
    .btn,.upload-pick,.nav button,.chip label{min-height:44px}
    body.large-text{font-size:18px;line-height:1.65}body.large-text .field,body.large-text label.field,body.large-text .help,body.large-text .evidence{font-size:15px}body.large-text .btn,body.large-text .upload-pick{font-size:16px}body.large-text .section h2{font-size:25px}body.large-text .result-box h3{font-size:19px}

    .privacy-summary{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap;background:#f4f8ff;border:1px solid #d7e5f7;border-radius:13px;padding:11px 13px;font-size:12px;color:#4b5f78}

<body>
<div class="app">
<header>
  <div class="topbar">
    <div class="brand"><div class="logo">A</div><div><strong>ApuDa Check</strong><small>맞춤 건강검진 선택</small></div></div>
    <div class="top-actions">
      <button class="btn primary" id="saveBtn">저장</button>
      <button class="btn" id="resultBtn">결과</button>
      <details class="more-menu">
        <summary class="btn" aria-label="더보기">⋯</summary>
        <div class="menu-panel">
          <button class="menu-btn" id="printBtn">결과 PDF</button>
          <button class="menu-btn" id="backupBtn">백업</button>
          <button class="menu-btn" id="restoreBtn">복원</button>
          <input id="restoreInput" type="file" accept="application/json" hidden>
          <button class="menu-btn" id="fontBtn" aria-pressed="false">큰 글씨</button>
          <button class="menu-btn danger" id="resetBtn">처음부터</button>
        </div>
      </details>
    </div>
  </div>
</header>

<div class="layout">
  <aside aria-hidden="true"><nav class="nav" id="sideNav"></nav></aside>

  <main>
    <div class="compact-progress">
      <div class="compact-progress-head">
        <strong id="currentStepLabel">기본 정보</strong>
        <span><b id="stepCounter">1/13</b><em>·</em><b id="progressText">0%</b></span>
      </div>
      <div class="progress"><div id="progressBar"></div></div>
    </div>
    <section class="hero"><div><h1>ApuDa Check</h1><p>내 건강기록을 바탕으로 지금 필요한 검진을 간단하게 정리합니다.</p></div></section>
    <div class="notice slim-notice">증상이나 이전 이상 소견이 있다면 일반 검진보다 진료·추적검사가 우선입니다.</div>

    <section class="section active" data-section="basic"></section>
    <section class="section" data-section="lifestyle"></section>
    <section class="section" data-section="family"></section>

<div class="modal" id="previewModal"><div class="modal-card"><div class="modal-head"><h3>업로드 자료 미리보기</h3><button class="close" data-close="previewModal">닫기</button></div><pre id="previewText" style="white-space:pre-wrap;font-size:13px"></pre></div></div>
<script>
const APP_KEY='apuda_health_screening_v1';
const sections=[
  ['basic','1','기본 정보'],['lifestyle','2','생활습관'],['family','3','가족력'],['history','4','과거 병력'],
  ['surgery','5','수술 이력'],['medication','6','복용 약'],['allergy','7','알레르기'],['screening','8','자료 분석'],
  ['findings','9','이상 소견'],['labs','10','검사 수치'],['imaging','11','영상검사'],['symptoms','12','현재 증상'],
  ['results','✓','추천 결과']
];
const defaults={
  profile:{name:'',birth:'',birthMonth:'',sex:'',height:'',weight:'',bmi:'',bpSys:'',bpDia:'',waist:''},
  lifestyle:{smoking:'never',cigPerDay:'',smokeYears:'',packYears:'',alcohol:'none',exercise:'',sleep:'',job:'',nightShift:false},
  family:{cancers:[],cardio:false,diabetes:false,dementia:false,rare:false,notes:''},
  conditions:[],cancerHistory:[],surgeries:[],meds:[],allergies:[],screenings:[],findings:[],
  labs:{date:'',cbc:'',ast:'',alt:'',creatinine:'',egfr:'',hba1c:'',ldl:'',hdl:'',tg:'',psa:'',cea:'',afp:'',ca199:'',tsh:'',notes:''},
  imaging:[],symptoms:{selected:[],freeText:''},catalog:[],uploads:[],updatedAt:''
};
const q=s=>document.querySelector(s), qa=s=>[...document.querySelectorAll(s)];
const clone=o=>JSON.parse(JSON.stringify(o));
let state=loadState();
let current='basic';
function loadState(){try{const saved=Object.assign(clone(defaults),JSON.parse(localStorage.getItem(APP_KEY)||'{}'));saved.profile=saved.profile||clone(defaults.profile);if(!saved.profile.birthMonth&&saved.profile.birth)saved.profile.birthMonth=String(saved.profile.birth).slice(0,7);saved.profile.birth='';saved.profile.name='';return saved}catch(e){return clone(defaults)}}
function saveState(show=true){state.updatedAt=new Date().toISOString();let stored=true;try{localStorage.setItem(APP_KEY,JSON.stringify(state))}catch(e){stored=false}updateProgress();if(show)toast(stored?'저장되었습니다. 이 기기에만 보관됩니다.':'브라우저 저장이 차단되어 현재 화면에서만 유지됩니다.')}
function toast(msg){const t=q('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
function esc(v=''){return String(v).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function uid(){return Math.random().toString(36).slice(2,9)}
function age(){const src=state.profile.birthMonth||state.profile.birth;if(!src)return null;const m=String(src).match(/((?:19|20)\d{2})[-/.](\d{1,2})/);if(!m)return null;const y=Number(m[1]),mo=Number(m[2]),n=new Date();let a=n.getFullYear()-y;if((n.getMonth()+1)<mo)a--;return a}
function fmtDate(v){if(!v)return '-';return new Date(v).toLocaleDateString('ko-KR')}
function addMonths(date,months){const d=new Date(date);d.setMonth(d.getMonth()+Number(months||0));return d}
function diffDays(d){return Math.ceil((new Date(d)-new Date())/86400000)}
function latestUpload(type){return [...(state.uploads||[])].reverse().find(x=>x.type===type&&x.status!=='error')||null}
function uploadStatusText(type,count,emptyText){const u=latestUpload(type);if(!u)return count?`현재 ${count}개 항목이 저장되어 있습니다.`:emptyText;const when=u.date?new Date(u.date).toLocaleString('ko-KR'):``;const details=[u.sheet?`시트: ${u.sheet}`:``,Number.isFinite(Number(u.rows))?`${u.rows}개 항목`:count?`${count}개 저장`:``].filter(Boolean).join(' · ');return `최근 첨부: ${u.name}${details?`\n${details}`:``}${when?`\n${when}`:``}`}
function setUploadStatus(id,message,type=``){const el=q(`#${id}`);if(!el)return;el.textContent=message;el.classList.remove('success','error');if(type)el.classList.add(type)}
function bindUploadControl(inputId,buttonId,zoneId,handler){
  const input=q(`#${inputId}`),button=buttonId?q(`#${buttonId}`):null,zone=q(`#${zoneId}`);
  if(!input||!zone)return;
  const choose=()=>{input.value='';input.click()};
  if(button)button.onclick=choose;
  input.onchange=async()=>{
    const file=input.files&&input.files[0];
    if(file){
      const statusId=inputId==='catalogFile'?'catalogStatus':inputId==='screenFile'?'screenStatus':'pdfStatus';
      setUploadStatus(statusId,`${file.name}
파일을 읽기 시작했습니다...`);
      await handler(file);
    }
    input.value='';
  };
  ['dragenter','dragover'].forEach(ev=>zone.addEventListener(ev,e=>{e.preventDefault();e.stopPropagation();zone.classList.add('dragover')}));
  ['dragleave','drop'].forEach(ev=>zone.addEventListener(ev,e=>{e.preventDefault();e.stopPropagation();zone.classList.remove('dragover')}));
  zone.addEventListener('drop',async e=>{const file=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];if(file)await handler(file)});
}
function validateUpload(file,allowed){if(!file)throw new Error('선택된 파일이 없습니다.');if(file.size>20*1024*1024)throw new Error('파일 크기는 20MB 이하만 지원합니다.');const ext=(file.name.split('.').pop()||``).toLowerCase();if(!allowed.includes(ext))throw new Error(`지원하지 않는 파일 형식입니다: .${ext||'없음'}`);return ext}
function loadScriptOnce(src){return new Promise((resolve,reject)=>{const found=[...document.scripts].find(x=>x.src===src);if(found&&window.XLSX)return resolve();const tag=found||document.createElement('script');const timer=setTimeout(()=>reject(new Error('Excel 분석 모듈 연결 시간이 초과되었습니다.')),10000);tag.onload=()=>{clearTimeout(timer);resolve()};tag.onerror=()=>{clearTimeout(timer);reject(new Error('Excel 분석 모듈을 불러오지 못했습니다.'))};if(!found){tag.src=src;tag.async=true;document.head.appendChild(tag)}})}
async function ensureXLSX(){if(window.XLSX)return window.XLSX;const sources=['https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js','https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'];for(const src of sources){try{await loadScriptOnce(src);if(window.XLSX)return window.XLSX}catch(e){}}throw new Error('Excel(.xlsx/.xls) 분석 모듈을 불러오지 못했습니다. 인터넷 연결을 확인하거나 파일을 CSV 형식으로 저장해 업로드하세요.')}
async function ensurePDFJS(){if(window.pdfjsLib)return window.pdfjsLib;const sources=['https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js','https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js'];for(const src of sources){try{await loadScriptOnce(src);if(window.pdfjsLib)return window.pdfjsLib}catch(e){}}throw new Error('PDF 분석 모듈을 불러오지 못했습니다. 인터넷 연결을 확인하세요.')}


function init(){renderNav();renderAll();bindGlobal();showSection(current);updateProgress();}
function renderNav(){const nav=q('#sideNav');if(!nav)return;nav.innerHTML=sections.map(([id,n,label])=>`<button data-nav="${id}" class="${id===current?'active':''}"><span class="num">${n}</span><span>${label}</span></button>`).join('');qa('[data-nav]').forEach(b=>b.onclick=()=>showSection(b.dataset.nav));}
function updateStepUi(){const idx=sections.findIndex(x=>x[0]===current);const item=sections[idx]||sections[0];const label=q('#currentStepLabel'),counter=q('#stepCounter');if(label)label.textContent=item[2];if(counter)counter.textContent=current==='results'?'결과':`${Math.min(idx+1,12)}/12`;}
function showSection(id){current=id;qa('.section').forEach(s=>s.classList.toggle('active',s.dataset.section===id));qa('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===id));updateStepUi();if(id==='results')renderResults();window.scrollTo({top:0,behavior:'smooth'});}
function footer(prev,next){return `<div class="section-footer"><button class="btn" ${!prev?'disabled':''} data-go="${prev||''}">이전</button><button class="btn primary" data-go="${next||'results'}">${next?'다음':'추천 결과 보기'}</button></div>`}
function sectionHead(title,desc,tag=''){return `<div class="section-head"><div><h2>${title}</h2><p>${desc}</p></div>${tag?`<span class="status-pill status-ok">${tag}</span>`:''}</div>`}
function renderAll(){renderBasic();renderLifestyle();renderFamily();renderHistory();renderSurgeries();renderMeds();renderAllergies();renderScreenings();renderFindings();renderLabs();renderImaging();renderSymptoms();renderResults();bindDynamic();}

function renderBasic(){const p=state.profile;q('[data-section="basic"]').innerHTML=`${sectionHead('1. 기본 정보','개인식별정보는 저장하지 않고, 출생 연·월과 건강정보만 사용합니다.')}
<div class="grid">
<label class="field col-6">출생 연·월<input type="month" data-path="profile.birthMonth" value="${esc(p.birthMonth||'')}"><div class="help">정확한 생일은 저장하지 않습니다.</div></label>
<label class="field col-6">성별<select data-path="profile.sex"><option value="">선택</option><option value="male" ${p.sex==='male'?'selected':''}>남성</option><option value="female" ${p.sex==='female'?'selected':''}>여성</option><option value="other" ${p.sex==='other'?'selected':''}>기타/응답 안 함</option></select></label>
<label class="field col-3">키(cm)<input type="number" step="0.1" data-path="profile.height" value="${esc(p.height)}"></label>

<div class="subcard col-6"><h3>자동 계산</h3><div>현재 연령: <b id="ageDisplay">${age() ?? '-'}세</b></div><div>BMI 분류: <b id="bmiLabelDisplay">${bmiLabel(p.bmi)}</b></div></div>
</div>${ageGuideHtml()}${footer('', 'lifestyle')}`}
function ageGuideHtml(){const a=age();if(a===null)return `<div class="age-guide"><b>연령별 안내</b> 생년월일을 입력하면 현재 연령대에서 우선 확인할 정보를 안내합니다.</div>`;let msg='';if(a<30)msg='증상·가족력·생활습관을 먼저 확인하고, 무증상 상태의 고가 영상검사는 필요성을 따져보는 것이 중요합니다.';else if(a<40)msg='혈압·체중·흡연·가족력을 정리하고, 증상 또는 기존 이상 소견이 있으면 일반 패키지보다 해당 항목의 추적계획을 우선 확인하세요.';else if(a<50)msg='국가암검진 대상 항목과 회사 선택검진을 구분해서 확인하세요. 여성은 유방·자궁경부 검진 이력, 모든 성별은 위암검진 이력 확인이 중요합니다.';else if(a<65)msg='대장암 검진 이력, 심혈관·대사 위험, 이전 용종·결절의 추적 시기를 함께 확인하세요.';else msg='복용약, 신장기능, 이전 검사 결과와 추적 시기를 먼저 정리하세요. 필요하면 상단의 “큰 글씨”를 사용하세요.';return `<div class="age-guide"><b>${a}세 사용자 안내</b> ${msg}</div>`}
function inputConfidence(){const items=[(state.profile.birthMonth||state.profile.birth),state.profile.sex,state.conditions.length||state.cancerHistory.length,state.meds.length||'none',state.screenings.length||state.findings.length||state.imaging.length,state.symptoms.selected.length||state.symptoms.freeText];const n=items.filter(Boolean).length;const pct=Math.round(n/items.length*100);return{pct,label:pct>=84?'높음':pct>=50?'보통':'낮음'}}
function safeDescription(text=''){const s=cleanCellText(text);if(!s)return'';if(/아스피린|와파린|항응고|항혈소판|중단|복용.*중지/i.test(s))return '검사기관 안내문에 약물 관련 지시가 포함되어 있습니다. 임의로 약을 중단하지 말고 처방 의료진과 검사기관에 확인하세요.';return s}
function bmiLabel(v){v=Number(v);if(!v)return '-';if(v<18.5)return '저체중';if(v<23)return '정상';if(v<25)return '과체중';if(v<30)return '비만';return '고도비만'}

function renderLifestyle(){const l=state.lifestyle;q('[data-section="lifestyle"]').innerHTML=`${sectionHead('2. 생활습관','흡연, 음주, 운동, 수면과 직업성 위험을 반영합니다.')}
<div class="grid">
<label class="field col-4">흡연 상태<select data-path="lifestyle.smoking"><option value="never" ${l.smoking==='never'?'selected':''}>비흡연</option><option value="former" ${l.smoking==='former'?'selected':''}>과거 흡연</option><option value="current" ${l.smoking==='current'?'selected':''}>현재 흡연</option></select></label>
<label class="field col-4">하루 흡연량(개비)<input type="number" data-path="lifestyle.cigPerDay" value="${esc(l.cigPerDay)}"></label>

<label class="field col-4">음주<select data-path="lifestyle.alcohol"><option value="none" ${l.alcohol==='none'?'selected':''}>안 함</option><option value="light" ${l.alcohol==='light'?'selected':''}>가끔</option><option value="weekly" ${l.alcohol==='weekly'?'selected':''}>주 1회 이상</option><option value="frequent" ${l.alcohol==='frequent'?'selected':''}>주 4회 이상</option></select></label>

</div>${footer('basic','family')}`}

const cancerTypes=['위암','대장암','폐암','간암','유방암','자궁경부암','자궁내막암','난소암','전립선암','췌장암','담낭·담도암','갑상선암','신장암','혈액암','기타'];

const conditionList=['고혈압','당뇨','이상지질혈증','지방간','B형간염','C형간염','심근경색','협심증','뇌졸중','갑상선질환','신장질환','천식','COPD','염증성장질환','골다공증'];

${footer('family','surgery')}`}

function renderSurgeries(){q('[data-section="surgery"]').innerHTML=`${sectionHead('5. 과거 수술 이력','장기 절제 여부는 일부 검사의 필요성과 해석에 영향을 줍니다.')}${arrayTable('surgeries',[['name','수술명','text'],['date','수술 날짜','date'],['hospital','병원','text'],['notes','비고','text']])}${footer('history','medication')}`}

const medClasses={
  '혈압약':['암로디핀','amlodipine','로사르탄','losartan','발사르탄','valsartan','텔미사르탄','telmisartan','비소프롤롤','bisoprolol'],
  '당뇨약':['메트포르민','metformin','글리메피리드','glimepiride','시타글립틴','sitagliptin','다파글리플로진','dapagliflozin','세마글루타이드','semaglutide'],
  '고지혈증약':['로수바스타틴','rosuvastatin','아토르바스타틴','atorvastatin','에제티미브','ezetimibe'],
  '항응고제':['리바록사반','rivaroxaban','아픽사반','apixaban','와파린','warfarin','에독사반','edoxaban','다비가트란','dabigatran'],
  '항혈소판제':['아스피린','aspirin','클로피도그렐','clopidogrel','프라수그렐','prasugrel','티카그렐러','ticagrelor'],

멍울',3);if(ctx.tokens.includes('유방암'))addReason('유방암 가족력/위험',3)}if(/hpv|자궁|난소|roma|ca125/.test(text)){if(ctx.sex==='female')addReason('여성',1);if(ctx.tokens.includes('자궁경부암'))addReason('자궁경부암 위험',3);if(ctx.tokens.includes('난소암'))addReason('난소암 위험',3)}if(/전립선|psa/.test(text)){if(ctx.sex==='male'&&(ctx.age??0)>=50)addReason('50세 이상 남성',2);if(ctx.tokens.includes('배뇨장애'))addReason('배뇨장애',3);if(ctx.tokens.includes('전립선암'))addReason('전립선암 위험',3)}if(/간|복부초음파|afp|m2bpgi/.test(text)){if(ctx.tokens.includes('B형간염'))addReason('B형간염',4);if(ctx.tokens.includes('C형간염'))addReason('C형간염',4);if(ctx.tokens.includes('지방간'))addReason('지방간',2);if(ctx.tokens.includes('음주'))addReason('음주',1);if(ctx.tokens.includes('간암'))addReason('간암 위험',3)}if(/갑상선|tsh/.test(text)){if(ctx.tokens.includes('갑상선질환'))addReason('갑상선질환',3);if(ctx.tokens.includes('갑상선결절'))addReason('갑상선결절',4);if(ctx.tokens.includes('갑상선암'))addReason('갑상선암 위험',3)}if(/신장|gfr|creatinine/.test(text)){if(ctx.tokens.includes('신장질환'))addReason('신장질환',4);if(ctx.tokens.includes('고혈압'))addReason('고혈압',2);if(ctx.tokens.includes('당뇨'))addReason('당뇨',2)}if(/골밀도|골다공/.test(text)){if(ctx.tokens.includes('골다공증'))addReason('골다공증',4);if(ctx.sex==='female'&&(ctx.age??0)>=65)addReason('65세 이상 여성',2);if(ctx.sex==='male'&&(ctx.age??0)>=70)addReason('70세 이상 남성',2)}if(/알레르|알러지|mast/.test(text)&&ctx.tokens.includes('천식'))addReason('천식/알레르기',3);const prior=priorMatchInfo(item);if(prior){if(prior.abnormal){addReason(prior.note,4)}else if(prior.monthsAgo<=24){score-=3}}const evidence=screeningEvidence(item,ctx);if(evidence.level==='A')score+=4;else if(evidence.level==='B')score+=2;else if(evidence.level==='D')score-=5;return score>0?{score,reasons,evidence,historyNote:prior?prior.note:''}:null}
function buildCatalogRecommendations(){const ctx=buildUserHealthContext(),groupMap=new Map(),additional=[],lowEvidence=[];for(const item of state.catalog){if(!catalogEligible(item,ctx.age,ctx.sex))continue;const meta=parsePackageMeta(item.package||'');const evidence=screeningEvidence(item,ctx);const scored=scoreCatalogItem(item,ctx);const enriched={...item,score:scored?scored.score:0,reasons:scored?scored.reasons:[],evidence,historyNote:scored?.historyNote||''};if(meta.isChoice){const key=meta.label||cleanCellText(item.package)||'선택검사';if(!groupMap.has(key))groupMap.set(key,{label:key,selectCount:meta.selectCount||1,candidates:[]});groupMap.get(key).candidates.push(enriched)}else if(evidence.level==='D')lowEvidence.push(enriched);else if(scored)additional.push(enriched)}const choiceGroups=[...groupMap.values()].map(group=>{const usable=group.candidates.filter(x=>x.evidence.level!=='D'&&x.score>0).sort((a,b)=>b.score-a.score);return{label:group.label,selectCount:group.selectCount,items:usable.slice(0,Math.max(1,group.selectCount)),defer:usable.length===0,alternatives:group.candidates.filter(x=>x.evidence.level==='D').slice(0,3)}});return{choiceGroups,additional:additional.sort((a,b)=>b.score-a.score).slice(0,8),lowEvidence:lowEvidence.slice(0,12)}}
function evidenceBadge(e){const level=(e&&e.level)||'C';const cls={'A':'evidence-a','B':'evidence-b','C':'evidence-c','D':'evidence-d'}[level]||'evidence-c';return `<span class="evidence-pill ${cls}">${level} · ${esc(e&&e.label||'개별 판단')}</span>`}
function catalogChoiceHtml(plan=buildCatalogRecommendations()){if(!plan.choiceGroups.length)return `<div class="empty">엑셀에서 선택형 패키지 그룹을 찾지 못했습니다.</div>`;return `<div class="result-grid">${plan.choiceGroups.map(group=>`<div class="result-box follow"><h3>📦 ${esc(group.label)}</h3>${group.defer?`<div class="empty"><b>의학적으로 뚜렷한 우선선택이 없습니다.</b><br>패키지상 반드시 골라야 한다면 최근 검사 이력과 담당 의료진 의견을 확인하거나 검사기관에 대체 가능 여부를 문의하세요.</div>`:`<ul>${group.items.map(item=>`<li><b>${esc(item.test)}</b><div>${evidenceBadge(item.evidence)}</div>${item.reasons&&item.reasons.length?`<span class="evidence">선택 근거: ${esc(item.reasons.slice(0,5).join(', '))}</span>`:''}<span class="evidence">${esc(item.evidence.note)}</span>${item.historyNote?`<span class="evidence"><b>이전 기록:</b> ${esc(item.historyNote)}</span>`:'' }${safeDescription(item.description)?`<span class="evidence">${esc(safeDescription(item.description).slice(0,180))}</span>`:''}${item.cost?`<span class="evidence">검진표 표시 비용: ${Number(item.cost).toLocaleString()}원</span>`:''}</li>`).join('')}</ul>`}</div>`).join('')}</div><div class="help" style="margin-top:8px">A/B/C/D 등급은 이 앱의 설명용 분류입니다. A=국가검진/고위험군 기준과 직접 연계, B=위험도·공동의사결정, C=증상·과거 소견 등 맥락 필요, D=무증상 일반 선별 근거 제한.</div>`}
function catalogAdditionalHtml(plan=buildCatalogRecommendations()){if(!plan.additional.length)return `<div class="empty">현재 입력 정보와 직접 연결되는 추가 선택검사가 없습니다. 이것은 “검사를 더 받아야 한다”는 뜻이 아닙니다.</div>`;return `<ul style="margin:0;padding-left:20px">${plan.additional.map(item=>`<li style="margin:10px 0"><b>${esc(item.test)}</b> ${evidenceBadge(item.evidence)}${item.reasons&&item.reasons.length?`<span class="evidence">건강 상태 연계: ${esc(item.reasons.slice(0,5).join(', '))}</span>`:''}<span class="evidence">${esc(item.evidence.note)}</span>${item.historyNote?`<span class="evidence"><b>이전 기록:</b> ${esc(item.historyNote)}</span>`:'' }${safeDescription(item.description)?`<span class="evidence">${esc(safeDescription(item.description).slice(0,160))}</span>`:''}</li>`).join('')}</ul>`}
function catalogLowEvidenceHtml(plan=buildCatalogRecommendations()){return `<div class="notice" style="margin-bottom:10px"><b>과잉검사 방지:</b> 아래 항목은 회사 검진표에 있어도 무증상 일반인의 정기 선별검사로 일괄 추천하지 않습니다. 특정 증상·질환·전문의 판단이 있으면 의미가 달라질 수 있습니다.</div><ul style="margin:0;padding-left:20px">${plan.lowEvidence.map(item=>`<li style="margin:8px 0"><b>${esc(item.test)}</b> ${evidenceBadge(item.evidence)}<span class="evidence">${esc(item.evidence.note)}</span>${item.historyNote?`<span class="evidence"><b>이전 기록:</b> ${esc(item.historyNote)}</span>`:'' }</li>`).join('')}</ul>`}

function extractScreeningsFromPdfText(text){
  const patterns=[
    {test:'위내시경',aliases:['위내시경','상부위장관내시경','위장내시경','gastroscopy','egd']},
    {test:'대장내시경',aliases:['대장내시경','colonoscopy']},
    {test:'저선량 흉부 CT',aliases:['저선량 흉부 ct','저선량ct','low-dose chest ct','ldct']},
    {test:'복부초음파',aliases:['복부초음파','간초음파','abdomen ultrasound','abdominal ultrasound']},
    {test:'유방촬영술',aliases:['유방촬영술','유방촬영','맘모그래피','mammography']},
    {test:'골밀도검사',aliases:['골밀도검사','골밀도','dxa']},
    {test:'갑상선초음파',aliases:['갑상선초음파','thyroid ultrasound']},
    {test:'흉부 X-ray',aliases:['흉부 x-ray','흉부x선','chest x-ray']},
    {test:'PSA',aliases:['psa']},
    {test:'CEA',aliases:['cea']},
    {test:'AFP',aliases:['afp']},
    {test:'CA19-9',aliases:['ca19-9','ca 19-9']}
  ];
  const raw=String(text||'').replace(/\s+/g,' ').trim();
  if(!raw) return [];
  const results=[];
  const dateMatches=[...raw.matchAll(/(20\d{2}[.\-/년]\s?\d{1,2}(?:[.\-/월]\s?\d{1,2})?\s?(?:일)?)/g)].map(m=>m[1]);
  const defaultDate=dateMatches[0]?normalizePdfDate(dateMatches[0]):'';
  for(const item of patterns){
    let foundIndex=-1, aliasFound='';
    for(const alias of item.aliases){
      const idx=raw.toLowerCase().indexOf(alias.toLowerCase());
      if(idx!==-1){foundIndex=idx; aliasFound=alias; break;}
    }
    if(foundIndex===-1) continue;
    const start=Math.max(0,foundIndex-80), end=Math.min(raw.length, foundIndex+160);
    const snippet=raw.slice(start,end);
    const dmatch=snippet.match(/(20\d{2}[.\-/년]\s?\d{1,2}(?:[.\-/월]\s?\d{1,2})?\s?(?:일)?)/);
    const date=normalizePdfDate(dmatch?dmatch[1]:defaultDate);
    let result='';
    const keywords=['정상','이상없음','이상 소견 없음','용종','결절','지방간','낭종','제거','추적','비정상','권고','의심','미세석회화'];
    for(const key of keywords){
      const idx=snippet.indexOf(key);
      if(idx!==-1){result=snippet.slice(Math.max(0,idx-18), Math.min(snippet.length,idx+28)).trim(); break;}
    }
    if(!result){ result=snippet.replace(new RegExp(aliasFound,'ig'), item.test).slice(0,60).trim(); }
    results.push({test:item.test,date,result,followupMonths:'',cost:''});
  }
  const uniq=[]; const seen=new Set();
  results.forEach(r=>{const key=`${r.test}|${r.date}`; if(!seen.has(key)){seen.add(key); uniq.push(r)}});
  return uniq;
}
function normalizePdfDate(value){
  const src=String(value||'').trim();
  if(!src) return '';
  const m=src.match(/(20\d{2})[.\-/년]\s?(\d{1,2})(?:[.\-/월]\s?(\d{1,2}))?/);
  if(!m) return '';
  const y=m[1], mo=String(m[2]).padStart(2,'0'), da=String(m[3]||'01').padStart(2,'0');
  return `${y}-${mo}-${da}`;
}

function printTimelineHtml(){

  if(!items.length) return '<div class="print-empty">검사 이력이 없습니다.</div>';

}

  <script>
  function fitOnePage(){
    const area=document.getElementById('printArea');
    const report=document.getElementById('report');
    const status=document.getElementById('fitStatus');
    if(!area||!report)return 1;
    report.style.transform='none';
    report.style.width='194mm';
    const naturalWidth=Math.max(report.scrollWidth,1);
    const naturalHeight=Math.max(report.scrollHeight,1);
    const availableWidth=Math.max(area.clientWidth,1);
    const availableHeight=Math.max(area.clientHeight,1);
    const scale=Math.min(1,availableWidth/naturalWidth,availableHeight/naturalHeight)*0.985;
    report.style.transform='scale('+scale.toFixed(4)+')';
    if(status)status.textContent='A4 1페이지 맞춤 배율 '+Math.round(scale*100)+'%';
    return scale;
  }
  async function preparePrint(){
    try{if(document.fonts&&document.fonts.ready)await document.fonts.ready}catch(e){}
    fitOnePage();
    requestAnimationFrame(()=>{fitOnePage();setTimeout(()=>{fitOnePage();window.print()},450)});
  }
  window.addEventListener('resize',()=>fitOnePage());
  window.addEventListener('beforeprint',()=>fitOnePage());
  window.onload=preparePrint;

  const blob=new Blob([html],{type:'text/html;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  let previewWindow=null;
  try{previewWindow=window.open(url,'_blank','width=1280,height=980')}catch(e){}
  if(!previewWindow){
    const link=document.createElement('a');
    link.href=url;
    link.target='_blank';
    link.rel='noopener';
    document.body.appendChild(link);
    link.click();
    link.remove();
    toast('인쇄 미리보기 새 탭을 열었습니다. 열리지 않으면 팝업 차단을 해제하세요.');
  }
  setTimeout(()=>URL.revokeObjectURL(url),120000);
}
function bindGlobal(){q('#saveBtn').onclick=()=>saveState(true);q('#resultBtn').onclick=()=>{saveState(false);showSection('results')};q('#backupBtn').onclick=backup;q('#restoreBtn').onclick=()=>q('#restoreInput').click();q('#restoreInput').onchange=restore;q('#printBtn').onclick=()=>{showSection('results');setTimeout(()=>openPrintReport(),200)};const fontBtn=q('#fontBtn');const fontKey='apuda_large_text';const applyFont=()=>{let large=false;try{large=localStorage.getItem(fontKey)==='1'}catch(e){}document.body.classList.toggle('large-text',large);fontBtn.setAttribute('aria-pressed',large?'true':'false');fontBtn.textContent=large?'기본 글씨':'큰 글씨'};fontBtn.onclick=()=>{const next=!document.body.classList.contains('large-text');try{localStorage.setItem(fontKey,next?'1':'0')}catch(e){}applyFont()};applyFont();q('#resetBtn').onclick=()=>{if(confirm('이 브라우저에 저장된 모든 입력을 삭제할까요?')){try{localStorage.removeItem(APP_KEY)}catch(e){}state=clone(defaults);current='basic';renderAll();renderNav();showSection('basic');toast('초기화했습니다.')}};qa('[data-close]').forEach(b=>b.onclick=()=>q('#'+b.dataset.close).classList.remove('open'));window.addEventListener('beforeunload',()=>saveState(false));}
function backup(){saveState(false);const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`ApuDa_건강검진_백업_${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(a.href)}
async function restore(e){const file=e.target.files[0];if(!file)return;try{state=Object.assign(clone(defaults),JSON.parse(await file.text()));saveState(false);renderAll();showSection('basic');toast('백업 데이터를 복원했습니다.')}catch(err){alert('복원할 수 없는 파일입니다.')}}
