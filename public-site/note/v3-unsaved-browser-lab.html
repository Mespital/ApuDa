<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'none'; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>ApuDa V3 가상 저장 실패 브라우저 시험</title>
<style>
body{font:16px/1.65 system-ui,sans-serif;max-width:650px;margin:20px auto;padding:0 12px;color:#14213a}
button{min-height:44px;padding:8px 16px;margin:4px;border:1px solid #ccc;border-radius:8px;background:#fff;color:#14213a}
button:focus-visible{outline:3px solid #1467e8}
#alert{border:2px solid #b54708;padding:14px;background:#fff7e6;border-radius:9px}
pre{white-space:pre-wrap;overflow-wrap:anywhere;border:1px solid #ddd;padding:12px;font-size:.8em}
small{color:#545c69}
</style>
</head>
<body>
<main>
<h1>ApuDa V3 가상 기록 저장 실패 시험</h1>
<p>실제 환자 기록과 분리된 합성 데이터 시험입니다. 브라우저의 localStorage와 Google Drive에는 접근하지 않습니다.</p>
<div>
<button type="button" id="conflict">건강기록 충돌</button>
<button type="button" id="chat-conflict">대화 충돌</button>
<button type="button" id="quota">저장 용량 오류</button>
<button type="button" id="reset-test">시험 초기화</button>
</div>
<div id="alert" role="alert" hidden>
<strong>저장하지 못한 수정이 있습니다.</strong>
<p id="alert-summary"></p>
<button id="export" type="button">미저장 내용 JSON 내려받기</button>
<p><small>파일은 암호화되지 않은 검토용 JSON이며 일반 ApuDa 백업 복원 파일이 아닙니다.</small></p>
</div>
<p id="status" role="status">시작 전</p>
<pre id="details" aria-label="가상 데이터 시험 상태"></pre>
</main>
<script src="./note-write-fence.js"></script>
<script src="./note-unsaved-draft.js"></script>
<script src="./v3-unsaved-browser-lab.js"></script>
</body></html>
