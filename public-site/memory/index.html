<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ApuDa 기억돌봄</title>
<meta name="description" content="치매가 걱정될 때 쓰는 ApuDa 기억돌봄. 기억 변화 자가 체크, 치매예방수칙 3·3·3, 돌봄 기록과 진료 준비를 한곳에서. 진단이나 처방을 하지 않아요.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B5FA5">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./favicon.png" type="image/png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="기억돌봄">
<meta property="og:type" content="website">
<meta property="og:title" content="ApuDa 기억돌봄">
<meta property="og:description" content="기억 변화 자가 체크 · 치매 예방 · 돌봄 기록">
<meta property="og:image" content="https://apuda.app/memory/og.png">
<meta property="og:url" content="https://apuda.app/memory/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--p:#0B5FA5;--ph:#094E88;--soft:#E6F0FA;--cv:#F2F6FA;--sf:#FFFFFF;--tx:#16304A;--t2:#475B70;--bd:#D5E1EC;--nt:#5E7186;--ok:#1F6B4C;--okbg:#E7F3EC;--wn:#8A5600;--wnbg:#FFF4D1;--dg:#B42318;--dgbg:#FDECEA;--gold:#F5B301}
*{box-sizing:border-box}
html{font-size:16px;-webkit-text-size-adjust:100%}
html.fs1{font-size:18px}html.fs2{font-size:20px}
body{margin:0;background:#D9E4EE;font-family:'IBM Plex Sans KR','Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:var(--tx);word-break:keep-all;overflow-wrap:break-word;line-height:1.5}
#app{max-width:440px;margin:0 auto;min-height:100vh;min-height:100dvh;background:var(--cv);position:relative;box-shadow:0 0 40px rgba(31,45,61,.10);display:flex;flex-direction:column}
a{color:var(--p)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--p);outline-offset:2px}
svg{flex-shrink:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* top bar */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:10px 16px;background:rgba(250,248,244,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--bd)}
.brand{display:inline-flex;align-items:center;gap:6px;text-decoration:none;min-height:44px;padding:0 4px;border-radius:12px}
.brand b{font-size:20px;font-weight:700;color:var(--p);letter-spacing:-.01em}
.brand i{width:8px;height:8px;border-radius:50%;background:var(--gold)}
.brand span{font-size:15px;font-weight:500;color:var(--t2)}
.top .sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:4px;min-height:44px;padding:6px 12px;border-radius:999px;border:1px solid var(--bd);background:var(--sf);font-size:14px;font-weight:700;color:var(--p);text-decoration:none;white-space:nowrap}
.iconbtn{font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:2px;min-width:48px;min-height:44px;padding:6px 10px;border-radius:999px;border:1px solid var(--bd);background:var(--sf);font-weight:700;color:var(--tx)}

/* main */
main{flex:1;padding:16px 16px 24px;display:flex;flex-direction:column;gap:16px}
main.withtabs{padding-bottom:104px}
h1{margin:0;font-size:1.625rem;line-height:1.35}
h2{margin:0;font-size:1.25rem;line-height:1.4}
h3{margin:0;font-size:1.125rem;line-height:1.4}
p{margin:0}
.muted{color:var(--t2)}
.small{font-size:.9375rem}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:20px;box-shadow:0 2px 10px rgba(31,45,61,.05);padding:18px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

/* hero */
.hero{border-radius:24px;padding:20px;background:var(--soft);display:flex;flex-direction:column;gap:4px}
.core{border-radius:24px;padding:22px 20px;background:var(--p);color:#fff;display:flex;flex-direction:column;gap:12px;box-shadow:0 8px 24px rgba(11,95,165,.25)}
.core .eyebrow{display:inline-flex;align-self:flex-start;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;background:rgba(255,255,255,.16);font-size:.875rem;font-weight:700}
.core h2{font-size:1.5rem;color:#fff}
.core p{color:#fff}
.core .last{font-size:.9375rem;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.12)}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:12px 20px;border-radius:18px;border:2px solid var(--p);background:var(--p);color:#fff;font-weight:700;font-size:1.0625rem;line-height:1.35;text-align:center;text-decoration:none;box-shadow:0 4px 12px rgba(11,95,165,.20);width:100%}
.btn:active{background:var(--ph)}
.btn.s{background:var(--sf);color:var(--p);box-shadow:none}
.btn.g{background:var(--gold);border-color:var(--gold);color:var(--tx);box-shadow:none}
.btn.d{background:var(--dg);border-color:var(--dg);box-shadow:none}
.btn.do{background:var(--sf);color:var(--dg);border-color:var(--dg);box-shadow:none}
.btn.sm{min-height:52px;font-size:1rem;padding:10px 14px}
.btn[disabled]{background:#E8EDF3;border-color:#E8EDF3;color:#5B6878;box-shadow:none;cursor:default}
.btns{display:flex;flex-direction:column;gap:10px}
.btns.h{flex-direction:row}
.btns.h>*{flex:1 1 0;min-width:0}
.link{display:inline-flex;align-items:center;gap:6px;min-height:52px;background:none;border:0;padding:0;color:var(--p);font-weight:700;text-decoration:underline;text-underline-offset:3px}

/* tiles */
.tile{display:flex;align-items:center;gap:14px;padding:16px;border-radius:20px;background:var(--sf);border:1px solid var(--bd);box-shadow:0 2px 10px rgba(31,45,61,.05);text-decoration:none;color:var(--tx);text-align:left;width:100%}
.tile .ic{display:flex;align-items:center;justify-content:center;width:52px;height:52px;border-radius:16px;background:var(--soft)}
.tile .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.tile .tx b{font-size:1.0625rem}
.tile .tx span{font-size:.9375rem;color:var(--t2)}

/* metric */
.metric{display:flex;flex-direction:column;gap:6px;padding:12px;border-radius:18px;background:var(--sf);border:1px solid var(--nt);text-align:left;min-height:136px}
.metric .top2{display:flex;justify-content:space-between;align-items:center}
.metric b{font-size:1.0625rem}
.metric .st{font-size:.9375rem;color:var(--t2)}
.metric .st.ok{color:var(--ok)}.metric .st.wn{color:var(--wn)}
.metric .go{font-size:.9375rem;font-weight:700;color:var(--p);margin-top:auto}

/* options */
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:12px 14px;border-radius:16px;border:1px solid var(--nt);background:var(--sf);text-align:left;font-weight:500;font-size:1.0625rem;line-height:1.4}
.opt .rd{display:flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;border:2px solid var(--nt)}
.opt .rd i{width:12px;height:12px;border-radius:50%;background:var(--p);display:none}
.opt .lb{flex:1;min-width:0}
.opt .mk{display:none;align-items:center;gap:4px;font-size:.875rem;font-weight:700;color:var(--p);white-space:nowrap}
.opt[aria-pressed=true]{background:var(--soft);border:2px solid var(--p);font-weight:700}
.opt[aria-pressed=true] .rd{border-color:var(--p)}
.opt[aria-pressed=true] .rd i{display:block}
.opt[aria-pressed=true] .mk{display:inline-flex}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{flex:1 1 0;min-width:72px;display:flex;align-items:center;justify-content:center;gap:4px;min-height:52px;padding:8px;border-radius:14px;border:1px solid var(--nt);background:var(--sf);font-weight:700}
.seg button[aria-pressed=true]{background:var(--p);border-color:var(--p);color:#fff}
.seg button .ck{display:none}
.seg button[aria-pressed=true] .ck{display:inline-flex}

/* answer buttons (check kit) */
.ans{display:flex;flex-direction:column;gap:10px}
.ans button{min-height:64px;padding:14px 18px;border-radius:18px;border:2px solid var(--p);background:var(--sf);color:var(--p);font-size:1.1875rem;font-weight:700;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:10px}
.ans button[aria-pressed=true]{background:var(--p);color:#fff}
.ans button.q{border-color:var(--nt);color:var(--tx);font-weight:500}
.ans button.q[aria-pressed=true]{background:var(--nt);color:#fff}
.prog{height:10px;border-radius:999px;background:var(--bd);overflow:hidden}
.prog i{display:block;height:100%;background:var(--p);border-radius:999px;transition:width .2s}
.qtext{font-size:1.5rem;font-weight:700;line-height:1.45}

/* tags, banners */
.tag{display:inline-flex;align-self:flex-start;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:.875rem;font-weight:700;border:1px solid currentColor;white-space:nowrap}
.tag.p{color:var(--p);background:var(--soft)}
.tag.ok{color:var(--ok);background:var(--okbg)}
.tag.wn{color:var(--wn);background:var(--wnbg)}
.tag.dg{color:var(--dg);background:var(--dgbg)}
.tag.nt{color:var(--nt);background:var(--sf)}
.banner{display:flex;gap:12px;padding:14px 16px;border-radius:16px;background:var(--soft);border:1px solid var(--p);font-size:.9375rem;line-height:1.55}
.banner.urgent{background:var(--sf);border:2px solid var(--dg)}
.banner.warn{background:var(--wnbg);border-color:var(--wn)}
.banner.ok{background:var(--okbg);border-color:var(--ok)}

/* list */
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;flex-direction:column;gap:6px;padding:14px 16px;border-radius:18px;background:var(--sf);border:1px solid var(--bd)}
.item.dash{border:2px dashed var(--wn)}
.item .meta{font-size:.875rem;color:var(--t2)}
.lrow{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:12px 16px;border-radius:18px;background:var(--sf);border:1px solid var(--bd);text-align:left;text-decoration:none;color:var(--tx)}
.lrow .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.lrow .tx b{font-size:1.0625rem}
.lrow .tx span{font-size:.875rem;color:var(--t2)}
.ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.ul li{display:flex;gap:10px;align-items:flex-start}

/* fields */
label.f{display:flex;flex-direction:column;gap:6px;font-weight:500;font-size:1rem}
.in,textarea.in,select.in{min-height:56px;padding:12px 14px;border-radius:14px;border:1px solid var(--nt);background:var(--sf);font-size:1.0625rem;width:100%}
textarea.in{min-height:96px;resize:vertical;line-height:1.5}
.in::placeholder{color:var(--t2);opacity:1}
.help{font-size:.875rem;color:var(--t2)}

/* switch */
.sw{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:12px 16px;border-radius:18px;background:var(--sf);border:1px solid var(--bd);text-align:left}
.sw .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.sw .tx span{font-size:.875rem;color:var(--t2)}
.sw .st{font-size:.9375rem;font-weight:700;color:var(--t2);white-space:nowrap}
.sw .tr{display:flex;align-items:center;width:56px;height:32px;padding:4px;border-radius:999px;border:2px solid var(--nt);background:var(--sf)}
.sw .tr i{width:20px;height:20px;border-radius:50%;background:var(--nt)}
.sw[aria-checked=true] .st{color:var(--p)}
.sw[aria-checked=true] .tr{justify-content:flex-end;background:var(--p);border-color:var(--p)}
.sw[aria-checked=true] .tr i{background:#fff}

/* habits */
.habit{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:10px 14px;border-radius:16px;border:1px solid var(--bd);background:var(--sf);text-align:left;font-size:1.0625rem;font-weight:500}
.habit .bx{display:flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:8px;border:2px solid var(--nt);background:var(--sf)}
.habit .bx svg{display:none}
.habit[aria-pressed=true]{background:var(--okbg);border-color:var(--ok)}
.habit[aria-pressed=true] .bx{background:var(--ok);border-color:var(--ok)}
.habit[aria-pressed=true] .bx svg{display:block}
.habit .done{display:none;font-size:.875rem;font-weight:700;color:var(--ok);white-space:nowrap}
.habit[aria-pressed=true] .done{display:inline}

/* patient */
.big{display:flex;align-items:center;gap:16px;padding:20px;min-height:112px;border-radius:24px;border:2px solid var(--p);background:var(--sf);box-shadow:0 4px 14px rgba(11,95,165,.10);text-align:left;color:var(--tx);text-decoration:none;width:100%}
.big .ic{display:flex;align-items:center;justify-content:center;width:68px;height:68px;border-radius:20px;background:var(--soft)}
.big b{display:block;font-size:1.375rem}
.big span{display:block;font-size:1.125rem;color:var(--t2)}
.pt .qtext{font-size:1.625rem}

/* steps */
.step{display:flex;gap:14px}
.step .n{display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:50%;background:var(--p);color:#fff;font-weight:700;flex-shrink:0}
.cmp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.cmp>div{padding:14px;border-radius:16px;display:flex;flex-direction:column;gap:8px;font-size:.9375rem}
.cmp .a{background:var(--soft)}.cmp .b{background:var(--wnbg)}

/* footer */
.foot{margin-top:8px;display:flex;flex-direction:column;align-items:center;gap:8px;padding:22px 16px;border-radius:22px;background:var(--sf);border:1px solid var(--bd);text-align:center}
.foot .wm{display:inline-flex;align-items:center;gap:6px}
.foot .wm b{font-size:1.5rem;color:var(--p)}
.foot .wm i{width:8px;height:8px;border-radius:50%;background:var(--gold)}
.foot .tag2{font-weight:500;color:var(--t2)}
.foot .note{font-size:.8125rem;color:var(--t2)}

/* tabs */
.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;z-index:20;display:flex;padding:6px 6px calc(10px + env(safe-area-inset-bottom));background:var(--sf);border-top:1px solid var(--bd)}
.tabs a{flex:1 1 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:64px;text-decoration:none;color:var(--t2);font-size:13px;font-weight:500;white-space:nowrap;min-width:0}
.tabs a .pill{display:flex;padding:4px 16px;border-radius:999px}
.tabs a .bar{width:28px;height:3px;border-radius:2px;background:transparent}
.tabs a[aria-current=page]{color:var(--p);font-weight:700}
.tabs a[aria-current=page] .pill{background:var(--soft)}
.tabs a[aria-current=page] .bar{background:var(--gold)}

/* dialog, toast, sheet */
.ov{position:fixed;inset:0;z-index:50;background:rgba(31,45,61,.55);display:flex;align-items:center;justify-content:center;padding:20px}
.ov[hidden]{display:none}
.dlg{width:100%;max-width:380px;max-height:86vh;overflow:auto;background:var(--sf);border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;z-index:60;width:calc(100% - 32px);max-width:400px;display:flex;align-items:center;gap:10px;padding:12px 16px;min-height:56px;border-radius:16px;background:var(--tx);color:#fff;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast[hidden]{display:none}
pre.txt{margin:0;white-space:pre-wrap;font-family:inherit;font-size:.9375rem;line-height:1.6;background:var(--cv);border:1px solid var(--bd);border-radius:14px;padding:14px;max-height:46vh;overflow:auto}
@media (prefers-reduced-motion:no-preference){main{animation:fade .18s ease-out}@keyframes fade{from{opacity:.5;transform:translateY(4px)}to{opacity:1;transform:none}}}
/* ===== ApuDa brand layer ===== */
h1{font-family:'Gowun Batang','Noto Serif KR',serif;font-weight:700;letter-spacing:-.01em}
.top{background:var(--p);border-bottom:0;backdrop-filter:none}
.top .brand b{color:#fff}.top .brand span{color:rgba(255,255,255,.86)}
.top .chip,.top .iconbtn{background:transparent;color:#fff;border-color:rgba(255,255,255,.5)}
.top .chip.sos{background:#fff;color:var(--dg);border-color:#fff;font-size:17px;min-height:52px;padding:8px 16px}
.canopy{margin:-16px -16px 2px;padding:10px 20px 28px;background:var(--p);color:#fff;border-radius:0 0 30px 30px;display:flex;flex-direction:column;gap:8px}
.canopy h1{color:#fff;font-size:1.875rem;line-height:1.3}
.canopy p{color:rgba(255,255,255,.9)}
.canopy .cn-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.canopy .chip{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.45)}
.canopy .tag.p{background:rgba(255,255,255,.16);color:#fff;border-color:rgba(255,255,255,.5)}
.canopy .ask{margin-top:10px;padding:18px;border-radius:22px;background:#fff;color:var(--tx);display:flex;flex-direction:column;gap:10px}
.canopy .ask .tag.p{background:var(--soft);color:var(--p);border-color:var(--p)}
.canopy .ask h2{font-size:1.3125rem;color:var(--tx)}
.canopy .ask p{color:var(--t2)}
.canopy .ask .last{font-size:.9375rem;color:var(--p);font-weight:700}
.core{background:var(--sf);color:var(--tx);border:2px solid var(--p);box-shadow:none}
.core .eyebrow{background:var(--soft);color:var(--p)}
.core h2{color:var(--tx)}.core p{color:var(--t2)}
.core .last{background:var(--soft);color:var(--p)}
.card,.tile,.item,.lrow,.sw,.habit{box-shadow:none}
.metric{border-color:var(--bd)}
.group{background:var(--sf);border:1px solid var(--bd);border-radius:22px;overflow:hidden;display:flex;flex-direction:column}
.group>.tile,.group>.lrow{border:0;border-radius:0;border-top:1px solid var(--bd)}
.group>:first-child{border-top:0}
.btn{border-radius:16px;box-shadow:none}
.btn.s{border-width:1.5px}
.btn.g{color:#16304A}
.foot{margin:12px -16px -24px;padding:30px 20px 36px;border:0;border-radius:30px 30px 0 0;background:var(--p);color:#fff}
main.withtabs .foot{margin-bottom:-104px;padding-bottom:132px}
.foot .wm b{color:#fff}.foot .tag2{color:rgba(255,255,255,.92)}.foot .note{color:rgba(255,255,255,.85)}
.foot .btn.s{background:#fff;color:var(--p);border-color:#fff}
.tabs{box-shadow:0 -4px 16px rgba(22,48,74,.06)}
</style>
</head>
<body>
<div id="app">
  <header class="top" id="top"></header>
  <main id="view" tabindex="-1"></main>
  <nav class="tabs" id="tabs" aria-label="주요 메뉴"></nav>
</div>
<div class="ov" id="ov" hidden><div class="dlg" id="dlg" role="dialog" aria-modal="true" aria-labelledby="dlgT"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
(function(){
'use strict';
/* ---------- icons ---------- */
const PATHS={
 cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
 phone:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/>',
 pill:'<rect x="3" y="8" width="18" height="8" rx="4"/><path d="M12 8v8"/>',
 meal:'<path d="M3 11h18a9 9 0 0 1-18 0z"/><path d="M8 4v3M12 3v4M16 4v3"/>',
 sleep:'<path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/>',

 h+=g('med',MED,'pill','약 확인',['confirmed','not_taken','unknown','none'])+g('meal',MS,'meal','식사',['same','diff','unk','none'])+g('sleep',MS,'sleep','수면',['same','diff','unk','none']);
 h+='<section class="card"><div class="row">'+I('pencil',24,P)+'<h2>오늘 달랐던 점</h2></div><label class="f">본 것 (사실)<textarea class="in" id="note" placeholder="예: 저녁에 평소보다 일찍 잠들었어요">'+esc(r.note)+'</textarea></label><label class="f">내 생각 (선택)<textarea class="in" id="opinion" placeholder="예: 낮에 많이 걸어서 그런 것 같아요">'+esc(r.opinion)+'</textarea><span class="help">짐작이나 느낌은 여기에 따로 적어요. 진료 요약에서 사실과 나눠서 보여 드려요.</span></label></section>';
 h+='<div class="btns"><button type="button" class="btn" data-act="saverec">기록 저장</button><a class="btn s" href="#event">'+I('warn',22)+' 특별한 일 기록 (넘어짐 등)</a></div>';
 const days=Object.keys(S.records).sort().reverse(),evs=S.events.slice().reverse();
 h+='<section class="sec"><h2>지난 기록</h2><div class="seg" role="group" aria-label="기록 종류">'+[['all','전체'],['med','복약'],['ms','식사·수면'],['ev','특별한 일']].map(f=>'<button type="button" data-act="recf" data-f="'+f[0]+'" aria-pressed="'+(recFilter===f[0]?'true':'false')+'"><span class="ck">'+I('check',18)+'</span>'+f[1]+'</button>').join('')+'</div>';

function buildSummary(){
 const ks=daysBack(period),rs=ks.map(k=>S.records[k]).filter(Boolean),c={confirmed:0,not_taken:0,unknown:0};let md=0,sd=0;
 rs.forEach(r=>{if(c[r.med]!==undefined)c[r.med]++;if(r.meal==='diff')md++;if(r.sleep==='diff')sd++;});
 const recDays=rs.length,medNone=period-c.confirmed-c.not_taken-c.unknown;
 const notes=ks.slice().reverse().filter(k=>S.records[k]&&S.records[k].note).map(k=>fmt(k,false)+' — '+S.records[k].note);
 const ops=ks.slice().reverse().filter(k=>S.records[k]&&S.records[k].opinion).map(k=>fmt(k,false)+' — '+S.records[k].opinion);
 const evs=S.events.filter(e=>ks.indexOf(e.date)>=0).map(e=>fmt(e.date,false)+' — '+e.kind+(e.text?': '+e.text:''));
 const chs=S.checks.filter(x=>ks.indexOf(x.date)>=0).map(x=>fmt(x.date,false)+' — 기억 변화 체크('+(x.who==='self'?'본인':'가족')+'), 달라진 점 '+changed(x)+'가지'+(x.red==='yes'?', 갑작스러운 변화 있음':''));
 const qs=S.questions.filter(q=>!q.done).map((q,i)=>(i+1)+'. '+q.text);
 return {recDays,c,medNone,md,sd,notes,ops,evs,chs,qs,from:ks[ks.length-1],to:ks[0]};}
function sumText(s){const name=shareOpt.alias?'돌봄 대상 A':S.subject;const L=[];
 L.push('[진료용 요약] '+name+' · '+fmt(s.from,false)+' ~ '+fmt(s.to,false)+' ('+period+'일)','');
 L.push('■ 관찰한 사실','- 기록한 날 '+s.recDays+'일 / 기록하지 않은 날 '+(period-s.recDays)+'일');
 L.push('- 약 확인: 복용 확인 '+s.c.confirmed+'일, 복용하지 않음 '+s.c.not_taken+'일, 확인 못 함 '+s.c.unknown+'일, 기록 없음 '+s.medNone+'일','  (기록 없음은 복용하지 않았다는 뜻이 아님)');
 L.push('- 식사가 평소와 달랐던 날 '+s.md+'일 / 수면이 평소와 달랐던 날 '+s.sd+'일');
 s.notes.forEach(n=>L.push('- '+n));
 L.push('','■ 특별한 일');if(s.evs.length)s.evs.forEach(n=>L.push('- '+n));else L.push('- 기록된 일이 없어요');
 L.push('','■ 기억 변화 자가 체크 (진단 아님)');if(s.chs.length)s.chs.forEach(n=>L.push('- '+n));else L.push('- 이 기간에 한 체크가 없어요');
 if(shareOpt.opinion){L.push('','■ 가족의 의견·추정');if(s.ops.length)s.ops.forEach(n=>L.push('- '+n));else L.push('- 적은 내용이 없어요');}
 L.push('','■ 진료 때 물어볼 것');if(s.qs.length)s.qs.forEach(n=>L.push(n));else L.push('- 등록한 질문이 없어요');
 L.push('','ApuDa 기억돌봄에서 정리한 가족 기록이에요. 의료적 판단을 담고 있지 않아요.');return L.join('\n');}
V.summary=()=>{const s=buildSummary();
 const sec=(kind,title,body)=>'<section class="item'+(kind==='op'?' dash':'')+'"><span class="tag '+(kind==='op'?'wn':'p')+'">'+(kind==='op'?'가족의 의견·추정':'관찰한 사실')+'</span><h3>'+title+'</h3>'+body+'</section>';
 const lines=a=>a.length?'<ul class="ul">'+a.map(x=>'<li>'+I('right',18,P)+'<span>'+esc(x)+'</span></li>').join('')+'</ul>':'<p class="muted">이 기간에 기록된 내용이 없어요.</p>';
 return hdr('진료용 요약','clinic',esc(S.subject))+
 '<div class="seg" role="group" aria-label="요약 기간">'+[7,14,30].map(p=>'<button type="button" data-act="period" data-p="'+p+'" aria-pressed="'+(period===p?'true':'false')+'"><span class="ck">'+I('check',18)+'</span>'+p+'일</button>').join('')+'</div>'+
 '<p class="small muted">'+fmt(s.from,false)+' ~ '+fmt(s.to,false)+'에 남긴 기록이에요.</p>'+
 sec('f','기록한 날','<p>기록한 날 '+s.recDays+'일 · 기록하지 않은 날 '+(period-s.recDays)+'일</p>')+
 sec('f','약 확인 기록','<div class="grid2"><p>'+I('done',20,'#1F6B4C')+' 복용 확인 '+s.c.confirmed+'일</p><p>'+I('not',20)+' 복용 안 함 '+s.c.not_taken+'일</p><p>'+I('help',20,'#5F6E7E')+' 확인 못 함 '+s.c.unknown+'일</p><p>'+I('dash',20,'#5F6E7E')+' 기록 없음 '+s.medNone+'일</p></div><p class="small muted">기록 없음은 복용하지 않았다는 뜻이 아니에요.</p>')+
 sec('f','식사·수면','<p>식사가 평소와 달랐던 날 '+s.md+'일 · 수면이 달랐던 날 '+s.sd+'일</p>')+
 sec('f','관찰한 변화',lines(s.notes))+sec('f','특별한 일',lines(s.evs))+sec('f','기억 변화 자가 체크',lines(s.chs))+sec('op','가족이 느낀 점',lines(s.ops))+
 '<section class="item"><span class="tag p">진료 때 물어볼 것</span>'+lines(s.qs)+'</section>'+
 banner('','의료진에게 보여주기 전에 내용을 확인해 주세요.')+
 '<button type="button" class="btn" data-act="share">'+I('share',22)+' 공유 전 미리보기</button>'+foot(true);};

 '<section class="card" style="border:2px dashed var(--nt);text-align:center;align-items:center">'+I('person',48,'#5F6E7E')+'<p style="font-size:1.25rem">가족 연락처를 등록해 주세요.</p><p class="muted">보호자가 설정에서 넣어 줄 수 있어요.</p></section>')+
 '<a class="btn s" style="min-height:64px;font-size:1.25rem" href="#patient">처음으로</a></div>';
V['p-habit']=()=>{const t=TODAY(),on=S.prevent[t]||[];const hs=[['walk','walk','걷기'],['read','book','책 읽기, 글쓰기'],['fish','meal','생선과 채소 먹기'],['talk','phone','가족·친구와 연락하기']];
 return '<div class="pt" style="display:flex;flex-direction:column;gap:16px">'+hdr('오늘의 건강 습관','patient','한 것을 눌러 주세요')+
 hs.map(h=>'<button type="button" class="habit" style="min-height:76px;font-size:1.375rem;border-radius:22px" data-act="habit" data-id="'+h[0]+'" aria-pressed="'+(on.indexOf(h[0])>=0?'true':'false')+'"><span class="bx" style="width:36px;height:36px">'+I('check',24,'#fff')+'</span>'+I(h[1],30,P)+'<span style="flex:1">'+h[2]+'</span><span class="done" style="font-size:1rem">했어요</span></button>').join('')+
 '<p style="font-size:1.125rem" class="muted">못 한 것이 있어도 괜찮아요.</p><a class="btn s" style="min-height:64px;font-size:1.25rem" href="#patient">처음으로</a></div>';};
V['p-help']=()=>'<div class="pt" style="display:flex;flex-direction:column;gap:16px">'+hdr('도움이 필요해요','patient')+
 (S.contacts[0]?'<button type="button" class="btn" style="min-height:76px;font-size:1.375rem" data-act="call" data-i="0">'+I('phone',30)+' '+esc(S.contacts[0].name)+'에게 전화하기</button>':'<p style="font-size:1.25rem">등록된 가족 연락처가 없어요.</p>')+
 banner('urgent','<span style="font-size:1.125rem">긴급한 도움이 필요하면 <b>119</b>에 연락하세요.</span>')+tel('119','119에 전화하기')+
 '<a class="btn s" style="min-height:64px;font-size:1.25rem" href="#patient">처음으로</a></div>';

/* ---------- router ---------- */
const PT={patient:1,'p-today':1,'p-call':1,'p-habit':1,'p-help':1};
function route(){let h=(location.hash||'').slice(1);
 if(!S.onboarded&&h!=='welcome')h='welcome';
 if(!V[h])h=S.onboarded?(S.role==='patient'?'patient':'home'):'welcome';
 if(h==='check-run'&&!check)h='check';
 const pt=!!PT[h],wel=h==='welcome';
 top.innerHTML=pt?topPatient():topCaregiver();
 const tb=TABOF[h];
 tabs.hidden=pt||wel||h==='check-run';
 tabs.innerHTML=TABS.map(t=>'<a href="#'+t[0]+'"'+(tb===t[0]?' aria-current="page"':'')+'><span class="pill">'+I(t[2],24)+'</span><span>'+t[1]+'</span><span class="bar"></span></a>').join('');
 view.className=tabs.hidden?'':'withtabs';
 view.innerHTML=V[h]();
 document.title=({home:'홈',check:'치매 체크','check-run':'기억 변화 체크','check-result':'체크 결과',screening:'검진 절차',forget:'건망증과 치매',prevent:'예방수칙',record:'돌봄 기록',event:'특별한 일',clinic:'진료 준비',summary:'진료용 요약',help:'도움',settings:'설정',patient:'환자 화면','p-today':'오늘 할 일','p-call':'가족에게 연락','p-habit':'건강 습관','p-help':'도움',welcome:'시작'}[h]||'')+' · ApuDa 기억돌봄';
 window.scrollTo(0,0);
 const q=document.getElementById('qt');if(q)q.focus();}
function go(h){if(location.hash==='#'+h)route();else location.hash=h;}
addEventListener('hashchange',route);

/* ---------- actions ---------- */
function val(id){const e=document.getElementById(id);return e?e.value.trim():'';}
document.addEventListener('click',e=>{
 const o=e.target.closest('button[data-opt]');
 if(o){[...o.parentElement.querySelectorAll('button[data-opt="'+o.dataset.opt+'"]')].forEach(b=>b.setAttribute('aria-pressed','false'));o.setAttribute('aria-pressed','true');return;}
 const s=e.target.closest('button[data-sw]');
 if(s){const on=s.getAttribute('aria-checked')!=='true';s.setAttribute('aria-checked',on?'true':'false');s.querySelector('.st').textContent=on?'켜짐':'꺼짐';shareOpt[s.dataset.sw]=on;const p=document.getElementById('sharepre');if(p)p.textContent=sumText(buildSummary());return;}
 const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,d=b.dataset;
 switch(a){
 case 'dlg-ok':{const f=dlgOk;closeDlg();if(f)f();break;}
 case 'dlg-x':closeDlg();break;
 case 'start':S.onboarded=true;S.role=d.role==='patient'?'patient':'caregiver';save();if(d.role==='check'){check={who:'self',i:0,answers:[]};go('check-run');}else go(d.role==='patient'?'patient':'home');break;
 case 'fs':S.fs=(S.fs+1)%3;save();applyFs();toast('글자 크기: '+['기본','크게','아주 크게'][S.fs]);route();break;
 case 'setfs':S.fs=+d.v;save();applyFs();route();break;
 case 'patient':S.role='patient';save();go('patient');break;
 case 'caregiver':S.role='caregiver';save();go('home');break;
 case 'kit':check={who:d.who,i:0,answers:[]};go('check-run');break;
 case 'kit-quit':dialog('체크를 그만할까요?','<p>지금까지 답한 내용은 저장되지 않아요.</p>','그만하기',()=>{check=null;go('check');});break;
 case 'kit-prev':if(check.i>0){check.i--;route();}break;
 case 'ans':check.answers[check.i]=+d.v;check.i++;route();break;
 case 'red':{const c={id:uid(),date:TODAY(),who:check.who,answers:check.answers.slice(0,Q.length),red:d.v};S.checks.push(c);save();check=null;resultId=c.id;go('check-result');break;}
 case 'result':resultId=d.id;go('check-result');break;
 case 'delcheck':dialog('이 결과를 지울까요?','<p>지운 결과는 되돌릴 수 없어요.</p>','지우기',()=>{S.checks=S.checks.filter(x=>x.id!==resultId);save();toast('결과를 지웠어요.');go('check');},'d');break;
 case 'toq':{const c=S.checks.find(x=>x.id===resultId);const n=c?changed(c):0;S.questions.push({id:uid(),text:'기억 변화 자가 체크('+fmt(c.date,false)+')에서 달라진 점이 '+n+'가지 있었어요. 검사가 필요할까요?',done:false});save();toast('진료 질문에 추가했어요.');break;}
 case 'copyres':{const c=S.checks.find(x=>x.id===resultId);if(!c)break;const fam=c.who==='family';const L=['[기억 변화 자가 체크] '+fmt(c.date)+' · '+(fam?'가족이 대신 체크':'본인 체크'),'1년 전과 달라진 점 '+changed(c)+'가지'];c.answers.forEach((x,i)=>{if(x>=1)L.push('- '+Q[i][fam?1:0]+' ('+(x===2?'많이':'조금')+')');});if(c.red==='yes')L.push('* 최근 갑작스러운 변화가 있었다고 답함');L.push('','진단이 아닌 자가 체크예요. — ApuDa 기억돌봄');copyText(L.join('\n'));break;}
 case 'habit':{const t=TODAY(),arr=S.prevent[t]||(S.prevent[t]=[]);const i=arr.indexOf(d.id);if(i>=0)arr.splice(i,1);else arr.push(d.id);save();b.setAttribute('aria-pressed',i>=0?'false':'true');break;}
 case 'saverec':{const dd=editDay||TODAY();const get=k=>{const x=document.querySelector('button[data-opt="'+k+'"][aria-pressed="true"]');return x?x.dataset.val:'none';};
  const prev=S.records[dd];const nr={med:get('med'),meal:get('meal'),sleep:get('sleep'),note:val('note'),opinion:val('opinion'),at:Date.now(),history:prev?(prev.history||[]):[]};
  if(prev&&(prev.med!==nr.med||prev.meal!==nr.meal||prev.sleep!==nr.sleep||(prev.note||'')!==nr.note))nr.history=nr.history.concat([{at:Date.now(),med:prev.med,meal:prev.meal,sleep:prev.sleep,note:prev.note}]);
  S.records[dd]=nr;save();toast(prev?'고친 내용을 저장했어요. 이전 기록도 남겨 두었어요.':'기록했어요.');editDay=null;route();break;}
 case 'editday':editDay=d.k===TODAY()?null:d.k;route();break;
 case 'today':editDay=null;route();break;
 case 'recf':recFilter=d.f;route();break;
 case 'saveev':{const x=document.querySelector('button[data-opt="evk"][aria-pressed="true"]');S.events.push({id:uid(),date:val('evd')||TODAY(),kind:EVK[x?+x.dataset.val:3],text:val('evt')});save();toast('특별한 일을 기록했어요.');recFilter='all';go('record');break;}
 case 'saveappt':S.appt={date:val('ad'),place:val('ap'),dept:val('adep'),memo:val('am')};save();toast('진료 일정을 저장했어요.');break;
 case 'addq':{const t=val('qn');if(!t){document.getElementById('qn').focus();break;}S.questions.push({id:uid(),text:t,done:false});save();route();break;}
 case 'qup':{const i=+d.i;if(i>0){const q=S.questions;[q[i-1],q[i]]=[q[i],q[i-1]];save();route();}break;}
 case 'qdn':{const i=+d.i,q=S.questions;if(i<q.length-1){[q[i+1],q[i]]=[q[i],q[i+1]];save();route();}break;}
 case 'qdone':S.questions[+d.i].done=!S.questions[+d.i].done;save();route();break;
 case 'qdel':dialog('이 질문을 지울까요?','<p>'+esc(S.questions[+d.i].text)+'</p>','지우기',()=>{S.questions.splice(+d.i,1);save();route();},'d');break;
 case 'addmed':{const n=val('mn');if(!n){document.getElementById('mn').focus();break;}S.meds.push({id:uid(),name:n,time:val('mt')});save();route();break;}
 case 'delmed':dialog('수첩에서 지울까요?','<p>'+esc(S.meds[+d.i].name)+'</p>','지우기',()=>{S.meds.splice(+d.i,1);save();route();},'d');break;
 case 'period':period=+d.p;route();break;
 case 'share':{dialog('공유하기 전에 확인해 주세요',sw('alias','이름 대신 별칭 쓰기','“돌봄 대상 A”로 표시돼요',shareOpt.alias)+sw('opinion','가족의 의견 포함','끄면 관찰한 사실만 들어가요',shareOpt.opinion)+'<pre class="txt" id="sharepre">'+esc(sumText(buildSummary()))+'</pre>','복사하기',()=>copyText(sumText(buildSummary())),null,'닫기');break;}
 case 'savesubj':S.subject=val('subj')||'돌봄 대상 A';save();toast('저장했어요.');route();break;
 case 'addc':{const n=val('cn'),p=val('cp');if(!n||!p){toast('이름과 전화번호를 모두 적어 주세요.');break;}S.contacts.push({id:uid(),name:n,phone:p});save();route();break;}
 case 'delc':dialog('연락처를 지울까요?','<p>'+esc(S.contacts[+d.i].name)+'</p>','지우기',()=>{S.contacts.splice(+d.i,1);save();route();},'d');break;
 case 'adds':{const t=val('stitle');if(!t)break;S.schedule.push({id:uid(),time:val('stime'),title:t});save();route();break;}
 case 'dels':S.schedule.splice(+d.i,1);save();route();break;
 case 'wipe':dialog('모든 기록을 지울까요?','<p>돌봄 기록, 체크 결과, 질문, 연락처가 모두 지워지고 되돌릴 수 없어요.</p>','모두 지우기',()=>{try{localStorage.removeItem(KEY);}catch(e){}S=JSON.parse(JSON.stringify(DEF));applyFs();go('welcome');},'d');break;
 case 'sched':{const t=TODAY(),m=S.sched[t]||(S.sched[t]={});if(d.v)m[d.id]=d.v;else delete m[d.id];save();route();break;}
 case 'call':{const c=S.contacts[+d.i];if(!c)break;dialog('전화를 걸까요?','<p style="font-size:1.25rem"><b>'+esc(c.name)+'</b><br>'+esc(c.phone)+'</p>',null,null,null,'취소');
  $('#dlg .btns').insertAdjacentHTML('afterbegin','<a class="btn" style="min-height:64px;font-size:1.25rem" href="tel:'+esc(c.phone.replace(/[^0-9+]/g,''))+'">'+I('phone',26)+' 전화하기</a>');break;}
 }});

applyFs();
if(!location.hash&&S.onboarded)location.hash=S.role==='patient'?'patient':'home';
route();
})();
</script>
<script>if("serviceWorker" in navigator){addEventListener("load",()=>{navigator.serviceWorker.register("./sw.js").catch(()=>{})})}</script>
</body>
</html>
