<title>ApuDa V3→V4 합성 원자적 인계 시험</title>
<style>
:root{font:16px/1.65 system-ui,sans-serif;background:#f6f8fc;color:#14213a}
body{max-width:820px;margin:0 auto;padding:24px 16px}h1{font-size:1.6em}
button{background:#246bfe;color:#fff;border:none;border-radius:12px;min-height:48px;padding:10px 20px;font-size:1rem;font-weight:700}
button:focus-visible{outline:3px solid #b54708;outline-offset:3px}
.notice{padding:14px 16px;border-left:5px solid #b54708;background:#fff7e6}
#results{padding-left:24px}#results li{margin-bottom:8px}#summary{font-weight:750}small{color:#475569}
.pass{color:#087a55}.fail{color:#b42318}
</style></head><body><main>
<h1>ApuDa V3→V4 원자적 인계 · 가상 데이터 시험</h1>
<p class="notice">실제 환자 기록이나 브라우저 <code>localStorage</code>를 읽거나 수정하지 않습니다.
V3 원문과 대화·V4 변환 초안을 <strong>합성 IndexedDB</strong>에만 보존하고 종료 시 DB를 삭제합니다.
운영 V4 전환 또는 자동 복원 기능이 아닙니다.</p>
<button type="button" id="run">가상 인계 안전성 시험 실행</button>
<p id="summary" role="status" aria-live="polite">시험 전</p>
<ol id="results"></ol>
<p><small>이 시험은 동일 브라우저의 두 IndexedDB 연결을 검사합니다. 구형 탭을 원격으로 잠그거나 Google Drive 백업을 중단하지 않습니다. 모든 결과가 통과해도 운영 배포를 승인하지 않습니다.</small></p>
</main>
<script defer src="../note/note-storage.js"></script>
