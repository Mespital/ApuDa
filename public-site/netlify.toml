[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/assets/video/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/image/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/farm/*"
  to = "https://apuda-farm.netlify.app/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/pet/*"
  to = "https://apuda-pet.netlify.app/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/care/*"
  to = "https://apudacare.netlify.app/:splat"
  status = 200
  force = true


# ApuDa Note — cancer treatment notebook (separate from general ApuDa Care)
[[redirects]]
  from = "/note"
  to = "/note/"
  status = 301
  force = true

[[redirects]]
  from = "/note/*"
  to = "https://apuda-care.netlify.app/:splat"
  status = 200
  force = true
