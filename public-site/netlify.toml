[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/assets/video/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/image/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/farm/*"
  to = "https://apuda-farm.netlify.app/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/pet/*"
  to = "https://apuda-pet.netlify.app/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/risk/*"
  to = "https://apuda-cancercheck.netlify.app/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/support/v4/*"
  to = "https://apuda-support.netlify.app/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/care/*"
  to = "https://apudacare.netlify.app/:splat"
  status = 200
  force = true


# ApuDa 암환자 노트 v3 — public-site/note/ 에서 직접 서비스 (기존 외부 프록시 제거)
[[headers]]
  for = "/note/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/note/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/books/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/library/mini/pdf/*"
  [headers.values]
    Content-Type = "application/octet-stream"
    X-Robots-Tag = "noindex"
