# Known false positive: the four-digit 5F news access PIN coincides with
# ordinary numeric data in the public MFDS CSV. Do not disable other secret scans.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "APUDA_NEWS_PIN"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/assets/video/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/image/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/farm/*"
  to = "https://apuda-farm.netlify.app/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/pet/*"
  to = "https://apuda-pet.netlify.app/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/risk/*"
  to = "https://apuda-cancercheck.netlify.app/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/support/v4/*"
  to = "https://apuda-support.netlify.app/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/care/*"
  to = "https://apudacare.netlify.app/:splat"
  status = 200
  force = true


# ApuDa 암환자 노트 v3 — public-site/note/ 에서 직접 서비스 (기존 외부 프록시 제거)
[[headers]]
  for = "/note/"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/note/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/note/index.html"
  [headers.values]
    Cache-Control = "no-cache"
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/assets/books/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/library/mini/pdf/*"
  [headers.values]
    Content-Type = "application/octet-stream"
    X-Robots-Tag = "noindex"

# 논술 루틴 — static client + authenticated account storage
[[redirects]]
  from = "/nonsul/api/state"
  to = "/.netlify/functions/nonsul-state"
  status = 200
  force = true

[[redirects]]
  from = "/nonsul/api/auth"
  to = "/.netlify/functions/nonsul-auth"
  status = 200
  force = true

# 2026-11-02: 논술 루틴은 써보다(future.apuda.app/write/)로 통합. 앱 첫 화면만 넘기고 파일은 남긴다.
# 예전 기록을 내보내야 하면 /nonsul/old 로 옛 앱을 연다(자산 경로가 /nonsul/assets/ 절대경로라 그대로 동작).
[[redirects]]
  from = "/nonsul/old"
  to = "/nonsul/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/nonsul"
  to = "https://future.apuda.app/write/"
  status = 302
  force = true

[[redirects]]
  from = "/nonsul/"
  to = "https://future.apuda.app/write/"
  status = 302
  force = true

[[redirects]]
  from = "/nonsul/index.html"
  to = "https://future.apuda.app/write/"
  status = 302
  force = true

[[headers]]
  for = "/nonsul/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/nonsul/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/nonsul/api/*"
  [headers.values]
    Cache-Control = "no-store, private"

# ApuDa 하루수첩 V4: 가상 데이터용 시제품, 검색엔진 제외
[[headers]]
  for = "/note-v4/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"
    Cache-Control = "no-store"

# ApuDa 기억돌봄(치매·기억 돌봄) — public-site/memory/ 에서 직접 서비스
# 개인 돌봄 기록을 기기에 저장하는 앱이라 /note/ 처럼 검색엔진에서 제외한다(의료 감수 전).
[[headers]]
  for = "/memory/*"
  [headers.values]
    X-Robots-Tag = "noindex"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/memory/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/memory/index.html"
  [headers.values]
    Cache-Control = "no-cache"
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/memory/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# 5F industry news gate: static page and downloads; patient oncology and shared datasets stay public.
[[edge_functions]]
  function = "news-access"
  path = "/news"

[[edge_functions]]
  function = "news-access"
  path = "/news/*"

