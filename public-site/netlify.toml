[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"

# Unversioned media paths must be revalidated by browsers after content updates.
# Netlify CDN independently invalidates changed static assets on deploy.
[[headers]]
  for = "/assets/video/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/assets/image/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[redirects]]
  from = "/farm/*"
  to = "https://apuda-farm.netlify.app/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/pet/*"
  to = "https://apuda-pet.netlify.app/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/risk/*"
  to = "https://apuda-cancercheck.netlify.app/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/support/v4/*"
  to = "https://apuda-support.netlify.app/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/care/*"
  to = "https://apudacare.netlify.app/:splat"
  status = 200
  force = true


# ApuDa 암환자 노트 v3 — public-site/note/ 에서 직접 서비스 (기존 외부 프록시 제거)
[[headers]]
  for = "/note/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/note/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/books/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/library/mini/pdf/*"
  [headers.values]
    Content-Type = "application/octet-stream"
    X-Robots-Tag = "noindex"

# 논술 루틴 — static client + authenticated account storage
[[redirects]]
  from = "/nonsul/api/state"
  to = "/.netlify/functions/nonsul-state"
  status = 200
  force = true

[[redirects]]
  from = "/nonsul/api/auth"
  to = "/.netlify/functions/nonsul-auth"
  status = 200
  force = true

# 2026-11-02: 논술 루틴은 써보다(future.apuda.app/write/)로 통합. 앱 첫 화면만 넘기고 파일은 남긴다.
# 예전 기록을 내보내야 하면 /nonsul/old 로 옛 앱을 연다(자산 경로가 /nonsul/assets/ 절대경로라 그대로 동작).
[[redirects]]
  from = "/nonsul/old"
  to = "/nonsul/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/nonsul"
  to = "https://future.apuda.app/write/"
  status = 302
  force = true

[[redirects]]
  from = "/nonsul/"
  to = "https://future.apuda.app/write/"
  status = 302
  force = true

[[redirects]]
  from = "/nonsul/index.html"
  to = "https://future.apuda.app/write/"
  status = 302
  force = true

[[headers]]
  for = "/nonsul/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/nonsul/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/nonsul/api/*"
  [headers.values]
    Cache-Control = "no-store, private"

# ApuDa 하루수첩 V4: 가상 데이터용 시제품, 검색엔진 제외
[[headers]]
  for = "/note-v4/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"
    Cache-Control = "no-store"
