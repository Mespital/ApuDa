<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>ApuDa 뉴스 데이터 상태</title><link rel="stylesheet" href="/news/styles.css"></head><body>
<header class="topbar"><div class="wrap nav"><a class="brand" href="/">ApuDa<small>아프지만, 다행이다.</small></a><nav class="navlinks"><a href="/news/">오늘의 브리핑</a><a href="/news/oncology/">항암제 뉴스</a><a class="on" href="/news/status/">데이터 상태</a></nav></div></header>
<main class="wrap">
<section class="hero"><div class="eyebrow">APUDA DATA OPERATIONS</div><h1>뉴스 데이터 상태</h1><p>뉴스·공식기관·NCCN 데이터의 마지막 갱신과 연결 상태를 한 화면에서 확인합니다.</p><div class="meta" id="statusMeta"><span class="chip">상태 확인 중</span></div></section>
<section class="section"><div class="status-grid" id="statusGrid"><div class="newsroom-empty">데이터 상태를 불러오는 중입니다.</div></div></section>
<section class="section"><div class="panel"><h3>점검 기준</h3><div class="list"><div class="row"><b>정상</b><span>최근 생성 파일이 있고 공식 연결 응답이 정상</span></div><div class="row"><b>확인 필요</b><span>키·권한·외부기관 응답 또는 수집결과를 점검해야 함</span></div><div class="row"><b>저작권 보호</b><span>NCCN은 공개 버전 메타데이터와 공식 링크만 추적하며 원문/PDF는 복제하지 않음</span></div></div></div></section>
</main>
<footer class="footer"><div class="wrap"><b>ApuDa</b>News Data Operations</div></footer>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const fmt=v=>{try{return new Date(v).toLocaleString('ko-KR',{year:'numeric',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false})}catch{return '확인 필요'}};
async function get(url){try{const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw 0;return await r.json()}catch{return null}}
function card(title,status,detail,updated,url){
 const ok=status==='정상';
 const cls=ok?'status-ok-card':'status-warn-card';
 const link=url?'<a href="'+esc(url)+'" target="_blank" rel="noopener noreferrer">원문/데이터 ↗</a>':'';
 return '<article class="status-card '+cls+'"><div class="status-card-top"><span>'+esc(title)+'</span><em>'+(ok?'정상':'확인 필요')+'</em></div><h3>'+esc(detail)+'</h3><p>'+esc(updated?('최종 갱신 '+fmt(updated)):'갱신시각 확인 필요')+'</p>'+link+'</article>';
}
async function load(){
 const [latest,run,official,mfds,hira,nccn]=await Promise.all([
   get('/news/data/latest.json'),get('/news/data/last-run.json'),get('/news/data/official-data.json'),
   get('/news/data/official-notices.json'),get('/news/data/hira-updates.json'),get('/news/data/nccn-monitor.json')
 ]);
 const cards=[];
 cards.push(card('오늘의 브리핑',latest?'정상':'확인 필요',latest?('최신 보고일 '+latest.latest):'latest.json 없음',run?.generated_at,'/news/'));
 const offSources=official?.sources||[];
 const mfdsApproval=offSources.find(x=>x.id==='mfds_drug_approval');
 const mfdsSupply=offSources.find(x=>x.id==='mfds_supply_shortage');
 const hiraPrice=offSources.find(x=>x.id==='hira_drug_price');
 cards.push(card('식약처 허가 API',mfdsApproval?.status==='ok'?'정상':'확인 필요',mfdsApproval?.status==='ok'?('허가정보 '+(mfdsApproval.records||[]).length+'건 확인'):(mfdsApproval?.error_message||mfdsApproval?.note||'연결 상태 확인 필요'),official?.generated_at,mfdsApproval?.source_url));
 cards.push(card('식약처 공급부족 API',mfdsSupply?.status==='ok'?'정상':'확인 필요',mfdsSupply?.status==='ok'?('공급부족 '+(mfdsSupply.records||[]).length+'건 확인'):(mfdsSupply?.note||'활용신청·연결 확인 필요'),official?.generated_at,mfdsSupply?.source_url));
 cards.push(card('심평원 약가 API',hiraPrice?.status==='ok'?'정상':'확인 필요',hiraPrice?.status==='ok'?('약가정보 '+(hiraPrice.records||[]).length+'건 확인'):(hiraPrice?.note||'활용신청·연결 확인 필요'),official?.generated_at,hiraPrice?.source_url));
 cards.push(card('식약처 공식 공문',mfds?'정상':'확인 필요',mfds?('최근 30일 '+(mfds.items||[]).length+'건'):'데이터 파일 없음',mfds?.generated_at,mfds?.sources?.[0]?.url));
 cards.push(card('심평원 보험인정기준',hira?.status==='ok'?'정상':'확인 필요',hira?.status==='ok'?('최근 30일 '+(hira.items||[]).length+'건'):(hira?.error||'첫 수집 대기'),hira?.generated_at,hira?.source?.url));
 const nitems=nccn?.items||[];
 const nok=nitems.filter(x=>x.status==='ok').length;
 cards.push(card('NCCN 모니터',nok===12?'정상':'확인 필요',nitems.length?('12개 암종 중 '+nok+'개 버전 확인'):'데이터 없음',nccn?.generated_at,nccn?.category_url));
 const sourceOk=offSources.filter(x=>x.status==='ok').length;
 cards.push(card('공식 근거 소스',sourceOk>=2?'정상':'확인 필요',offSources.length?('총 '+offSources.length+'개 소스 · 정상 '+sourceOk+'개'):'데이터 없음',official?.generated_at,'/news/oncology/'));
 document.getElementById('statusGrid').innerHTML=cards.join('');
 document.getElementById('statusMeta').innerHTML='<span class="chip">자동 갱신</span><span class="chip">KST 기준</span><span class="chip">'+(run?.generated_at?'마지막 실행 '+esc(fmt(run.generated_at)):'마지막 실행 확인 필요')+'</span>';
}
load();
</script></body></html>
