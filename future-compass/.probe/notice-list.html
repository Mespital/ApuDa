<script type="text/javascript">

// 숫자가 아닌 정규식
var replaceNotInt = /[^0-9]/gi;

var title = document.getElementsByTagName("title")[0].innerHTML;
if ( title.split('|').length > 2) {
	document.title =  "목록 | " + title.substr(5);
}
else {
	document.title = "목록 | " + title;
}

$(document).ready(function(){

	// 숫자가 아닌 정규식
	$("#pageIndex").on("focusout", function() {
        var x = $(this).val();
        if (x.length > 0) {
            if (x.match(replaceNotInt)) {
               x = x.replace(replaceNotInt, "");
            }
            $(this).val(x);
        }
    }).on("keyup", function() {
        $(this).val($(this).val().replace(replaceNotInt, ""));
    });
	//
	
	$("[id='regist_btn']").click(function (){ 	
		$.ajax({
	        type:'POST'
	      , url:'/dggb/module/board/registBoardPageAjax.do'
	      , cache : false
	      , async : false
	      , data:$("#boardFrm").serialize()
	      , success:function (data) {
	    	  $('#board_area').html(data);
	      }
	      , error:function (data) {
	          alert('오류');
	      }
	      , dateType: 'html'
	 	});   
	});
	
	$("#delete_btn").click(function (){
		var checkCnt = 0;
		var checkNttId = "";
		for (var i = 0; i < document.getElementsByName("nttIdChk").length; i++){
			if (document.getElementsByName("nttIdChk")[i].checked == true){
				checkNttId += document.getElementsByName('nttIdChk')[i].value + ",";
				checkCnt++;
			}
		}
		if(checkCnt < 1){
			alert("체크박스를 선택해주세요.");
			return;
		}
		if(confirm("게시글을 삭제하시겠습니까?")){
			document.getElementById('checkNttId').value = checkNttId;
			$.ajax({
				type:'POST'
				, url:'/dggb/module/module/board/deleteBoardCheckAjax.do'
				, cache : false
				, async : false
				, data:$("#boardFrm").serialize()
				, success:function (data) {
					$('#board_area').html(data);
				}
				, error:function (data) {
				    alert('오류');
				}
	      	});
		}else{
			return;
		}
	});
	
	$("#move_btn").click(function (){
		var checkCnt = 0;
		var checkNttId = "";
		for (var i = 0; i < document.getElementsByName("nttIdChk").length; i++){
			if (document.getElementsByName("nttIdChk")[i].checked == true && document.getElementsByName("nttIdChk")[i].disabled == false){
				checkNttId += document.getElementsByName('nttIdChk')[i].value + ",";
				checkCnt++;
			}
		}
		if(checkCnt < 1){
			alert("체크박스를 선택해주세요.");
			return;
		}
		document.getElementById('checkNttId').value = checkNttId;
		
		$.ajax({
	        type:'POST'
	      , url:'/dggb/module/board/boardCmmn/mvmnBoardPageAjax.do'
	      , cache : false
	      , async : false
	      , data:$("#boardFrm").serialize()
	      , success:function (data) {
	    	  $("#boardMngr_layer").html(data);
	    	  $("#boardMngr_layer").show();
	      }
	      , error:function (request, status, error) {
	    	  alert("code : " + request.status + "\r\nmessage : " + request.reponseText);
	      }
	      , dateType: 'html'
	 	});
	});
	
	$("#login_regist_btn").click(function (){
		alert("정책참여 게시판 글쓰기는 로그인 후 이용해주세요.");		
		window.location.href ="https://member.newhosting.ssem.or.kr/dggb/mber/mberLogin/mberLogin.do?baseInfo=";
	});	
});//

	
	function fnPage(pageNo){
		document.getElementById('pageIndex').value = pageNo;
		
		$.ajax({
	        type:'POST'
	      , url:'/dggb/module/board/selectBoardListAjax.do'
	      , cache : false
	      , async : false
	      , data:$("#boardFrm").serialize()
	      , success:function (data) {
	    	  $('#board_area').html(data);
	      }
	      , error:function (data) {
	          alert('오류');
	      }
	      , dateType: 'html'
	 	});  
		
	}
	
	function fnView(bbsId, nttId){
		
		document.getElementById('nttId').value = nttId;
		document.getElementById('bbsId').value = bbsId;
		
		if(xssFilter( document.getElementById('nttId').value )  ){
			return false;		
		}
		if(xssFilter( document.getElementById('bbsId').value )  ){
			return false;		
		}
		
		$.ajax({
	        type:'POST'
	      , url:'/dggb/module/board/selectBoardDetailAjax.do'
	      , cache : false
	      , async : false
	      , data:$("#boardFrm").serialize()
	      , success:function (data) {
	    	  $('#board_area').html(data);
	      }
	      , error:function (data) {
	          alert('오류');
	      }
	      , dateType: 'html'
	 	});    
		
	}
	
	// 체크박스 전체선택
	function fnCheckBoxAll(obj){
		var check_boolean = (obj.checked)? true: false; 
		var check_list = document.getElementsByName("nttIdChk"); 

		for (var i=0; i<check_list.length; i++) { 
			check_list[i].checked = check_boolean; 
		} 
	}
	
	function fnPageSearch(){
		document.getElementById('pageIndex').value = 1;
		
		// customRecordCountPerPage 변조방지
		document.getElementById('customRecordCountPerPage').value = document.getElementById('recordPerPage').value; 
		//
		
		$.ajax({
	        type:'POST'
	      , url:'/dggb/module/board/selectBoardListAjax.do'
	      , cache : false
	      , async : false
	      , data:$("#boardFrm").serialize()
	      , success:function (data) {
	    	  $('#board_area').html(data);
	      }
	      , error:function (data) {
	          alert('오류');
	      }
	      , dateType: 'html'
	 	});  
		
		// 포커스 유지 2025.06.01	
		document.getElementById('recordPerPage').focus();
			
	}
	
	function fnSenView(nttId){
		
		document.getElementById('nttId').value = nttId;
		
		$.ajax({
	        type:'POST'
	      , url:'/dggb/module/board/selectBoardSenDetailAjax.do'
	      , cache : false
	      , async : false
	      , data:$("#boardFrm").serialize()
	      , success:function (data) {
	    	  $('#board_area').html(data);
	      }
	      , error:function (data) {
	          alert('오류');
	      }
	      , dateType: 'html'
	 	});    
		
	}
	
	
</script>
	
	<input type="hidden" id="cmntSe" name="cmntSe" value="N"/>
	<input type="hidden" id="nttId" name="nttId" />	
	
	<div class="board_type01_table_top">
		
		<!-- page count Start -->
		<div class="board_type01_count">
			<p>
				<span class="total">총 0건</span>
				<span class="count">
					<label for="recordPerPage"></label>
					<select id="recordPerPage" title="페이지당 조회건수" class="form-control w10" onchange="document.getElementById('customRecordCountPerPage').value=this.value;fnPageSearch(this.value);">
						<option value="10" >10건</option>
						<option value="30" >30건</option>
						<option value="50" >50건</option>
					</select>
				</span>
			</p>
		</div>
		<!-- page count End -->
		
		<!-- 검색 Start -->
		<div class="board_type01_search_box">
			<fieldset>
				<legend>게시물 검색</legend>
				<label class="searchSe" for="searchSe">검색구분</label>
				<select id="searchSe" title="검색구분" class="board_type01_category"> 
					<option value="0" >선택</option>
					<option value="1" >제목</option>
					
					
					
				</select>
				
				<label  for="searchWord" >검색어 입력</label>
				<input type="text" id="searchWord" title="검색어 입력" class="board_type01_keyword"  placeholder=" 검색어 입력" onfocus="this.placeholder=''" onblur="this.placeholder='검색어 입력'" value="" onkeydown="if(event.keyCode == 13){fnSearch();}" />
				<input type="button" value="검색" class="board_type01_search_submit" onclick="fnSearch();" />
			</fieldset>
		</div>
		<!-- 검색 End -->
		
	</div>
