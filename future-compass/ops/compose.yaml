services:
  auth:
    image: python:3.13-slim
    user: "${COMPASS_UID:?set COMPASS_UID}:${COMPASS_GID:?set COMPASS_GID}"
    command: ['python', '-u', '/app/server.py']
    working_dir: /app
    restart: unless-stopped
    environment:
      COMPASS_ORIGIN: https://future.apuda.app
      COMPASS_DATA: /data
    volumes:
      - ./auth:/app:ro
      - ./private:/data
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 192m
    cpus: 0.75
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
  web:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    depends_on:
      auth:
        condition: service_healthy
    ports:
      - '127.0.0.1:8092:8080'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./:/srv/compass:ro
    read_only: true
    tmpfs:
      - /data
      - /config
    mem_limit: 96m
    cpus: 0.5
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '-', 'http://127.0.0.1:8080/health']
      interval: 30s
      timeout: 5s
      retries: 3
  live:
    # 실시간 중계 + 흰둥이 똑똑 모드 (비밀값 없이 동작: 티켓 공개키는 Netlify에서 자동으로 가져옴)
    image: node:22-alpine
    user: "${COMPASS_UID:?set COMPASS_UID}:${COMPASS_GID:?set COMPASS_GID}"
    command: ['node', '/live/server.mjs']
    restart: unless-stopped
    env_file: [live.env]
    environment:
      PORT: '8093'
      ALLOWED_ORIGINS: https://future.apuda.app
    volumes:
      - ./live:/live:ro
    ports:
      - '127.0.0.1:8093:8093'
    read_only: true
    mem_limit: 128m
    cpus: 0.5
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '-', 'http://127.0.0.1:8093/health']
      interval: 30s
      timeout: 5s
      retries: 3
  ollama:
    # 무료 AI(오픈소스 모델). GitHub 변수 FC_OLLAMA_MODEL 이 있을 때만 --profile ollama 로 기동. 외부 포트 없음(live만 접근)
    profiles: [ollama]
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: 24h
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
    volumes:
      - ./ollama-data:/root/.ollama
    mem_limit: ${OLLAMA_MEM:-4g}
    cpus: ${OLLAMA_CPUS:-2}
    security_opt:
      - no-new-privileges:true
