<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>대기자 명단 · 학교나침반</title><link rel="stylesheet" href="beta.css"></head>
<body><main style="padding-top:40px;max-width:560px">
<h2>대기자 명단 내려받기</h2>
<form id="f" style="display:grid;gap:12px"><label class="field"><span>관리자 토큰 (Netlify 환경변수 WAITLIST_ADMIN_TOKEN)</span><input id="t" type="password" required autocomplete="off"></label>
<button class="btn" type="submit">CSV 내려받기</button><p class="form-msg" id="m" role="status"></p></form>
<script>
document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();const m=document.getElementById('m');m.textContent='불러오는 중…';
try{const r=await fetch('/api/waitlist',{headers:{authorization:'Bearer '+document.getElementById('t').value}});if(!r.ok)throw new Error(r.status===401?'토큰이 맞지 않거나 설정되지 않았어요.':'불러오지 못했어요.');
const b=await r.blob(),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='school-compass-waitlist-'+new Date().toISOString().slice(0,10)+'.csv';a.click();m.textContent='내려받았어요.';}catch(err){m.textContent=err.message}});
</script></main></body></html>
