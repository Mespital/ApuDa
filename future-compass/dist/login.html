<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#7964e8"><meta property="og:title" content="승준이의 미래 아지트"><meta property="og:description" content="나의 속도로 공부하고 미래를 찾아가는 공간"><meta property="og:image" content="https://future.apuda.app/share-home.jpg"><meta property="og:url" content="https://future.apuda.app/"><title>승준이의 아지트 · 들어가기</title><link rel="icon" href="/app-icon.svg"><link rel="stylesheet" href="/auth.css"><script src="/auth.js" defer></script></head><body class="auth-page"><main class="auth-card"><img class="welcome" src="/shiro-letter.jpg" alt="편지를 들고 기다리는 흰둥이"><span class="eyebrow">나만의 작은 아지트</span><h1 id="title">승준아, 반가워 🐾</h1><p id="intro">우리의 비밀 번호 4자리를 눌러줘.</p><div class="role-tabs" aria-label="로그인 종류"><button type="button" id="child-tab" aria-pressed="true">🐾 승준이</button><button type="button" id="admin-tab" aria-pressed="false">🔑 보호자</button></div><form id="login-form"><label id="password-label" for="password">비밀 번호 4자리</label><input id="password" type="password" inputmode="numeric" pattern="[0-9]{4}" minlength="4" maxlength="4" autocomplete="current-password" required aria-describedby="message"><label id="remember-row" class="check"><input id="remember" type="checkbox"> 내 기기에서 30일 동안 로그인 유지</label><button class="primary" id="submit">아지트 들어가기 →</button></form><p id="message" role="status" aria-live="polite"></p><button class="text-button" id="forgot">번호를 잊어버렸어</button><p class="hint" id="help" hidden>괜찮아! 보호자가 이 화면의 ‘보호자’로 로그인한 다음 새 번호를 정해줄 수 있어. 공부 기록은 지워지지 않아.</p><p class="hint">공용 기기에서는 로그인 유지를 선택하지 마세요.</p></main></body></html>
