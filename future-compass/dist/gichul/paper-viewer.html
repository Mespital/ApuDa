<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>수능 시험문제 읽기</title><link rel="stylesheet" href="./paper-viewer.css"><script defer src="../vendor/pdfjs/pdf.min.js"></script><script type="module" src="./paper-viewer.mjs"></script></head><body><header><div><p class="eyebrow">공식 시험지 전체 보기</p><h1 id="paper-title">시험문제를 불러오고 있습니다</h1></div><a id="official-link" target="_blank" rel="noopener noreferrer" hidden>평가원 원문 열기 ↗</a></header><div class="file-picker" id="file-picker" hidden><label for="paper-file">묶음 안의 과목·시험지</label><select id="paper-file"></select></div><nav aria-label="시험지 페이지"><button id="previous" disabled>← 이전 쪽</button><label for="page-number">쪽</label><input id="page-number" type="number" min="1" value="1" aria-label="시험지 쪽 번호" disabled><span id="page-total">/ —</span><button id="next" disabled>다음 쪽 →</button><span class="divider"></span><button id="zoom-out" aria-label="시험지 축소" disabled>−</button><button id="zoom-in" aria-label="시험지 확대" disabled>＋</button><button id="fit" disabled>화면에 맞춤</button></nav><p id="status" role="status" aria-live="polite">공식 문제지의 지문·보기·그림을 그대로 불러옵니다.</p><main id="paper-stage" aria-label="수능 시험문제"><canvas id="paper-canvas" aria-label="시험지 페이지" hidden></canvas><div id="paper-text" class="sr-only"></div></main><p class="footnote">한국교육과정평가원 공식 문제지입니다. 원문 출처는 위 링크에서 확인할 수 있습니다.</p></body></html>
