<style>
*{box-sizing:border-box}body{margin:0;background:#f5f3ff;color:#302d49;font:15px/1.55 system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif}
main{max-width:720px;margin:0 auto;padding:14px 16px 60px}.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}.top a{color:#6250ce;text-decoration:none;font-size:14px}.top .sp{flex:1}
.top button{font:600 13px system-ui;border:1px solid #e3ddf5;background:#fff;color:#493c80;border-radius:10px;padding:7px 10px;cursor:pointer}
.hello{display:flex;align-items:center;gap:12px;margin:0 0 6px}.hello p{margin:0;line-height:1.4}.hello small{color:#8a839a}

</style></head><body class="app"><main>
<header class="top"><a href="study.html" class="back">← 승준 공부관리 방</a><span class="sp"></span><button type="button" onclick="print()">🖨 인쇄</button></header>
<div id="today-view"><p style="color:#8a839a">불러오는 중…</p></div>
<p class="note">이 화면(수업·학원·할 일·예습 목록)은 엄마도 같이 봐. 메모와 복습 노트 내용은 보내지 않아.</p>
</main>
<script src="school-config.js"></script><script src="holidays-kr.js"></script><script src="curriculum-kr.js"></script><script src="today-view.js"></script><script src="route.js"></script><script src="shiro-study.js"></script><script src="shiro-help.js"></script>
<script>
(function(){
  function draw(){
    var d = new Date(Date.now() + 9 * 3600000).toISOString().slice(0, 10), box = document.getElementById('today-view');
    var who = 'child'; try { if (localStorage.getItem('fc-who-v1') === 'parent') who = 'parent'; } catch (e) {}
    var dd = TodayView.collect(), exam = dd && dd.examToday && !dd.off;
    box.innerHTML = (window.FC_CHAR ? '<div class="hello">' + FC_CHAR.svg(who, 64) + '<p><b>' + (exam ? (who === 'parent' ? '오늘 승준이 시험날이에요 · 응원해 주세요' : '승준, 오늘 시험 화이팅! 💪') : who === 'parent' ? '엄마, 승준이 오늘 일정이에요' : '승준, 오늘 이것만 하면 돼') + '</b><br><small>공부 먼저, 이동은 맨 아래</small></p></div>' : '') + TodayView.render(dd);
    if (window.FC_ROUTE) { var rc = FC_ROUTE.card(d, { quiet: true }); if (rc) { box.insertAdjacentHTML('beforeend', rc); } }
  }
  function go(){ TodayView.loadSchool().then(function(){ draw(); TodayView.sync(); }); }
  if (window.FC_CAL) FC_CAL.onUpdate(function(){ draw(); });
  if (document.documentElement.classList.contains('pin-locked')) window.addEventListener('pin-unlocked', go); else go();
  setInterval(function(){ draw(); TodayView.sync(); }, 600000);
})();
</script>
</body></html>
