<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>써보다</title>
<meta name="description" content="읽고, 쓰고, 근거로 고치고, 다시 쓰는 고1 논술 20분 루틴">
<meta name="theme-color" content="#1F3A8A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F5F7FA; --sheet:#FFFFFF; --ink:#1B2433; --ink2:#4A5568; --ink3:#7A8496;
  --line:#DCE2EA; --apuda:#1F3A8A; --grid:#2E7D5B; --grid-soft:#E3F1EA;
  --amber:#B7791F; --amber-soft:#FDF3E1; --red:#B42318; --red-soft:#FDECEA;
  --radius-s:6px; --radius-m:12px;
  --serif:"Gowun Batang",serif; --sans:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#12161D; --sheet:#1A2029; --ink:#E7ECF3; --ink2:#B4BECC; --ink3:#8590A2;
  --line:#2C3542; --apuda:#8EA8F0; --grid:#5FBF92; --grid-soft:#173027;
  --amber:#E2A84B; --amber-soft:#2E2414; --red:#F08A80; --red-soft:#341A18;
 color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#12161D; --sheet:#1A2029; --ink:#E7ECF3; --ink2:#B4BECC; --ink3:#8590A2;
  --line:#2C3542; --apuda:#8EA8F0; --grid:#5FBF92; --grid-soft:#173027;
  --amber:#E2A84B; --amber-soft:#2E2414; --red:#F08A80; --red-soft:#341A18;
 color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 var(--sans);word-break:keep-all;overflow-wrap:anywhere}
a{color:var(--apuda)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--apuda);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* 상단 */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--paper)}
.top-in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:12px}
.mark{display:flex;align-items:baseline;gap:8px;text-decoration:none;color:var(--ink)}
.mark b{font-size:20px;letter-spacing:-.02em}
.mark .wm{font-weight:800;color:var(--apuda);font-size:13px}.mark .wm span{color:var(--ink);font-weight:600}
.family{margin-left:auto;display:flex;gap:6px}
.family a{font-size:13px;text-decoration:none;color:var(--ink2);border:1px solid var(--line);border-radius:999px;padding:4px 10px;background:var(--sheet)}

main{max-width:1080px;margin:0 auto;padding-top:16px;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-size:24px;line-height:1.3;margin:4px 0 6px;letter-spacing:-.02em}
h2{font-size:18px;margin:24px 0 8px;letter-spacing:-.01em}
h3{font-size:16px;margin:0 0 6px}
p{margin:0 0 10px}
.muted{color:var(--ink2)}.small{font-size:14px}.tiny{font-size:12.5px;color:var(--ink3)}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:var(--radius-m);padding:16px;margin:12px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1}
.btn{border:1px solid var(--line);background:var(--sheet);border-radius:var(--radius-s);padding:10px 14px;min-height:44px;cursor:pointer;font-weight:600}
a.btn{text-decoration:none;text-align:center}
.btn.primary{background:var(--apuda);border-color:var(--apuda);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{color:var(--paper)}}
:root[data-theme="dark"] .btn.primary{color:var(--paper)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.chip{display:inline-block;font-size:12.5px;border-radius:999px;padding:2px 9px;border:1px solid var(--line);color:var(--ink2);white-space:nowrap}
.chip.ok{border-color:var(--grid);color:var(--grid)}.chip.warn{border-color:var(--amber);color:var(--amber)}.chip.bad{border-color:var(--red);color:var(--red)}
label.f{display:block;margin:10px 0 4px;font-size:14px;font-weight:600}
input[type=text],input[type=url],input[type=date],input[type=number],input[type=password],select,textarea{width:100%;border:1px solid var(--line);border-radius:var(--radius-s);background:var(--sheet);padding:10px 12px;min-height:44px}
.days{display:flex;gap:6px;flex-wrap:wrap}
.days label{display:flex;align-items:center;justify-content:center;width:44px;height:44px;border:1px solid var(--line);border-radius:var(--radius-s);background:var(--sheet);cursor:pointer;font-weight:600}
.days input{position:absolute;opacity:0;pointer-events:none}
.days label:has(input:checked){background:var(--apuda);color:#fff;border-color:var(--apuda)}
.banner{border-left:4px solid var(--amber);background:var(--amber-soft);padding:10px 12px;border-radius:0 var(--radius-s) var(--radius-s) 0;margin:12px 0;font-size:14.5px}
.banner.green{border-color:var(--grid);background:var(--grid-soft)}
.banner.red{border-color:var(--red);background:var(--red-soft)}

/* 오늘 */
.today-task{padding:20px}
.today-task .q{font-family:var(--serif);font-size:17px;line-height:1.75;margin:10px 0 14px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:8px 0 4px}
.week div{height:34px;border-radius:4px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12.5px;color:var(--ink3)}
.week .plan{border-color:var(--ink3);color:var(--ink2)}
.week .done{background:var(--grid);border-color:var(--grid);color:#fff}
.week .extra{background:var(--grid-soft);border-color:var(--grid);color:var(--grid)}
.week .today{outline:2px solid var(--apuda);outline-offset:1px}

/* 훈련 목록 */
.set{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line);text-decoration:none;color:var(--ink)}
.set:first-child{border-top:0}
.set .wk{width:44px;flex:none;font-size:12.5px;color:var(--ink3);padding-top:2px}
.set .t{font-weight:700}

/* 쓰기 */
.wtop{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.timer{font-variant-numeric:tabular-nums;font-weight:700}
.phase{display:flex;gap:2px;height:6px;margin:6px 0 2px}
.phase i{flex:var(--w);background:var(--line);border-radius:2px}
.phase i.on{background:var(--apuda)}.phase i.past{background:var(--grid)}
.tabs{display:flex;border:1px solid var(--line);border-radius:var(--radius-s);overflow:hidden;margin:8px 0}
.tabs button{flex:1;border:0;background:var(--sheet);padding:10px;min-height:44px;font-weight:700;color:var(--ink2)}
.tabs button[aria-selected=true]{background:var(--ink);color:var(--paper)}
.wgrid{display:block}
@media(min-width:900px){.tabs{display:none}.wgrid{display:grid;grid-template-columns:1fr 1.1fr;gap:16px;align-items:start}.wgrid>section{display:block!important}.wgrid .pass{position:sticky;top:72px;max-height:calc(100vh - 90px);overflow:auto}}
.passage{font-family:var(--serif);font-size:16.5px;line-height:1.85;margin:0 0 14px}
.passage b{font-family:var(--sans);display:inline-block;margin-right:6px;color:var(--apuda)}
.question{border-top:1px solid var(--line);padding-top:12px;font-weight:600}
mark.hl{background:var(--amber-soft);color:inherit;border-bottom:2px solid var(--amber);padding:0 1px}
.outline input{margin-bottom:6px}

/* 원고지 답안 */
.manuscript{position:relative;border:1px solid var(--grid);border-radius:var(--radius-s);background:var(--sheet);overflow:hidden}
.manuscript textarea{display:block;border:0;border-radius:0;min-height:240px;resize:vertical;background:transparent;
  font-family:var(--serif);font-size:18px;line-height:36px;padding:0 14px;letter-spacing:.02em;
  background-image:linear-gradient(var(--grid-soft) 1px,transparent 1px);background-size:100% 36px;background-position:0 35px;background-attachment:local}
.manuscript textarea:focus{outline:none}
.manuscript:focus-within{box-shadow:0 0 0 2px var(--apuda)}
.ruler{margin:8px 0 2px}
.ruler .track{position:relative;height:10px;background:var(--line);border-radius:5px}
.ruler .zone{position:absolute;top:0;bottom:0;background:var(--grid-soft);border-left:2px solid var(--grid);border-right:2px solid var(--grid)}
.ruler .pin{position:absolute;top:-4px;width:4px;height:18px;border-radius:2px;background:var(--ink);transform:translateX(-2px);transition:left .15s}
.ruler .lab{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink3);margin-top:4px;font-variant-numeric:tabular-nums}
.ruler .count{font-weight:800;color:var(--ink)}.ruler .count.ok{color:var(--grid)}.ruler .count.over{color:var(--red)}
.save{font-size:12.5px;color:var(--ink3)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.actions .btn{flex:1;min-width:140px}

/* 피드백 */
.fb h3{margin-top:14px}
.fb .good{border-left:4px solid var(--grid);padding:4px 0 4px 12px}
.fix{border-left:4px solid var(--amber);padding:4px 0 4px 12px;margin:12px 0}
.c-sum{font-size:17px;font-weight:700;line-height:1.55;margin:4px 0 12px;padding:10px 12px;background:var(--paper);border-radius:var(--radius-m)}
.c-card{border:1px solid var(--line);border-radius:var(--radius-m);padding:12px 14px;margin:10px 0;background:var(--sheet)}
.c-card p{margin:6px 0}.c-h{font-weight:800;font-size:15px;margin:2px 0 4px}
.c-good{border-left:5px solid var(--grid)}.c-fix{border-left:5px solid var(--amber);background:var(--amber-soft)}.c-fix .quote{background:var(--sheet)}
.c-sub{background:var(--sheet)}.c-issue{font-weight:700}.c-do{font-weight:700;color:var(--ink)}
.c-hint{font-family:var(--serif);background:var(--grid-soft);border-radius:var(--radius-s);padding:8px 10px;margin:8px 0;line-height:1.7}
.c-hint small,.quote small{display:block;font-family:var(--sans);font-size:12px;color:var(--ink3)}
.c-sp{display:flex;flex-wrap:wrap;gap:8px}.c-sp span{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:14px}.c-sp del{color:var(--red)}.c-sp b{color:var(--grid)}
.c-next{border-left:5px solid var(--apuda)}.c-next .btn{margin-top:6px}
.c-rub summary{cursor:pointer;min-height:40px;display:flex;align-items:center}
.quote{font-family:var(--serif);font-size:15px;background:var(--paper);border-radius:var(--radius-s);padding:6px 10px;margin:6px 0}
.quote small{font-family:var(--sans);display:block;color:var(--ink3);font-size:12px}
.rub{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.diff .add{background:var(--grid-soft);border-bottom:2px solid var(--grid)}
.diff .del{color:var(--ink3);text-decoration:line-through}
.diff p{font-family:var(--serif);line-height:1.85}

/* 기록 */
.bars{display:flex;align-items:flex-end;gap:8px;height:120px;border-bottom:1px solid var(--line);padding-top:8px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:12px;color:var(--ink3)}
.bars i{display:block;width:100%;max-width:36px;background:var(--apuda);border-radius:3px 3px 0 0;min-height:2px}
.bars i.goal{background:transparent;border:1px dashed var(--ink3);position:absolute}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.stat div{background:var(--sheet);border:1px solid var(--line);border-radius:var(--radius-s);padding:10px 12px}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t td,table.t th{border-bottom:1px solid var(--line);padding:8px 4px;text-align:left;vertical-align:top}

/* 하단 내비 */
nav.tab{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--sheet);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);display:flex;justify-content:center}
nav.tab .in{display:flex;max-width:560px;width:100%}
nav.tab a{flex:1;text-align:center;padding:10px 0 8px;text-decoration:none;color:var(--ink3);font-size:12.5px;font-weight:700;min-height:56px}
nav.tab a svg{display:block;margin:0 auto 2px;width:22px;height:22px}
nav.tab a[aria-current=page]{color:var(--apuda)}
.lock{position:fixed;inset:0;z-index:99;background:var(--paper);display:flex;align-items:center;justify-content:center;padding:24px}
.lock .sheet{width:100%;max-width:340px;text-align:center}
/* 예시로 배우기 */
.lrn-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.lrn-card{display:block;text-decoration:none;color:var(--ink);background:var(--sheet);border:1px solid var(--line);border-radius:var(--radius-m);padding:12px 14px}
.lrn-card b{display:block}
.seg{border-left:4px solid var(--grid);background:var(--paper);border-radius:0 var(--radius-s) var(--radius-s) 0;padding:8px 12px;margin:10px 0}
.seg .st{font-family:var(--serif);font-size:16.5px;line-height:1.8;margin:4px 0}
.seg .why{font-size:14px;color:var(--ink2);margin:0}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px}
.flow span{border:1px solid var(--grid);color:var(--grid);border-radius:999px;padding:2px 10px}
/* 인쇄: 연습지·내 답안 (A4) */
#printArea{display:none}
@media print{
  @page{size:A4;margin:14mm 14mm 16mm}
  body{background:#fff!important;color:#000!important}
  body>*:not(#printArea){display:none!important}
  body::before{display:none!important}
  #printArea{display:block;font:11pt/1.7 var(--sans);color:#000}
  #printArea h1{font-size:16pt;margin:0 0 2mm}
  #printArea h2{font-size:12pt;margin:5mm 0 2mm;border-bottom:.3mm solid #000;padding-bottom:1mm}
  #printArea .meta{font-size:9pt;color:#444;display:flex;justify-content:space-between;gap:4mm;margin-bottom:3mm}
  #printArea .ps{font-family:var(--serif);font-size:11pt;line-height:1.8;margin:0 0 2mm}
  #printArea .ps b{font-family:var(--sans)}
  #printArea .q{font-weight:700;border:.3mm solid #000;padding:2mm 3mm;margin:3mm 0}
  #printArea .ans{font-family:var(--serif);white-space:pre-wrap;line-height:1.9;border-left:.8mm solid #999;padding-left:3mm}
  #printArea .ol{display:grid;grid-template-columns:auto 1fr;gap:1.5mm 3mm;font-size:10pt}
  #printArea .ol span{border-bottom:.2mm solid #888;min-height:7mm}
  #printArea .grid{display:grid;grid-template-columns:repeat(20,1fr);border-top:.3mm solid #2E7D5B;border-left:.3mm solid #2E7D5B;margin-top:2mm}
  #printArea .grid i{aspect-ratio:1;border-right:.2mm solid #2E7D5B;border-bottom:.2mm solid #2E7D5B}
  #printArea .grid i.row{border-bottom-width:.5mm}
  #printArea .tick{font-size:8pt;color:#555;text-align:right}
  #printArea .note{font-size:8.5pt;color:#555}
  #printArea .keep{break-inside:avoid}
  #printArea .seg{border-left:1mm solid #2E7D5B;padding:1mm 3mm;margin:2.5mm 0;break-inside:avoid}
  #printArea .seg .st{font-family:var(--serif);margin:0}
  #printArea .seg .why{font-size:9pt;color:#444;margin:0}
}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-size:14px;z-index:50;max-width:90vw}
details summary{cursor:pointer;font-weight:600;min-height:32px}
.hide{display:none!important}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <a class="mark" href="#/today" aria-label="써보다 홈"><b>써보다</b><span class="wm">ApuDa<span>.write</span></span></a>
  <div class="family" id="family"></div>
</div></header>
<main id="app" tabindex="-1"></main>
<nav class="tab" id="nav" aria-label="주요 메뉴"><div class="in">
  <a href="#/today" data-r="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>오늘</a>
  <a href="#/train" data-r="train"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13 7l4 4"/></svg>훈련</a>
  <a href="#/univ" data-r="univ"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 9l9-5 9 5-9 5z"/><path d="M7 11v5c2 2 8 2 10 0v-5"/></svg>목표 대학</a>
  <a href="#/log" data-r="log"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>기록</a>
</div></nav>
<script src="sets.js"></script>
<script src="resources.js"></script>
<script>
"use strict";
/* ===== 설정: 아프다 패밀리 연결 ===== */
const CFG = {
  version: "1.9.1",
  api: "api/feedback", // 상대 경로: 루트 배포면 /api/feedback, future.apuda.app/write/ 면 /write/api/feedback
  family: [
    { name: "미래 나침반", url: location.hostname==="future.apuda.app" ? "/" : "https://future.apuda.app/?from=write" },
    { name: "ApuDa", url: "https://apuda.app/?from=write" },
  ].filter(f => !(location.hostname==="future.apuda.app" && f.name==="ApuDa")), // 공부방 안에서는 학습과 무관한 ApuDa 칩 숨김
};
const SETS = window.SSUBODA_SETS || [];
let SETMAP = {};
function rebuildSets(){ SETMAP = Object.fromEntries([...SETS, ...((S&&S.custom)||[])].map(s => [s.id, s])); }
const KEY = "ssuboda.v1";
const DOW = ["일","월","화","수","목","금","토"];
const DOC_TYPES = ["해당 학년도 공식 모집요강","해당 학년도 시행계획","이전 학년도 참고","확인 필요"];
const ESSAY_TYPES = ["확인 필요","인문·사회 제시문형","국어·수학 약술형","수리 요소 포함"];
const AREAS = ["국어","수학","영어","탐구"];
const GRADE_FIELDS = ["국어","수학","영어","통합사회","통합과학","한국사"]; // 2028 체제: 탐구 = 통합사회·통합과학 모두 응시
const INQUIRY = ["확인 필요","높은 1과목","2과목 평균"];

/* ===== 저장소 ===== */
function blank(){
  const y = new Date().getFullYear();
  return { v:1, profile:null,
    settings:{ examStart:"", examEnd:"", guardianShare:false, guardianDrafts:false, showScores:false, appCode:"", pinHash:"", pinSalt:"" },
    attempts:{}, log:[], scores:[], custom:[], goal:{ count:2, sum:4, areas:["국어","수학","영어","탐구"], inquiry:"높은 1과목" },
    univs:[
      { id:uid(), name:"한국외국어대학교", campus:"", unit:"", track:"논술전형", year:y+3, docType:"확인 필요", url:"", page:"", checked:"", essayType:"확인 필요", cond:null, note:"관심 후보. 2029학년도 공식 자료 확인 전." },

const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today = () => ymd(new Date());
function ymd(d){ const z=n=>String(n).padStart(2,"0"); return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`; }
function weekStart(d=new Date()){ const x=new Date(d); x.setHours(0,0,0,0); const k=(x.getDay()+6)%7; x.setDate(x.getDate()-k); return x; }
function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg; t.setAttribute("role","status"); document.body.appendChild(t); setTimeout(()=>t.remove(),2600); }
function hm(ts){ const d=new Date(ts); return `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; }
function inExam(){ const s=S.settings; if(!s.examStart||!s.examEnd) return false; const t=today(); return t>=s.examStart && t<=s.examEnd; }
function attemptsOf(setId){ return Object.values(S.attempts).filter(a=>a.setId===setId).sort((a,b)=>b.createdAt-a.createdAt); }
function latest(setId){ return attemptsOf(setId)[0]; }
function statusOf(a){
  if(!a) return ["안 함",""];
  if(a.rewrite && a.fb2) return ["재작성 완료","ok"];
  if(a.fb) return ["점검 완료 · 다시 쓰기 대기","warn"];
  if(a.draft) return ["초안 저장","" ];
  return ["시작함",""];
}
function addMinutes(sec){
  if(sec<=0) return;
  const d = today(); let row = S.log.find(r=>r.date===d);
  if(!row){ row={date:d, sec:0}; S.log.push(row); }
  row.sec += sec; if(S.log.length>400) S.log.shift();
}
async function sha(s){ const b=await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join(""); }

function nextSet(){

}
function rewriteCandidate(){
  return Object.values(S.attempts).filter(a=>a.fb && !a.fb2).sort((a,b)=>b.updatedAt-a.updatedAt)[0];
}
function lastFix(){
  const a = Object.values(S.attempts).filter(a=>a.fb2||a.fb).sort((a,b)=>b.updatedAt-a.updatedAt)[0];
  if(!a) return null; const f=(a.fb2||a.fb).fixes?.[0]; return f ? {a,f} : null;
}
function weekInfo(){
  const ws=weekStart(); const days=[];
  for(let i=0;i<7;i++){ const d=new Date(ws); d.setDate(ws.getDate()+i); days.push(d); }
  const planDays=S.profile.days;
  const done=days.map(d=>{ const r=S.log.find(x=>x.date===ymd(d)); return r?r.sec:0; });
  const plannedMin = planDays.reduce((s,d)=>s+((d===0||d===6)?35:20),0);
  const doneSessions = days.filter((d,i)=>planDays.includes(d.getDay()) && done[i]>=300).length;
  return { days, done, plannedMin, doneMin:Math.round(done.reduce((a,b)=>a+b,0)/60), doneSessions, planned:planDays.length };
}

    <form class="sheet" id="cf">

      <p class="tiny">제시문은 각 1,500자까지 피드백에 쓰여요. 더 긴 지문은 문제와 관련된 부분만 붙여요.</p>

    const mn=+$("#cmin").value, mx=+$("#cmax").value;

/* ===== 쓰기 ===== */
const PHASES=[["읽기",4],["개요",4],["초안",8],["고치기",4]];
function vWrite(app, arg){
  const [setId, qs] = String(arg||"").split("?");
  const s = SETMAP[setId]; if(!s){ app.innerHTML=`<p>세트를 찾지 못했어요. <a href="#/train">훈련으로</a></p>`; return; }
  const aid = new URLSearchParams(qs||"").get("a");
  let a = (aid && S.attempts[aid]) || latest(setId);
  if(!a || (a.fb2 && !aid)){ a = { id:uid(), setId, createdAt:Date.now(), updatedAt:Date.now(), outline:["","",""], draft:"", rewrite:"", sec:0 }; S.attempts[a.id]=a; save(); }
  const stage = a.fb ? "rewrite" : "draft";
  let tab = "pass";
  const passHTML = (hlLabel, hlText) => s.passages.map(p=>{ let t=esc(p.text); if(hlLabel===p.label && hlText){ const e=esc(hlText); t=t.split(e).join(`<mark class="hl">${e}</mark>`);} return `<p class="passage" id="p-${p.label}"><b>${s.passages.length>1?`제시문 ${p.label}`:"제시문"}</b>${t}</p>`; }).join("");
  app.innerHTML = `
    <div class="wtop"><a href="#/train" class="small">← 훈련</a><span class="grow"></span>${s.kind==="custom"?`<span class="chip">내 문제</span>`:!s.reviewed?`<span class="chip warn">검토 전 세트</span>`:""}<span class="timer" id="tm">00:00</span></div>
    <h1>${esc(s.title)}</h1>
    <div class="phase" id="ph" aria-hidden="true">${PHASES.map(([n,m])=>`<i style="--w:${m}" title="${n} ${m}분"></i>`).join("")}</div>
    <p class="tiny" id="phl">${(s.minutes||20)>20?`권장 ${s.minutes}분 · 긴 답안이라 단계별 시간은 참고만`:"읽기 4분 → 개요 4분 → 초안 8분 → 고치기 4분"}</p>
    <div class="tabs" role="tablist"><button role="tab" data-t="pass" aria-selected="true">제시문</button><button role="tab" data-t="write" aria-selected="false">${stage==="rewrite"?"피드백·다시 쓰기":"쓰기"}</button></div>
    <div class="wgrid">
      <section class="sheet pass" data-p="pass" id="passBox">${passHTML()}<p class="question">${esc(s.question)}</p>${s.learn?`<p><a class="btn ghost" style="display:inline-flex;align-items:center;min-height:40px" href="#/learn/${s.id}">예시 답안 먼저 보기</a></p>`:""}${CAN_PRINT?`<p><button class="btn ghost" type="button" id="pws" style="min-height:40px">손글씨 연습지 인쇄</button></p><p class="tiny">손으로 쓴 뒤 앱에 옮겨 적으면 점검·AI 코칭을 받을 수 있어요.</p>`:""}
        ${s.kind!=="diag"&&s.hints&&s.hints.length?`<details id="hint"><summary>막히면 힌트</summary><ul class="small" id="hintList"></ul></details>`:""}${s.kind==="diag"?`<p class="tiny">진단은 힌트 없이 써요. 제출하면 해설이 열려요.</p>`:""}${s.source?`<p class="tiny">출처: ${esc(s.source)} · 개인 공부용</p>`:""}</section>
      <section data-p="write" style="display:none" id="writeBox"></section>
    </div>`;
  const wb=$("#writeBox");
  if($("#pws")) $("#pws").onclick=()=>printWorksheet(s);
  wb.addEventListener("click", e=>{ if(e.target && e.target.id==="pat") printAttempt(a, s); });
  const hd=$("#hint"); if(hd){ const fill=()=>{ const h=s.hints; $("#hintList").innerHTML = `<li>${esc(h[0])}</li>` + (h[1] ? ((a.sec||0)>=120 ? `<li>${esc(h[1])}</li>` : `<li class="tiny">다음 힌트는 쓰기 시작 2분 뒤에 열려요.</li>`) : ""); }; fill(); hd.addEventListener("toggle", fill); }
  function setTab(t){ tab=t; app.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-selected", b.dataset.t===t)); app.querySelectorAll(".wgrid>section").forEach(x=>x.style.display = x.dataset.p===t ? "" : "none"); }
  app.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>setTab(b.dataset.t));
  if(a.draft || a.fb) setTab("write");

  // 타이머 + 학습시간 (입력 없이 3분 지나면 멈춤)
  let start=Date.now(), lastInput=Date.now(), acc=0, tick;
  const tm=$("#tm"), ph=$("#ph");
  tick=setInterval(()=>{
    if(document.visibilityState==="visible" && Date.now()-lastInput<180000){ acc++; a.sec=(a.sec||0)+1; }
    const t=a.sec||0; tm.textContent=`${String(Math.floor(t/60)).padStart(2,"0")}:${String(t%60).padStart(2,"0")}`;
    let m=t/60, k=0; const bars=[...ph.children]; let c=0;
    PHASES.forEach(([n,len],i)=>{ bars[i].className = m>=c+len ? "past" : (m>=c ? "on" : ""); c+=len; });
    if(acc>=30){ addMinutes(acc); acc=0; save(); }
  },1000);
  const bump=()=>{ lastInput=Date.now(); };
  cleanup=()=>{ clearInterval(tick); if(acc){ addMinutes(acc); acc=0; } a.updatedAt=Date.now(); save(); };

  function ruler(len){
    const max=Math.max(s.max*1.4, len+10), L=x=>Math.min(100, x/max*100);
    const cls = len>s.max?"over":len>=s.min?"ok":"";
    return `<div class="ruler" aria-label="글자 수 ${len}자, 목표 ${s.min}~${s.max}자"><div class="track"><div class="zone" style="left:${L(s.min)}%;width:${L(s.max)-L(s.min)}%"></div><div class="pin" style="left:${L(len)}%"></div></div>
      <div class="lab"><span><span class="count ${cls}">${len}</span>자 (공백 포함)</span><span>목표 ${s.min}~${s.max}자</span></div></div>`;
  }
  function editor(field, label){
    return `<label class="f" for="ta">${label}</label>
      <div class="manuscript"><textarea id="ta" spellcheck="false" placeholder="여기에 직접 써요. 막히면 개요 1칸부터 채워요.">${esc(a[field])}</textarea></div>
      <div id="rl">${ruler(a[field].length)}</div>
      <div class="save" id="sv">${a.updatedAt?`기기에 저장됨 ${hm(a.updatedAt)}`:""}</div>`;
  }
  function bindEditor(field){
    const ta=$("#ta"); let to;
    ta.addEventListener("input",()=>{ bump(); a[field]=ta.value; $("#rl").innerHTML=ruler(ta.value.length); $("#sv").textContent="입력 중…"; clearTimeout(to);
      to=setTimeout(()=>{ a.updatedAt=Date.now(); const ok=save(); const sv=$("#sv"); if(sv) sv.textContent = ok ? `기기에 저장됨 ${hm(a.updatedAt)}` : "저장 실패 — 설정에서 내보내기로 백업해 주세요"; },1200); });
  }

  const CHECKS=["문제가 시킨 행동(요약·비교·평가 등)을 빠짐없이 했다","제시문 근거를 내 문장으로 넣었다","결론이 제시문이 말하는 범위 안에 있다","목표 분량을 맞췄다"];
  function checklist(key){
    const v=a[key]||[];
    return `<div class="sheet"><h3 style="margin-top:0">스스로 점검</h3>${CHECKS.map((c,i)=>`<label class="row small" style="min-height:40px;flex-wrap:nowrap"><input type="checkbox" data-ck="${key}" data-i="${i}" ${v[i]?"checked":""}> <span>${esc(c)}</span></label>`).join("")}</div>`;
  }
  function aiBox(stage){
    const f=stage===1?a.ai1:a.ai2; const err=a.aiErr&&a.aiErr.stage===stage?a.aiErr.msg:"";
    if(f) return `<div class="sheet fb" id="aibox${stage}"><h3 style="margin-top:0">🤖 AI 코칭 ${stage===2?"(수정본)":"(초안)"}</h3>${fbHTML(f,s,stage===2)}</div>`;
    return `<div class="sheet"><h3 style="margin-top:0">🤖 AI 코칭 <span class="chip">선택</span></h3>
      <p class="small muted">${stage===1?"초안을":"수정본을"} AI가 제시문과 맞대어 읽고 근거·논리를 분석해요. 필요할 때만 눌러요.</p>
      ${err?`<p class="small" style="color:var(--red)">${esc(err)}</p>`:""}
      ${a.aiErr&&a.aiErr.stage===stage&&a.aiErr.code==="AUTH" ? `<div class="row" style="margin-top:8px"><input type="password" id="acin${stage}" inputmode="numeric" autocomplete="off" placeholder="접속 코드 입력" aria-label="접속 코드" style="flex:1;min-width:140px"><button class="btn primary" type="button" id="acsv${stage}">코드 저장하고 AI 분석 받기</button></div>
        <p class="tiny">코드는 이 기기에 저장돼서 다음부터는 안 물어봐요. <a href="#/settings">설정에서 바꾸기</a></p>`
        : `<div class="actions"><button class="btn" type="button" id="ai${stage}">🤖 AI 코칭 받기</button></div>`}</div>`;
  }
  function draw(){
    if(!a.fb){
      wb.innerHTML = `<div class="sheet">
        <h3>쓰기 전 개요 3칸</h3><div class="outline">${s.outline.map((o,i)=>`<input type="text" data-o="${i}" placeholder="${esc(o)}" value="${esc(a.outline?.[i]||"")}" aria-label="${esc(o)}">`).join("")}</div>
        ${editor("draft","답안")}
        <div class="actions"><button class="btn primary" id="sub">다 썼어요 · 점검하기</button></div>
        <p class="tiny">점검은 기기 안에서 바로 돼요(AI 아님). AI 검토·분석은 다음 화면에서 원할 때만 받아요.</p></div>`;
      wb.querySelectorAll("[data-o]").forEach(i=>i.oninput=()=>{ bump(); a.outline[+i.dataset.o]=i.value; save(); });
      bindEditor("draft");
      $("#sub").onclick=()=>submit("draft");
    } else {
      const selfBody = `${fbHTML(a.fb, s)}${CAN_PRINT?`<div class="actions"><button class="btn" type="button" id="pat">내 답안·점검 인쇄</button></div>`:""}`;
      const selfTitle = a.fb.kind==="self"?"자동 점검 결과":"첫 피드백";
      wb.innerHTML = `${a.ai1&&!a.fb2?aiBox(1):""}
        ${a.ai1 ? `<details class="sheet fb"><summary><b>${selfTitle}</b> <span class="tiny">(기기 안 규칙 점검 · 펼쳐 보기)</span></summary>${selfBody}</details>` : `<div class="sheet fb"><h3 style="margin-top:0">${selfTitle}</h3>${selfBody}</div>`}
        ${a.fb.kind==="self"&&!a.fb2&&!a.ai1?checklist("checks1"):""}

        <div class="sheet">${!a.fb2 ? `<h3>다시 쓰기</h3><p class="small muted">고칠 점부터 한 문장씩 고쳐요. 첫 답안은 그대로 보관돼요.</p>${s.check?`<p class="small"><b>제출 전 확인</b> ${esc(s.check)}</p>`:""}

      if(!a.fb2){ if(!a.rewrite){ a.rewrite=a.draft; } bindEditor("rewrite"); $("#ta").value=a.rewrite; $("#rl").innerHTML=ruler(a.rewrite.length); $("#sub").onclick=()=>submit("rewrite"); }

      wb.querySelectorAll("[data-ck]").forEach(c=>c.onchange=()=>{ const k=c.dataset.ck; a[k]=a[k]||[]; a[k][+c.dataset.i]=c.checked; save(); });

  }

  // 기본: 기기 안 규칙 점검으로 바로 다음 단계 (AI 없이도 쓰기 → 점검 → 다시 쓰기 → 예시까지 끝까지 감)

    delete a.pending; a.updatedAt=Date.now(); save();
    toast(stage==="draft"?"점검 완료 · 다시 써 봐요":"수정본 점검 완료");

  // 선택: AI 검토·분석 (버튼을 눌렀을 때만 Gemini 호출, 실패해도 학습 흐름은 그대로)
  async function requestAI(n){
    const text = (n===1?a.draft:a.rewrite).trim();
    const btn=$("#ai"+n); if(btn){ btn.disabled=true; btn.textContent="AI가 읽는 중… (최대 40초)"; }
    const rid = `${a.id}-ai${n}-${await sha(text).then(h=>h.slice(0,12))}`;
    const body = { request_id:rid, mode: n===1?"first":"rewrite", answer:text, outline:a.outline,
      set:{ id:s.id, question:s.question, min:s.min, max:s.max, passages:s.passages.map(p=>({label:p.label,text:p.text})) },

      let j;

        clearTimeout(to);

      const fb = Object.assign({}, j.feedback, { meta:j.meta, kind:"ai" });
      if(n===1) a.ai1=fb; else a.ai2=fb;
      delete a.aiErr; a.updatedAt=Date.now(); save(); toast("AI 분석 도착");
    }catch(e){
      a.aiErr={ stage:n, code:e.code||"", msg: e.name==="AbortError" ? "AI 응답 시간이 초과됐어요. 잠시 뒤 다시 눌러 주세요." : e.message }; save();
    }
    draw(); setTab("write");
  }
  draw();
}
// 서버(/api/feedback)가 없는 곳(claude.ai 아티팩트)에서만 쓰는 임시 경로: 같은 프롬프트·같은 인용 검증으로 Claude에 요청
async function aiViaSample(body){
  const C=window.SSUBODA_CORE; if(!C || !window.claude || !window.claude.use) return null;
  let sample=null; try{ sample=await window.claude.use("sample"); }catch(e){}
  if(!sample) return null;
  try{
    const r=await sample([{role:"user", content: C.SYSTEM + "\n\n" + C.buildUser(body)}], {modelTier:"default"});
    const fb=C.sanitize(C.parseJSON(r.text), body);
    return { ok:true, feedback:fb, meta:{ provider:"claude(임시)", model:"claude.ai 아티팩트", prompt:C.PROMPT_VERSION, rubric:C.RUBRIC_VERSION, at:new Date().toISOString() } };
  }catch(e){ return { ok:false, error: e && e.code==="rate_limited" ? "잠시 뒤 다시 요청해 주세요(요청이 많아요)." : e && e.code==="not_granted" ? "AI 사용이 허용되지 않았어요." : "AI 응답을 읽지 못했어요." }; }
}

// AI 코칭 카드: 한 줄 총평 → 잘한 점 → 고칠 점(내 문장·근거·이렇게 고쳐 보기) → 맞춤법 → 질문 → 5분 과제 → 항목별(접힘)
const TAG_TIP={요구미충족:"문제가 시킨 행동이 빠졌어요",요약부정확:"핵심 주장을 다시 잡아요",제시문오독:"제시문을 다시 읽어요",근거누락:"제시문 근거가 필요해요",연결부족:"근거와 주장을 이어요",범위초과결론:"결론을 제시문 범위로",수치해석과잉:"숫자가 말하는 만큼만",반론누락:"반대쪽도 짚어요",분량:"분량을 맞춰요"};

// 기기 안 규칙 점검 → 피드백과 같은 모양(잘한 점 1 + 고칠 점 최대 2). 내용의 옳고 그름은 판정하지 않는다.
const ABS_WORDS=["모든","반드시","항상","절대","무조건"];
function selfReview(s, text, outline, prev){
  const n=text.length, goods=[], fixes=[], name=p=>s.passages.length>1?`제시문 ${p.label}`:"제시문";
  if(n<s.min) fixes.push({issue:`분량이 ${s.min-n}자 모자라요 (${n}자 / 목표 ${s.min}~${s.max}자).`, suggestion:"제시문 근거를 한 문장 더 넣어 채워요.", tag:"분량"});
  else if(n>s.max) fixes.push({issue:`${n-s.max}자 넘었어요 (${n}자 / 목표 ${s.min}~${s.max}자).`, suggestion:"같은 뜻을 되풀이한 문장부터 줄여요.", tag:"분량"});
  else goods.push(`분량이 목표 범위(${s.min}~${s.max}자) 안이에요.`);
  s.passages.forEach(p=>{ if(!p.kw||!p.kw.length) return; const hit=p.kw.filter(k=>text.includes(k));
    if(hit.length) goods.unshift(`${name(p)}의 핵심 표현(${hit.slice(0,2).join(", ")})을 근거로 썼어요.`);
    else fixes.push({issue:`${name(p)}의 내용이 답안에 잘 보이지 않아요.`, suggestion:`${name(p)}에서 근거가 되는 부분을 찾아 내 말로 한 문장 넣어요.`, tag:"근거누락"}); });
  const passAll=s.passages.map(p=>p.text).join(" ");
  const abs=ABS_WORDS.filter(w=>text.includes(w) && !passAll.includes(w));
  if(abs.length) fixes.push({issue:`'${abs[0]}' 같은 단정 표현이 있어요.`, suggestion:"제시문이 말하는 범위까지만 결론을 내고, 필요하면 조건을 붙여요.", tag:"범위초과결론"});
  if(outline && outline.filter(x=>x&&x.trim()).length<2) fixes.push({issue:"개요를 거의 비우고 썼어요.", suggestion:"개요 3칸을 채우고 그 순서대로 문장을 배치해요.", tag:"연결부족"});
  const fb={ kind:"self", insufficient:false,
    strength:{ text: goods[0] || "끝까지 직접 썼어요. 이제 고칠 곳을 찾아봐요.", answer_quote:"" },
    fixes: fixes.slice(0,2),
    self_question: s.check || "문제가 시킨 것을 빠짐없이 했나요?",
    next_action: fixes.length ? "고칠 점 1번부터 한 문장씩 고쳐 써요." : "아래 '스스로 점검'을 확인하고, 근거와 결론을 잇는 문장을 하나 더 다듬어요.",
    changes:"", rubric:null, meta:{ provider:"자동 점검", model:"기기 안 규칙 점검 · AI 아님" } };
  if(prev!=null){ const A=sentences(prev), B=sentences(text); const changed=B.filter(x=>!A.includes(x)).length; fb.changes=`문장 ${changed}개를 새로 쓰거나 고쳤어요 (${prev.length}자 → ${n}자).`; }
  return fb;
}
function localCheck(s, text, outline){
  const out=[]; const n=text.length;
  out.push(n<s.min?`분량: ${n}자 — 목표 ${s.min}자까지 ${s.min-n}자 더 필요해요.`: n>s.max?`분량: ${n}자 — ${n-s.max}자 줄여야 해요.`:`분량: ${n}자 — 목표 범위 안이에요.`);
  s.passages.forEach(p=>{ if(!p.kw||!p.kw.length) return; const hit=p.kw.filter(k=>text.includes(k)); const name=s.passages.length>1?`제시문 ${p.label}`:"제시문";
    out.push(hit.length ? `${name}: 핵심 표현(${hit.slice(0,3).join(", ")})을 사용했어요.` : `${name}의 내용을 답안에서 찾기 어려워요. 근거로 연결했는지 확인해요.`); });
  const passAll=s.passages.map(p=>p.text).join(" ");
  const abs=ABS_WORDS.filter(w=>text.includes(w) && !passAll.includes(w)); // 제시문에도 있는 말은 인용일 수 있어 제외
  if(abs.length) out.push(`'${abs.join("', '")}' 같은 단정 표현이 있어요. 제시문 범위를 넘는 결론인지 확인해요.`);
  if(outline && outline.filter(x=>x&&x.trim()).length<2) out.push("개요 칸을 2개 이상 채우면 구조가 잡혀요.");
  return out;
}
function sentences(t){ return String(t||"").split(/(?<=[.!?。])\s+|\n+/).map(x=>x.trim()).filter(Boolean); }
function diffHTML(a,b){
  const A=sentences(a), B=sentences(b); const As=new Set(A), Bs=new Set(B);

function latestMock(){ return S.scores.filter(x=>x.system==="mock").sort((a,b)=>(b.date||"").localeCompare(a.date||""))[0]; }
function tamgu(gr, mode){
  if(Number.isFinite(gr?.["탐구"])) return {v:gr["탐구"]}; // 이전 버전 기록
  const a=gr?.["통합사회"], b=gr?.["통합과학"];
  if(mode==="확인 필요"||!mode) return {why:"탐구 반영 방식(높은 1과목/평균)이 정해지지 않았어요. 원문에서 확인해 넣어 주세요."};
  if(!Number.isFinite(a)||!Number.isFinite(b)) return {why:"통합사회·통합과학 등급을 둘 다 넣어야 해요."};
  return {v: mode==="2과목 평균" ? (a+b)/2 : Math.min(a,b)};
}
function evalCond(cond, sc){
  // cond: {areas:[...], count, sum, historyMax?, inquiry, complete}
  if(!cond || !cond.areas?.length || !cond.count || !cond.sum) return {r:"확인 필요", why:"조건이 비어 있어요."};
  if(cond.complete===false) return {r:"확인 필요", why:"공식 조건을 다 옮기지 못했다고 표시돼 있어요. 원문과 대조해요."};
  if(!sc) return {r:"확인 필요", why:"입력된 모의고사 등급이 없어요."};
  let tg=null;
  if(cond.areas.includes("탐구")){ tg=tamgu(sc.grades, cond.inquiry); if(tg.why) return {r:"확인 필요", why:tg.why}; }
  const g = cond.areas.map(k=>k==="탐구"?tg.v:sc.grades?.[k]).filter(v=>Number.isFinite(v));
  if(g.length < cond.areas.length) return {r:"확인 필요", why:"반영 영역 중 비어 있는 등급이 있어요."};
  const best=[...g].sort((a,b)=>a-b).slice(0,cond.count); const sum=best.reduce((a,b)=>a+b,0);
  let ok = sum<=cond.sum, why=`상위 ${cond.count}개 합 ${Math.round(sum*10)/10} (기준 ${cond.sum} 이내)${tg?` · 탐구 ${cond.inquiry}`:""}`;
  if(cond.historyMax){ const h=sc.grades?.["한국사"]; if(!Number.isFinite(h)) return {r:"확인 필요", why:"한국사 등급이 없어요."}; if(h>cond.historyMax){ ok=false; } why+=` · 한국사 ${h} (기준 ${cond.historyMax} 이내)`; }
  return {r: ok?"입력 성적 기준 충족":"입력 성적 기준 미충족", why};
}

    Object.assign(u,{ name:$("#un").value.trim(), campus:$("#uc").value.trim(), unit:$("#uu").value.trim(), track:$("#ut").value.trim(), year:+$("#uy").value||ty, docType:$("#ud").value, url:$("#url").value.trim(), page:$("#up").value.trim(), checked:$("#uk").value, essayType:$("#ue").value, note:$("#unote").value.trim(),
      cond:(areas.length&&cc&&cs)?{areas,count:cc,sum:cs,historyMax:ch||0,inquiry:$("#ci").value,complete:$("#cfull").checked}:null });
    if(!u.name){ toast("대학명을 써 주세요"); return; }
    if(u.cond && !u.url){ if(!(await ask("출처 URL 없이 조건을 저장하면 나중에 검증하기 어려워요. 그래도 저장할까요?",{ok:"저장"}))) return; }
    if(isNew) S.univs.push(u); save(); route();
  };
}

/* ===== 기록 ===== */
function vLog(app){
  const all=Object.values(S.attempts).filter(a=>a.draft).sort((a,b)=>b.createdAt-a.createdAt);
  const fbN=all.filter(a=>a.fb).length, rwN=all.filter(a=>a.fb2).length;
  const totalMin=Math.round(S.log.reduce((s,r)=>s+r.sec,0)/60);
  const weeks=[]; for(let i=5;i>=0;i--){ const ws=weekStart(); ws.setDate(ws.getDate()-7*i); const we=new Date(ws); we.setDate(ws.getDate()+7);
    const sec=S.log.filter(r=>r.date>=ymd(ws)&&r.date<ymd(we)).reduce((s,r)=>s+r.sec,0); weeks.push({label:`${ws.getMonth()+1}/${ws.getDate()}`, min:Math.round(sec/60)}); }
  const plan=S.profile.days.reduce((s,d)=>s+((d===0||d===6)?35:20),0);
  const mx=Math.max(plan, ...weeks.map(w=>w.min), 1);
  const tags={}; all.forEach(a=>[a.fb,a.fb2].forEach(f=>f?.fixes?.forEach(x=>{ if(x.tag) tags[x.tag]=(tags[x.tag]||0)+1; })));
  const tagList=Object.entries(tags).sort((a,b)=>b[1]-a[1]);
  app.innerHTML = `<h1>기록</h1>
    <div class="stat"><div><b>${all.length}</b><span class="small muted">쓴 답안</span></div><div><b>${rwN}/${fbN}</b><span class="small muted">피드백 후 다시 쓴 답안</span></div><div><b>${totalMin}분</b><span class="small muted">누적 학습</span></div></div>
    <h2>주별 학습 시간</h2><div class="sheet"><div class="bars">${weeks.map(w=>`<div><span>${w.min}</span><i style="height:${w.min/mx*100}%"></i></div>`).join("")}</div>
      <div class="row" style="justify-content:space-between">${weeks.map(w=>`<span class="tiny">${w.label}</span>`).join("")}</div><p class="tiny">주 목표 ${plan}분</p></div>
    <h2>반복되는 고칠 점</h2><div class="sheet">${tagList.length?tagList.map(([t,n])=>`<span class="chip" style="margin:2px">${esc(t)} ${n}</span>`).join(""):`<p class="muted small">피드백을 받으면 여기에 쌓여요.</p>`}
      ${tagList[0]?`<p class="small" style="margin-top:8px">가장 자주 나온 점: <b>${esc(tagList[0][0])}</b>. 다음 답안에서 이것 하나만 먼저 확인해요.</p>`:""}</div>
    <h2>지난 답안</h2><div class="sheet" style="padding:4px 16px">${all.map(a=>{const s=SETMAP[a.setId]; const [st,c]=statusOf(a); return `<a class="set" href="#/view/${a.id}"><span class="wk">${new Date(a.createdAt).getMonth()+1}/${new Date(a.createdAt).getDate()}</span><span class="grow"><span class="t">${esc(s?.title||a.setId)}</span><br><span class="small muted">${a.draft.length}자${a.fb2?` → ${a.rewrite.length}자`:""}</span></span><span class="chip ${c}">${st}</span></a>`;}).join("")||`<p class="muted small" style="padding:12px 0">아직 쓴 답안이 없어요. <a href="#/today">오늘의 20분 시작</a></p>`}</div>`;
}

/* ===== 설정 ===== */
function guardianText(){
  const w=weekInfo(); const all=Object.values(S.attempts);
  const ws=weekStart().getTime();
  const thisWeek=all.filter(a=>a.updatedAt>=ws && a.draft);
  const rw=thisWeek.filter(a=>a.fb2).length;
  const tags={}; thisWeek.forEach(a=>a.fb?.fixes?.forEach(x=>x.tag&&(tags[x.tag]=(tags[x.tag]||0)+1)));
  const top=Object.entries(tags).sort((a,b)=>b[1]-a[1])[0];
  const fixed=thisWeek.filter(a=>a.fb2 && a.fb2.changes).map(a=>a.fb2.changes)[0];
  let t=`[써보다 주간 요약] ${S.profile.nick} · ${ymd(weekStart())} 주\n- 완료: ${w.doneSessions}/${w.planned}회, ${w.doneMin}/${w.plannedMin}분\n- 다시 쓴 답안: ${rw}개 (이번 주 쓴 답안 ${thisWeek.length}개)\n`;
  t+= fixed ? `- 나아진 점: ${fixed}\n` : "";
  const PLAIN={"요구미충족":"문제가 시킨 것을 빠짐없이 하기","근거누락":"제시문 근거를 한 문장 더 넣기","범위초과결론":"제시문에 있는 만큼만 결론 내기","제시문오독":"제시문을 한 번 더 천천히 읽기","분량":"글자 수 범위 맞추기","연결부족":"근거와 주장을 '그래서'로 이어 주기","수치해석과잉":"숫자가 말하는 것까지만 해석하기","반론누락":"반대 입장도 한 줄 다루기","요약부정확":"핵심 주장을 한 문장으로 잡기"};
  t+= `- 다음 주 목표: ${top?(PLAIN[top[0]]||top[0]):"계획한 횟수 채우기"}\n`;
  if(S.settings.guardianDrafts){ thisWeek.slice(0,3).forEach(a=>{ t+=`\n· ${SETMAP[a.setId]?.title}\n${a.fb2?a.rewrite:a.draft}\n`; }); }
  return t;
}
function vGuardian(app){
  if(!S.settings.guardianShare){ app.innerHTML=`<h1>보호자 요약</h1><div class="banner">학생이 설정에서 공유를 켜야 볼 수 있어요.</div><a href="#/settings">설정으로</a>`; return; }
  const t=guardianText();
  app.innerHTML=`<a href="#/settings" class="small">← 설정</a><h1>보호자 주간 요약</h1><div class="sheet"><pre style="white-space:pre-wrap;font:inherit;margin:0">${esc(t)}</pre></div>
    <div class="actions"><button class="btn primary" id="share">보내기</button><button class="btn" id="copy">복사</button></div>
    <p class="tiny">요약은 학생이 직접 보내요. 서버에 올리지 않아요.</p>`;
  $("#copy").onclick=async()=>{ try{ await navigator.clipboard.writeText(t); toast("복사했어요"); }catch(e){ toast("복사하지 못했어요. 길게 눌러 선택해 주세요"); } };
  $("#share").onclick=async()=>{ if(navigator.share){ try{ await navigator.share({title:"써보다 주간 요약", text:t}); }catch(e){} } else $("#copy").click(); };
}
function vSettings(app){
  const s=S.settings, p=S.profile;
  app.innerHTML=`<h1>설정</h1>
    <div class="sheet"><h3>학습</h3>
      <label class="f">공부할 요일</label><div class="days">${[1,2,3,4,5,6,0].map(d=>`<label><input type="checkbox" value="${d}" ${p.days.includes(d)?"checked":""}>${DOW[d]}</label>`).join("")}</div>
      <div class="row"><div class="grow"><label class="f" for="es">시험기간 시작</label><input type="date" id="es" value="${esc(s.examStart)}"></div><div class="grow"><label class="f" for="ee">끝</label><input type="date" id="ee" value="${esc(s.examEnd)}"></div></div>
      <p class="tiny">시험기간에는 5분 복습(주 2회)만 보여줘요.</p>
      <div class="actions"><button class="btn primary" id="ss">학습 설정 저장</button></div></div>

    <div class="sheet"><h3>보호자 공유</h3>
      <label class="row small" style="min-height:44px"><input type="checkbox" id="gs" ${s.guardianShare?"checked":""}> 주간 요약 공유 켜기 (완료량·재작성·다음 목표)</label>
      <label class="row small" style="min-height:44px"><input type="checkbox" id="gd" ${s.guardianDrafts?"checked":""}> 요약에 답안 본문도 넣기</label>
      <div class="actions"><button class="btn" id="gsv">공유 설정 저장</button>${s.guardianShare?`<a class="btn" style="display:inline-flex;align-items:center;justify-content:center" href="#/guardian">이번 주 요약 보기</a>`:""}</div></div>

    <div class="sheet"><h3>AI 검토·분석</h3>
      <p class="small muted">쓰기·점검·다시 쓰기는 AI 없이 돼요. AI는 답안 화면의 'AI 검토·분석 받기'를 눌렀을 때만 써요.</p>
      <p class="small" id="srv">서버 상태 확인 중…</p>
      <label class="f" for="ac">접속 코드 (서버에 코드가 걸려 있을 때만)</label><input type="password" id="ac" value="${esc(s.appCode)}" autocomplete="off">
      <label class="row small" style="min-height:44px"><input type="checkbox" id="sc" ${s.showScores?"checked":""}> 항목별 숫자(0~4) 보기 — 표본 30개 대조 검증 전이라 기본은 꺼져 있어요</label>
      <div class="actions"><button class="btn" id="asv">저장</button></div></div>

    <div class="sheet"><h3>잠금·데이터</h3>
      <p class="small muted">기록은 이 기기 브라우저에만 저장돼요. 기기를 바꾸거나 브라우저 데이터를 지우면 사라지니, 가끔 내보내기 해 두세요.</p>
      <label class="f" for="pn">잠금 번호 4자리 ${s.pinHash?"(설정됨 · 비우면 해제)":""}</label><input type="password" id="pn" inputmode="numeric" maxlength="4">
      <div class="actions"><button class="btn" id="psv">잠금 저장</button><button class="btn" id="ex">내보내기(JSON)</button><label class="btn" style="display:inline-flex;align-items:center;justify-content:center">가져오기<input type="file" accept="application/json" id="im" class="hide"></label></div>
      <div class="actions"><button class="btn danger" id="wipe">모든 기록 삭제</button></div></div>

    <div class="sheet"><h3>아프다 패밀리</h3><p class="small">${CFG.family.map(f=>`<a href="${esc(f.url)}">${esc(f.name)}</a>`).join(" · ")}</p>
      <p class="tiny">써보다 v${CFG.version} · ${esc(p.nick)} · 고${p.grade} · ${p.targetYear}학년도</p></div>`;
  fetch(CFG.api).then(r=>r.json()).then(j=>{ $("#srv").textContent = j.ai ? `연결됨 (${j.provider==="claude"?"Claude":"Google Gemini"})${j.code_required?" · 접속 코드 필요":""}` : "서버는 있지만 AI 키가 없어요. 운영자에게 알려 주세요."; })
    .catch(()=>{ $("#srv").textContent = window.SSUBODA_CORE ? "임시 모드: claude.ai 안에서 Claude가 피드백해요. write.apuda.app 배포 후 Google Gemini로 바뀌어요." : "서버에 연결하지 못했어요. 쓰기·저장은 그대로 돼요."; });
  $("#ss").onclick=()=>{ const days=[...app.querySelectorAll(".days input:checked")].map(i=>+i.value); if(days.length) p.days=days; s.examStart=$("#es").value; s.examEnd=$("#ee").value;
    if(s.examStart&&s.examEnd&&s.examEnd<s.examStart){ toast("끝 날짜가 시작보다 빨라요"); return; } save(); toast("학습 설정 저장됨"); };
  $("#gsv").onclick=()=>{ s.guardianShare=$("#gs").checked; s.guardianDrafts=$("#gd").checked && s.guardianShare; save(); toast("공유 설정 저장됨"); route(); };
  $("#asv").onclick=()=>{ s.appCode=$("#ac").value.trim(); s.showScores=$("#sc").checked; save(); toast("저장됨"); };
  $("#psv").onclick=async()=>{ const v=$("#pn").value.trim(); if(!v){ s.pinHash=""; save(); toast("잠금 해제됨"); return; } if(!/^\d{4}$/.test(v)){ toast("숫자 4자리예요"); return; } s.pinSalt=uid(); s.pinHash=await sha(s.pinSalt+v); save(); toast("잠금 설정됨"); };
  $("#ex").onclick=async()=>{ const name=`${today()}_써보다_백업.json`, data=JSON.stringify(S,null,1);
    try{ const dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null; if(dl){ await dl.save({filename:name, data}); return; } }catch(e){ if(e&&e.code) { toast("저장을 취소했어요"); return; } }
    const b=new Blob([data],{type:"application/json"}); const u=URL.createObjectURL(b); const x=document.createElement("a"); x.href=u; x.download=`${today()}_써보다_백업.json`; x.click(); setTimeout(()=>URL.revokeObjectURL(u),2000); };
  $("#im").onchange=async e=>{ const f=e.target.files[0]; if(!f) return; try{ const j=JSON.parse(await f.text()); if(!j.v||!j.attempts) throw 0; if(!(await ask("지금 기록을 가져온 파일로 바꿀까요?",{ok:"바꾸기",danger:true}))) return; S=Object.assign(blank(),j); rebuildSets(); save(); toast("가져왔어요"); route(); }catch(err){ toast("써보다 백업 파일이 아니에요"); } };
  $("#wipe").onclick=async()=>{ if(await ask("모든 답안·피드백·설정을 이 기기에서 지워요. 되돌릴 수 없어요.",{ok:"모두 삭제",danger:true,typed:"삭제"})){ try{localStorage.removeItem(KEY);}catch(e){} S=blank(); rebuildSets(); go("#/setup"); } };
}

/* ===== 잠금 ===== */
// 미래 나침반 가족 비밀번호(같은 주소, 같은 기기)가 있으면 그걸로 잠금. 저장값은 읽기만 한다.
function familyPin(){ try{ const v=JSON.parse(localStorage.getItem("fc-pin-v1")||"null"); return v&&v.salt&&v.hash?v:null; }catch(e){ return null; } }
function familyUnlocked(){ try{ return sessionStorage.getItem("fc-unlocked-v1")==="1"; }catch(e){ return false; } }
function lockIfNeeded(){
  const fam=familyPin();
  if(fam && !familyUnlocked()) return new Promise(res=>{
    const d=document.createElement("div"); d.className="lock";
    d.innerHTML=`<form class="sheet"><h1>써보다</h1><p class="muted small">미래 나침반 비밀번호 4자리를 입력하세요</p><input type="password" inputmode="numeric" maxlength="4" aria-label="가족 비밀번호" style="text-align:center;font-size:24px;letter-spacing:.4em"><div class="actions"><button class="btn primary">열기</button></div></form>`;
    document.body.appendChild(d); d.querySelector("input").focus();
    d.querySelector("form").onsubmit=async e=>{ e.preventDefault(); const v=d.querySelector("input").value;
      const h=await sha(fam.salt+":"+v+":future-compass");
      if(h===fam.hash){ try{ sessionStorage.setItem("fc-unlocked-v1","1"); }catch(e){} d.remove(); res(); } else { d.querySelector("input").value=""; toast("번호가 달라요"); } };
  });
  return new Promise(res=>{
    if(!S.settings.pinHash) return res();
    const d=document.createElement("div"); d.className="lock";
    d.innerHTML=`<form class="sheet"><h1>써보다</h1><p class="muted small">잠금 번호를 입력하세요</p><input type="password" inputmode="numeric" maxlength="4" autofocus aria-label="잠금 번호" style="text-align:center;font-size:24px;letter-spacing:.4em"><div class="actions"><button class="btn primary">열기</button></div><p class="tiny">번호를 잊었다면 브라우저 사이트 데이터를 지워야 해요(기록도 지워져요).</p></form>`;
    document.body.appendChild(d);
    d.querySelector("form").onsubmit=async e=>{ e.preventDefault(); const v=d.querySelector("input").value; if(await sha(S.settings.pinSalt+v)===S.settings.pinHash){ d.remove(); res(); } else { d.querySelector("input").value=""; toast("번호가 달라요"); } };
  });
}

/* ===== 시작 ===== */
renderFamily();
window.addEventListener("hashchange", ()=>{ if(location.hash.startsWith("#/") && location.hash!==CUR){ CUR=location.hash; route(); } });
window.addEventListener("beforeunload", ()=>{ if(cleanup) cleanup(); });
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="hidden") save(); });
lockIfNeeded().then(route);
if("serviceWorker" in navigator && location.protocol==="https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
