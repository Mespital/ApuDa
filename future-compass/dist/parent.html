<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>보호자 관리 · 승준이의 아지트</title><link rel="stylesheet" href="/auth.css"><script src="/auth.js" defer></script></head><body class="auth-page"><main class="auth-card parent-card"><a href="/">← 아지트로</a><span class="eyebrow">보호자만 관리해요</span><h1>승준이의 열쇠 🔑</h1><p>번호를 잊어도 괜찮아요.<br>공부 기록을 그대로 두고 새로 정할 수 있어요.</p><section><h2>새 PIN 정하기</h2><form id="reset-form"><label for="pin">새 번호 4자리</label><input id="pin" type="password" inputmode="numeric" pattern="[0-9]{4}" minlength="4" maxlength="4" autocomplete="new-password" required><label for="pin-again">새 번호 다시 입력</label><input id="pin-again" type="password" inputmode="numeric" pattern="[0-9]{4}" minlength="4" maxlength="4" autocomplete="new-password" required><p class="hint">번호를 바꾸면 승준이의 모든 기기에서 다시 로그인해야 해요.</p><button class="primary">새 번호로 변경</button></form></section><section><h2>기기 관리</h2><p class="hint">분실한 기기가 있거나 잠시 잠금이 필요할 때 사용하세요.</p><button id="lock-all">승준이의 모든 기기 잠그기</button></section><details><summary>보호자 비밀번호 변경</summary><form id="admin-password-form"><label for="current">현재 비밀번호</label><input id="current" type="password" autocomplete="current-password" maxlength="128" required><label for="new-password">새 비밀번호 (12자 이상)</label><input id="new-password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required><label for="new-again">새 비밀번호 다시 입력</label><input id="new-again" type="password" autocomplete="new-password" minlength="12" maxlength="128" required><button>보호자 비밀번호 변경</button></form></details><p id="message" role="status" aria-live="polite"></p><p class="hint">보호자 로그인은 최대 15분 유지됩니다.</p><button id="logout">보호자 로그아웃</button></main></body></html>
