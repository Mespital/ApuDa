name: Import ApuDa Public Site

on:
  push:
    branches:
      - feature/apuda-public-site-login
    paths:
      - ".github/workflows/import-apuda-public-site.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apuda-public-site-import
  cancel-in-progress: false

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/apuda-public-site-login
          fetch-depth: 0

      - name: Download current production site
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="https://apuda-total.netlify.app"
          rm -rf public-site
          mkdir -p public-site/assets/image public-site/assets/video

          files=(
            "building_check.png"
            "testcrop_720.png"
            "og.jpg"
            "testcrop_520.png"
            "apple-touch-icon.png"
            "testcrop_680.png"
            "favicon-32.png"
            "index.html"
            "readme_deploy.txt"
            "mobile_comp_test.png"
            "testcrop_560.png"
            "netlify.toml"
            "robots.txt"
            "testcrop_640.png"
            "testcrop_600.png"
            "assets/image/building-mobile-home-v2.png"
            "assets/image/building-master.png"
            "assets/video/floor-3.mp4"
            "assets/video/floor-2.mp4"
            "assets/video/floor-5.mp4"
            "assets/video/floor-1.mp4"
            "assets/video/floor-4.mp4"
          )

          for path in "${files[@]}"; do
            mkdir -p "public-site/$(dirname "$path")"
            echo "Downloading $path"
            curl -fLsS --retry 3 "$SOURCE/$path" -o "public-site/$path"
          done

          cat > public-site/netlify.toml <<'EOF'
          [[headers]]
            for = "/*"
            [headers.values]
              X-Frame-Options = "SAMEORIGIN"
              X-Content-Type-Options = "nosniff"

          [[headers]]
            for = "/assets/video/*"
            [headers.values]
              Cache-Control = "public, max-age=31536000, immutable"

          [[headers]]
            for = "/assets/image/*"
            [headers.values]
              Cache-Control = "public, max-age=31536000, immutable"

          [[redirects]]
            from = "/farm/*"
            to = "https://apuda-farm.netlify.app/:splat"
            status = 200
            force = true

          [[redirects]]
            from = "/pet/*"
            to = "https://apuda-pet.netlify.app/:splat"
            status = 200
            force = true

          [[redirects]]
            from = "/care/*"
            to = "https://apudacare.netlify.app/:splat"
            status = 200
            force = true
          EOF

      - name: Add ApuDa ID login and My ApuDa entry
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("public-site/index.html")
          html = path.read_text(encoding="utf-8")

          if "account-dock" not in html:
              focus = '  :focus-visible{outline:3px solid rgba(36,107,254,.4);outline-offset:3px;border-radius:10px}\n'
              css = r'''
            /* ApuDa ID / My ApuDa */
            .account-dock{position:fixed;z-index:65;top:max(14px,env(safe-area-inset-top));right:max(16px,2vw);
              display:flex;align-items:center;gap:8px;padding:6px;border:1px solid rgba(190,207,228,.9);
              border-radius:999px;background:rgba(255,255,255,.84);box-shadow:0 10px 28px rgba(16,42,67,.1);
              backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
            .account-link{display:inline-flex;align-items:center;justify-content:center;min-height:36px;padding:0 14px;
              border-radius:999px;font-size:12px;font-weight:900;letter-spacing:-.02em;white-space:nowrap;
              transition:transform .2s var(--ease),background .2s,color .2s,box-shadow .2s}
            .account-link:hover{transform:translateY(-1px)}
            .account-login{color:var(--blue-700);background:transparent}
            .account-login:hover{background:var(--sky)}
            .account-my{color:#fff;background:var(--blue);box-shadow:0 5px 14px rgba(36,107,254,.23)}
            .account-my:hover{background:var(--blue-700)}
            body.open .account-dock{opacity:.42}
            body.open .account-dock:hover,body.open .account-dock:focus-within{opacity:1}
          '''
              if focus not in html:
                  raise SystemExit("Could not find focus-visible CSS insertion point")
              html = html.replace(focus, focus + css, 1)

              media = '  @media (max-width:860px){\n'
              mobile = r'''
              .account-dock{top:max(10px,env(safe-area-inset-top));right:10px;gap:5px;padding:4px}
              .account-link{min-height:32px;padding:0 11px;font-size:11px}
          '''
              if media not in html:
                  raise SystemExit("Could not find mobile media insertion point")
              html = html.replace(media, media + mobile, 1)

              marker = '<div class="connector-line" id="connectorLine" aria-hidden="true">\n'
              nav = '''<nav class="account-dock" aria-label="ApuDa 계정">
            <a class="account-link account-login" href="https://my.apuda.app/login">로그인</a>
            <a class="account-link account-my" href="https://my.apuda.app/my">My ApuDa</a>
          </nav>

          '''
              if marker not in html:
                  raise SystemExit("Could not find body insertion point")
              html = html.replace(marker, nav + marker, 1)

          old = '<p class="foot">모두 무료이며 로그인이 없습니다. 각 라인은 정보 제공을 목적으로 하며 진료를 대신하지 않습니다.</p>'
          new = '<p class="foot">ApuDa.Family 도구는 모두 무료이며 로그인 없이 사용할 수 있습니다. My ApuDa 개인 건강기록은 ApuDa ID 로그인이 필요합니다. 각 라인은 정보 제공을 목적으로 하며 진료를 대신하지 않습니다.</p>'
          if old in html:
              html = html.replace(old, new, 1)

          if 'href="https://my.apuda.app/login"' not in html:
              raise SystemExit("Login link patch failed")
          if 'href="https://my.apuda.app/my"' not in html:
              raise SystemExit("My ApuDa link patch failed")

          path.write_text(html, encoding="utf-8")

          Path("public-site/README.md").write_text(
              """# ApuDa Public Site

          Production target: https://apuda.app

          This directory is the GitHub-managed source for the public ApuDa landing experience.

          Account entry points:
          - Login: https://my.apuda.app/login
          - My ApuDa: https://my.apuda.app/my

          My ApuDa application source remains under /platform.
          AI input service remains under /services/ai.
          """,
              encoding="utf-8",
          )
          PY

      - name: Validate import
        shell: bash
        run: |
          set -euo pipefail
          test -s public-site/index.html
          test -s public-site/assets/image/building-master.png
          test -s public-site/assets/video/floor-1.mp4
          grep -q 'https://my.apuda.app/login' public-site/index.html
          grep -q 'https://my.apuda.app/my' public-site/index.html
          echo "ApuDa public site import validated."

      - name: Commit imported production source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ApuDa Deploy Bot"
          git config user.email "actions@users.noreply.github.com"
          git add public-site

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "feat(public-site): import live apuda.app and add My ApuDa login [skip ci]"
          git push origin HEAD:feature/apuda-public-site-login
