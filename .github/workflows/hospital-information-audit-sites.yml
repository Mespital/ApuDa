name: Hospital Information multi-site source audit
on:
  push:
    branches: [main]
    paths:
      - 'public-site/hospital-information/scripts/audit_sites.py'
      - '.github/workflows/hospital-information-audit-sites.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests beautifulsoup4
      - run: python public-site/hospital-information/scripts/audit_sites.py
