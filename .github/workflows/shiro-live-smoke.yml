name: Shiro production smoke check
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/shiro-live-smoke.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check live study UI and AI endpoint
        run: node future-compass/scripts/shiro-live-smoke.mjs
