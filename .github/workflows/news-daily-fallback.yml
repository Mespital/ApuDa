name: ApuDa News Daily Fallback

# Independent of the VPS cron and its long-lived GitHub token.
# 00:18 UTC is 09:18 KST (Asia/Seoul, no DST).
on:
  schedule:
    - cron: '18 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/news-daily-fallback.yml'

permissions:
  contents: write

concurrency:
  group: apuda-news-daily-fallback
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install -r automation/news-bot/requirements.txt

      - name: Collect original articles and verify publication times
        run: python automation/news-bot/news_bot.py --repo-root .

      - name: Verify report date, data contract and source health
        shell: bash
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timedelta
          from pathlib import Path
          from zoneinfo import ZoneInfo
          root = Path('public-site/news/data')
          now = datetime.now(ZoneInfo('Asia/Seoul'))
          end = now.replace(hour=9, minute=0, second=0, microsecond=0)
          if now < end:
              end -= timedelta(days=1)
          expected = end.date().isoformat()
          latest = json.loads((root/'latest.json').read_text(encoding='utf-8'))
          report = json.loads((root/f'{expected}.json').read_text(encoding='utf-8'))
          run = json.loads((root/'last-run.json').read_text(encoding='utf-8'))
          if latest.get('latest') != expected or report.get('report_date') != expected:
              raise SystemExit(f'Expected {expected}, got {latest.get("latest")}')
          if latest.get('path') != f'/news/data/{expected}.json':
              raise SystemExit('latest.json target mismatch')
          sources = run.get('sources') or {}
          expected_sources = {'데일리팜','의학신문','메디파나뉴스','약사공론'}
          if set(sources) != expected_sources:
              raise SystemExit('Missing source statistics')
          verified = sum(int((x or {}).get('in_window_verified') or 0) for x in sources.values())
          if verified == 0 and end.weekday() < 5:
              raise SystemExit('No source provided a verified article on a weekday; refusing an empty fresh-looking report')
          for item in report.get('top_news', []):
              if not item.get('published_at') or not item.get('source_urls'):
                  raise SystemExit('Top article missing date or source URL')
          print(f'Report {expected}: {verified} source-verified articles; {len(report.get("top_news",[]))} top stories')
          with open(__import__('os').environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as f:
              f.write(f'### ApuDa news refresh: {expected}\n\nVerified source articles: **{verified}**; top stories: **{len(report.get("top_news",[]))}**.\n')
          PY

      - name: Publish only newer validated news data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ApuDa News Fallback"
          git config user.email "news-fallback@apuda.app"
          REPORT_DATE="$(python -c 'import json; print(json.load(open("public-site/news/data/latest.json"))["latest"])')"
          SNAPSHOT_DIR="$(mktemp -d)"
          trap 'rm -rf "$SNAPSHOT_DIR"' EXIT
          FILES=(
            "$REPORT_DATE.json"
            latest.json
            last-run.json
            archive-index.json
            oncology-30d.json
            period-highlights.json
          )
          for name in "${FILES[@]}"; do
            cp "public-site/news/data/$name" "$SNAPSHOT_DIR/$name"
          done
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            CURRENT_DATE="$(python -c 'import json,pathlib; p=pathlib.Path("public-site/news/data/latest.json"); print(json.loads(p.read_text()).get("latest","") if p.exists() else "")')"
            if [[ "$CURRENT_DATE" == "$REPORT_DATE" || "$CURRENT_DATE" > "$REPORT_DATE" ]]; then
              echo "Origin news is already at $CURRENT_DATE; keeping its published data."
              exit 0
            fi
            for name in "${FILES[@]}"; do
              cp "$SNAPSHOT_DIR/$name" "public-site/news/data/$name"
              git add -- "public-site/news/data/$name"
            done
            if git diff --cached --quiet; then
              echo "No changes to publish."
              exit 0
            fi
            git commit -m "news: fallback daily briefing $REPORT_DATE"
            if git push origin HEAD:main; then
              echo "Published verified daily news $REPORT_DATE."
              exit 0
            fi
            echo "Main changed during publish (attempt $attempt); retrying..."
            sleep "$((attempt * 3))"
          done
          echo "Unable to publish after three attempts."
          exit 1
