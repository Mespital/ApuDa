name: Hospital Information production verification
on:
  push:
    branches: [main]
    paths:
      - "public-site/hospital-information/**"
      - "public-site/netlify/functions/hospital-information-matcher.js"
      - ".github/workflows/hospital-information-deployment.yml"
  workflow_dispatch:
  schedule:
    - cron: "15 23 * * *" # daily 08:15 Asia/Seoul verification
permissions:
  contents: read
concurrency:
  group: hospital-information-production-check
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Wait for existing Netlify Git deployment
        run: |
          set -euo pipefail
          target="https://apuda.app/hospital-information/"
          marker=$(grep -o 'apuda-hi-[0-9a-z-]*' public-site/hospital-information/index.html | head -1)
          echo "Expected release marker: $marker"
          success=0
          for attempt in $(seq 1 24); do
            code=$(curl -L -sS -o /tmp/apuda-hospital.html -w '%{http_code}' --connect-timeout 10 --max-time 20 "$target" || true)
            if [ "$code" = "200" ] && grep -Fq "$marker" /tmp/apuda-hospital.html; then
              echo "SITE_RELEASE_LIVE=yes HTTP=$code attempt=$attempt"
              success=1
              break
            fi
            echo "Waiting for Netlify Git auto-deploy ($attempt/24), HTTP=$code"
            sleep 10
          done
          if [ "$success" != 1 ]; then
            echo "::error::Live apuda.app does not contain the committed release marker. Check existing Netlify Git repository/main publish configuration."
            exit 1
          fi
          echo "Verified URL: $target" >> "$GITHUB_STEP_SUMMARY"
          echo "Verified release marker: $marker" >> "$GITHUB_STEP_SUMMARY"
      - name: Validate deployed JS and data files
        run: |
          set -euo pipefail
          base="https://apuda.app/hospital-information"
          curl -fsSL --max-time 25 "$base/app.js" -o /tmp/apuda-hi-live-app.js
          if ! cmp -s public-site/hospital-information/app.js /tmp/apuda-hi-live-app.js; then
            echo "::error::Production JS does not match the committed GitHub version."
            exit 1
          fi
          curl -fsSL --max-time 25 "$base/data/hospitals.json" -o /tmp/apuda-hi-hospitals.json
          curl -fsSL --max-time 25 "$base/data/cancers.json" -o /tmp/apuda-hi-cancers.json
          python3 - <<'PY'
          import json
          with open('/tmp/apuda-hi-hospitals.json') as f: hospitals=json.load(f)
          with open('/tmp/apuda-hi-cancers.json') as f: cancers=json.load(f)
          assert len(hospitals)==30, f"Unexpected hospital count {len(hospitals)}"
          assert len(cancers)==30, f"Unexpected cancer count {len(cancers)}"
          print(f"PRODUCTION_DATA_OK hospitals={len(hospitals)} cancers={len(cancers)}")
          PY
          echo "Production app.js matches GitHub and both data files are valid." >> "$GITHUB_STEP_SUMMARY"
      - name: Verify production specialist snapshot
        run: |
          set -euo pipefail
          url="https://apuda.app/hospital-information/data/verified-specialists.json"
          curl -fsSL --max-time 25 "$url" -o /tmp/production-specialists.json
          python3 - <<'PY'
          import json
          with open("/tmp/production-specialists.json", encoding="utf-8") as f: d=json.load(f)
          assert isinstance(d.get("results"),list) and d.get("count")==len(d["results"]), "Snapshot contract mismatch"
          assert all(p.get("status")=="ACTIVE" for p in d["results"]), "Non-public specialist data leaked"
          from datetime import datetime, timezone, timedelta
          stamp=d.get("generated_at")
          if not stamp:
              raise AssertionError("Last successful sync timestamp is missing")
          at=datetime.fromisoformat(stamp.replace("Z","+00:00"))
          if at.tzinfo is None: at=at.replace(tzinfo=timezone.utc)
          age=datetime.now(timezone.utc)-at
          assert -timedelta(hours=1) < age < timedelta(hours=48), "Last medical data sync is stale: "+str(age)
          print("PRODUCTION_MEDICAL_SNAPSHOT_OK count="+str(d["count"]))
          PY
      - name: Inspect Netlify medical directory API function
        run: |
          set -euo pipefail
          function_url="https://apuda.app/.netlify/functions/hospital-information-matcher?cancer=LUNG"
          code=$(curl -L -sS -o /tmp/apuda-hi-function.json -w '%{http_code}' --connect-timeout 10 --max-time 25 "$function_url" || true)
          echo "NETLIFY_FUNCTION_HTTP=$code"
          if [ "$code" != "200" ]; then
            echo "::error::Netlify verified-directory function returned HTTP=$code (expected 200)"
            exit 1
          fi
          python3 - <<'PY'
          import json
          with open("/tmp/apuda-hi-function.json",encoding="utf-8") as f:d=json.load(f)
          assert d.get("count")==len(d.get("results",[])), "Medical API count mismatch"
          assert all(x.get("status")=="ACTIVE" and x.get("verified_at") for x in d.get("results",[])), "Medical API returned unreviewed profile"
          print("NETLIFY_MEDICAL_API_OK count="+str(d["count"]))
          PY
          echo "Medical API function HTTP status: $code" >> "$GITHUB_STEP_SUMMARY"
