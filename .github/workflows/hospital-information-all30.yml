name: Hospital Information all 30 hospitals audit
on:
  schedule:
    - cron: '0 23 * * *' # daily 08:00 KST
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'public-site/hospital-information/scripts/audit_all_30_hospitals.py'
      - '.github/workflows/hospital-information-all30.yml'
permissions:
  contents: write
concurrency:
  group: apuda-hospital-data-sync
  cancel-in-progress: false
jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests beautifulsoup4
      - name: Check 30 hospital official directory access and verified clinical data counts
        run: |
          set -euo pipefail
          python public-site/hospital-information/scripts/audit_all_30_hospitals.py
          python - <<'PY'
          import json
          from pathlib import Path
          f=Path('public-site/hospital-information/data/hospital-coverage.json')
          doc=json.loads(f.read_text(encoding='utf-8'))
          assert doc['registered_hospitals']==len(doc['hospitals'])==30
          assert len(set(h['slug'] for h in doc['hospitals']))==30
          assert doc['matched_doctors']==sum(h['matched_doctors'] for h in doc['hospitals'])
          assert doc['hospitals_with_matched_doctors']==sum(h['matched_doctors']>0 for h in doc['hospitals'])
          print('ALL30_AUDIT_OK active_sites=',doc['hospitals_with_matched_doctors'])
          PY
      - name: Commit auditable coverage map
        run: |
          set -euo pipefail
          git config user.name apuda-hospital-bot
          git config user.email apuda-hospital-bot@users.noreply.github.com
          git add public-site/hospital-information/data/hospital-coverage.json
          if ! git diff --cached --quiet; then
            git commit -m 'ops(hospital): audit 30 official physician directory statuses'
            git pull --rebase -X theirs origin main
            git push origin main
          fi
