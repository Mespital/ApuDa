name: Hospital Information Ajou official specialists
on:
  schedule:
    - cron: '40 21 * * *' # 06:40 Asia/Seoul
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'public-site/hospital-information/scripts/collect_ajou.py'
      - '.github/workflows/hospital-information-ajou.yml'
permissions:
  contents: write
concurrency:
  group: apuda-hospital-data-sync
  cancel-in-progress: false
jobs:
  official-directory:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests beautifulsoup4
      - name: Collect officially confirmed Ajou oncology specialists
        run: |
          set -euo pipefail
          python public-site/hospital-information/scripts/collect_ajou.py \
            --output public-site/hospital-information/data/ajou-verified.json
          python public-site/hospital-information/scripts/merge_verified.py
      - name: Validate physician identity, profile, and cancer mapping
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('public-site/hospital-information/data')
          doctors=json.loads((p/'ajou-verified.json').read_text(encoding='utf-8'))
          merged=json.loads((p/'verified-specialists.json').read_text(encoding='utf-8'))
          assert len(doctors.get('coverage',[]))>=12
          assert doctors['count']==len(doctors['results'])>=18
          for x in doctors['results']:
            assert x['status']=='ACTIVE' and x['cancers'] and x['doctor_name'] and x['specialty_text']
            assert x['profile_url'].startswith('https://hosp.ajoumc.or.kr/doctor/profViewPop.do?deptNo=')
            assert x['source_url'].startswith('https://hosp.ajoumc.or.kr/doctor/prof')
          assert merged['count']>=doctors['count']
          print('AJOU_VERIFIED',doctors['count'],'MERGED',merged['count'])
          PY
      - name: Publish verified specialists through existing GitHub Netlify
        run: |
          set -euo pipefail
          git config user.name apuda-hospital-bot
          git config user.email apuda-hospital-bot@users.noreply.github.com
          git add public-site/hospital-information/data/ajou-verified.json \
                  public-site/hospital-information/data/verified-specialists.json
          if ! git diff --cached --quiet; then
            git commit -m 'data(hospital): publish Ajou oncology directory'
            git pull --rebase -X theirs origin main
            git push origin main
          fi
