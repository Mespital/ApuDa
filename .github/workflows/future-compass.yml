name: Future Compass daily news and deploy
on:
  push:
    branches: [main]
    paths: ['future-compass/**', '.github/workflows/future-compass.yml']
  schedule:
    - cron: '0 */2 * * *' # Every 2 hours; schedules can be delayed
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: future-compass-production
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect official AI and learning headlines
        env:
          NEIS_API_KEY: ${{ secrets.NEIS_API_KEY }}
        run: python future-compass/scripts/update_news.py
      - name: Collect Seocho HS schedule, meals and timetable (grade auto by date)
        env:
          NEIS_API_KEY: ${{ secrets.NEIS_API_KEY }}
        run: python future-compass/scripts/update_school.py
      - name: Check site
        run: |
          node future-compass/scripts/check.mjs
          node future-compass/scripts/check-know-me.cjs
          node future-compass/scripts/check-shiro.cjs
          node future-compass/scripts/check-study-plus.cjs
          node future-compass/scripts/check-study-device.cjs
          python future-compass/auth/test_auth.py
          docker run --rm -v "$PWD/future-compass/ops/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.10.2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Save daily feed
        run: |
          git config user.name 'future-compass-bot'
          git config user.email 'future-compass-bot@users.noreply.github.com'
          git add future-compass/dist/news.json future-compass/dist/school.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore(compass): refresh official AI news and school data'
            git pull --rebase -X theirs origin main
            git push
          fi
      - name: Deploy Netlify when connected
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.FUTURE_NETLIFY_SITE_ID }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo 'Netlify Git integration handles code deploys; the app reads the latest daily feed from GitHub. Optional CLI deployment needs NETLIFY_AUTH_TOKEN and FUTURE_NETLIFY_SITE_ID.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          cd future-compass
          npx --yes netlify-cli@23 deploy --prod --dir=dist
  vps:
    needs: update
    runs-on: ubuntu-latest
    environment: apuda-ai-vps
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # Include the news commit created by the update job.
      - name: Deploy dedicated Future Compass service
        env:
          VPS_HOST: ${{ secrets.FUTURE_VPS_HOST || secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.FUTURE_VPS_USER || secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.FUTURE_VPS_SSH_KEY || secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.FUTURE_VPS_KNOWN_HOSTS }}
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ] || [ -z "$VPS_SSH_KEY" ]; then
            echo 'VPS connection unavailable: environment apuda-ai-vps needs VPS_HOST, VPS_USER, VPS_SSH_KEY.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          bash future-compass/ops/deploy-vps.sh
