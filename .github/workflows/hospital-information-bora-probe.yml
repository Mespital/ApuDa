name: Hospital Information Boramae structure probe
on:
  push:
    branches: [main]
    paths:
      - 'public-site/hospital-information/scripts/probe_brmh.py'
      - '.github/workflows/hospital-information-bora-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests beautifulsoup4
      - run: python public-site/hospital-information/scripts/probe_brmh.py
