name: DT probe (temporary)
on:
  push:
    branches: [tmp/probe-dt]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash future-compass/.probe-dt/check.sh || true
      - run: |
          git config user.name "probe-bot"; git config user.email "probe@users.noreply.github.com"
          git add -f future-compass/.probe-dt/out.txt && git commit -m "tmp: dt probe output" && git push
