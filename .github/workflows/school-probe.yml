name: School sources probe (temporary)
on:
  push:
    branches: [feat/school-live]
    paths: ['future-compass/scripts/probe-sources.mjs', '.github/workflows/school-probe.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i --no-save iconv-lite@0.6.3
      - run: SKIP_SI=1 node future-compass/scripts/probe-sources.mjs future-compass/.probe
      - run: |
          git config user.name "probe-bot"; git config user.email "probe@users.noreply.github.com"
          git rm -rq --cached future-compass/.probe/si-file-3.zip || true; git add -f future-compass/.probe && git commit -m "tmp: probe output 2" && git push
