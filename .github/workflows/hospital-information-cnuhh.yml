name: Hospital Information Hwasun official specialists
on:
  schedule:
    - cron: '0 22 * * *' # daily 07:00 KST
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'public-site/hospital-information/scripts/collect_cnuhh.py'
      - '.github/workflows/hospital-information-cnuhh.yml'
permissions:
  contents: write
concurrency:
  group: apuda-hospital-data-sync
  cancel-in-progress: false
jobs:
  official-directory:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests beautifulsoup4
      - name: Hwasun CNUH official staff profiles with clinical specialty
        run: |
          set -euo pipefail
          python public-site/hospital-information/scripts/collect_cnuhh.py \
            --output public-site/hospital-information/data/cnuhh-verified.json
          python public-site/hospital-information/scripts/merge_verified.py
      - name: Validate clinical source and doctor evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('public-site/hospital-information/data')
          doc=json.loads((p/'cnuhh-verified.json').read_text(encoding='utf-8'))
          merged=json.loads((p/'verified-specialists.json').read_text(encoding='utf-8'))
          assert len(doc.get('coverage',[]))>=5
          assert doc['count']==len(doc['results'])>=8
          for x in doc['results']:
            assert x['status']=='ACTIVE' and x['doctor_name'] and x['cancers'] and x['specialty_text']
            assert x['source_url'].startswith('https://www.cnuhh.com/medical/info/dept.cs?mode=doctor&pageIndex=')
            assert x['profile_url'].startswith('https://www.cnuhh.com/medical/info/dept.cs?')
          assert merged['count']>=doc['count']
          print('HWASUN_OFFICIAL',doc['count'],'MERGED',merged['count'])
          PY
      - name: Publish verified Hwasun directory in GitHub and Netlify
        run: |
          set -euo pipefail
          git config user.name apuda-hospital-bot
          git config user.email apuda-hospital-bot@users.noreply.github.com
          git add public-site/hospital-information/data/cnuhh-verified.json \
                  public-site/hospital-information/data/verified-specialists.json
          if ! git diff --cached --quiet; then
            git commit -m 'data(hospital): update Hwasun official oncology clinicians'
            git pull --rebase -X theirs origin main
            git push origin main
          fi
