name: Hospital Information Boramae official specialists
on:
  schedule:
    - cron: '50 21 * * *' # every morning 06:50 Asia/Seoul
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'public-site/hospital-information/scripts/collect_brmh.py'
      - '.github/workflows/hospital-information-brmh.yml'
permissions:
  contents: write
concurrency:
  group: apuda-hospital-data-sync
  cancel-in-progress: false
jobs:
  official-directory:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests beautifulsoup4
      - name: Verify official Boramae doctors and clinical specialty
        run: |
          set -euo pipefail
          python public-site/hospital-information/scripts/collect_brmh.py \
            --output public-site/hospital-information/data/brmh-verified.json
          python public-site/hospital-information/scripts/merge_verified.py
      - name: Validate public doctor evidence and source coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          base=Path("public-site/hospital-information/data")
          doc=json.loads((base/"brmh-verified.json").read_text(encoding="utf-8"))
          merged=json.loads((base/"verified-specialists.json").read_text(encoding="utf-8"))
          assert len(doc.get("coverage", [])) == 4, "Official departments missing"
          assert doc["count"] == len(doc["results"]) >= 8, "Suspiciously few doctor profiles"
          for d in doc["results"]:
            assert d["status"] == "ACTIVE" and d["cancers"] and d["specialty_text"]
            assert d["source_url"].startswith("https://www.brmh.org/medical/medi_doctor_info.do?mcode=")
            assert d["profile_url"].startswith("https://www.brmh.org/custom/popup/layer_doctor_view.do?dt_no=")
          assert merged["count"] >= doc["count"]
          print("BORAMAE_VERIFIED", doc["count"], "TOTAL", merged["count"])
          PY
      - name: Publish reviewed directory to GitHub and existing Netlify
        run: |
          set -euo pipefail
          git config user.name apuda-hospital-bot
          git config user.email apuda-hospital-bot@users.noreply.github.com
          git add public-site/hospital-information/data/brmh-verified.json \
                  public-site/hospital-information/data/verified-specialists.json
          if git diff --cached --quiet; then
            echo "No reviewed specialists changed"
          else
            git commit -m "data(hospital): sync Boramae official oncology specialties"
            git pull --rebase -X theirs origin main
            git push origin main
          fi
