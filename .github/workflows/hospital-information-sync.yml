name: Hospital Information verified specialists sync
on:
  schedule:
    - cron: '50 22 * * *' # 07:50 Asia/Seoul the following day
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'public-site/hospital-information/scripts/export_verified.py'
      - '.github/workflows/hospital-information-sync.yml'
permissions:
  contents: write
concurrency:
  group: apuda-hospital-data-sync
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    environment: apuda-ai-vps
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify existing VPS connection secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST" && test -n "$VPS_USER" && test -n "$VPS_SSH_KEY"
          [[ "$VPS_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$VPS_USER" =~ ^[a-zA-Z0-9_-]+$ ]]
      - name: Connect and export ACTIVE specialists (read-only)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          printf '%s\n' "$VPS_SSH_KEY" > "$tmp/key"
          chmod 600 "$tmp/key"
          if [ -n "$VPS_KNOWN_HOSTS" ]; then
            printf '%s\n' "$VPS_KNOWN_HOSTS" > "$tmp/known_hosts"
          else
            ssh-keyscan -T 10 -H "$VPS_HOST" > "$tmp/known_hosts"
          fi
          opts=(-i "$tmp/key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$tmp/known_hosts")
          target="$VPS_USER@$VPS_HOST"
          scp "${opts[@]}" public-site/hospital-information/scripts/export_verified.py "$target:/tmp/apuda-export-verified.py"
          ssh "${opts[@]}" "$target" 'set -e; chmod 644 /tmp/apuda-export-verified.py; if sudo -n -u apuda test -r /var/lib/apuda-cancer-matcher/apuda_specialists.db 2>/dev/null; then sudo -n -u apuda python3 /tmp/apuda-export-verified.py; elif test -w /var/lib/apuda-cancer-matcher/apuda_specialists.db; then python3 /tmp/apuda-export-verified.py; else echo "No approved read access for SQLite export" >&2; exit 1; fi' > "$tmp/snapshot.json"
          python3 - "$tmp/snapshot.json" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1],encoding="utf-8"))
          assert p["schema_version"]==1
          assert p["count"]==len(p["results"])
          assert all(x["status"]=="ACTIVE" and x["cancers"] and x["verified_at"] for x in p["results"])
          print("Approved public medical specialists:",p["count"])
          PY
          cp "$tmp/snapshot.json" public-site/hospital-information/data/verified-specialists.json
      - name: Commit approved public snapshot (if changed)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("public-site/hospital-information/data/verified-specialists.json")
          v=json.loads(p.read_text(encoding="utf-8"))
          # Re-synchronize only when the clinical entries change, not just the clock.
          import subprocess
          previous=subprocess.run(["git","show","HEAD:"+str(p)],capture_output=True,text=True)
          if previous.returncode==0:
              old=json.loads(previous.stdout)
              if old.get("results")==v.get("results"):
                  p.write_text(json.dumps(old,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
                  print("No clinical record changes; snapshot kept unchanged")
          PY
          git config user.name apuda-hospital-bot
          git config user.email apuda-hospital-bot@users.noreply.github.com
          git add public-site/hospital-information/data/verified-specialists.json
          if ! git diff --cached --quiet; then
            git commit -m "data(hospital): publish reviewed specialist profiles"
            git pull --rebase -X theirs origin main
            git push origin main
          else
            echo "No approved specialist changes"
          fi
