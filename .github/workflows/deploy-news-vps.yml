name: Deploy ApuDa News Bot to VPS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/news-bot/**'
      - '.github/workflows/deploy-news-vps.yml'

concurrency:
  group: apuda-news-vps-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: apuda-ai-vps

    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Validate required secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          APUDA_NEWS_GITHUB_TOKEN: ${{ secrets.APUDA_NEWS_GITHUB_TOKEN }}
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$VPS_SSH_KEY"
          test -n "$APUDA_NEWS_GITHUB_TOKEN"

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          for i in 1 2 3; do
            if ssh-keyscan -T 10 -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null; then
              break
            fi
            if [ "$i" = "3" ]; then
              echo "ssh-keyscan failed after 3 attempts"
              exit 1
            fi
            sleep 5
          done
          cat > ~/.ssh/config <<EOF
          Host apuda-vps
            HostName $VPS_HOST
            User $VPS_USER
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
          EOF
          chmod 600 ~/.ssh/config

      - name: Sync news bot
        run: |
          set -euo pipefail
          ssh apuda-vps 'mkdir -p /tmp/apuda-news-deploy'
          rsync -az --delete -e ssh automation/news-bot/ apuda-vps:/tmp/apuda-news-deploy/

      - name: Write protected environment
        env:
          APUDA_NEWS_GITHUB_TOKEN: ${{ secrets.APUDA_NEWS_GITHUB_TOKEN }}
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
        run: |
          set -euo pipefail
          printf 'APUDA_GITHUB_TOKEN=%s\nAPUDA_GITHUB_REPO=Mespital/ApuDa\nAPUDA_NEWS_BRANCH=main\nAPUDA_REPO_DIR=$HOME/apuda-repo\nDATA_GO_KR_SERVICE_KEY=%s\n' "$APUDA_NEWS_GITHUB_TOKEN" "$DATA_GO_KR_SERVICE_KEY" > /tmp/news.env
          chmod 600 /tmp/news.env
          ssh apuda-vps 'mkdir -p ~/.config/apuda && chmod 700 ~/.config/apuda'
          scp /tmp/news.env apuda-vps:~/.config/apuda/news.env
          ssh apuda-vps 'chmod 600 ~/.config/apuda/news.env'

      - name: Install user cron
        run: |
          set -euo pipefail
          ssh apuda-vps 'cd /tmp/apuda-news-deploy && chmod +x install-vps.sh publish.sh news_bot.py && ./install-vps.sh'

      - name: Validate collector syntax and environment
        run: |
          set -euo pipefail
          ssh apuda-vps 'set -a; . ~/.config/apuda/news.env; set +a; test -n "$APUDA_GITHUB_TOKEN"; test -n "$APUDA_REPO_DIR"; ~/apuda-news/.venv/bin/python -m py_compile ~/apuda-news/news_bot.py ~/apuda-news/official_data.py ~/apuda-news/official_notices.py ~/apuda-news/hira_updates.py ~/apuda-news/nccn_monitor.py ~/apuda-news/smoke_test.py'

      - name: Publish refreshed data
        run: |
          set -euo pipefail
          ssh apuda-vps 'APUDA_NEWS_ENV_FILE=$HOME/.config/apuda/news.env $HOME/apuda-news/publish.sh'

      - name: Validate published news data contract
        run: |
          set -euo pipefail
          ssh apuda-vps 'cd ~/apuda-repo && ~/apuda-news/.venv/bin/python ~/apuda-news/smoke_test.py'

      - name: Report data source health
        run: |
          set -euo pipefail
          ssh apuda-vps 'python3 - <<'"'"'PY'"'"'
          import json
          from pathlib import Path
          root=Path.home()/"apuda-repo"/"public-site"/"news"/"data"
          def load(name):
              try:return json.loads((root/name).read_text(encoding="utf-8"))
              except Exception:return {}
          off=load("official-data.json")
          hira=load("hira-updates.json")
          nccn=load("nccn-monitor.json")
          mfds=next((x for x in off.get("sources",[]) if x.get("id")=="mfds_drug_approval"),{})
          if mfds.get("status")=="ok":
              print("::notice title=MFDS API::의약품 허가정보 API 연결 정상")
          else:
              print("::warning title=MFDS API::허가정보 API 확인 필요 - "+str(mfds.get("error_name") or mfds.get("error_message") or mfds.get("status") or "unknown"))
          if hira.get("status")=="ok":
              print("::notice title=HIRA::보험인정기준 수집 "+str(len(hira.get("items",[])))+"건")
          else:
              print("::warning title=HIRA::보험인정기준 수집 상태 "+str(hira.get("status") or "unknown"))
          items=nccn.get("items",[])
          ok=sum(1 for x in items if x.get("status")=="ok")
          level="notice" if ok==12 else "warning"
          print(f"::{level} title=NCCN::12개 암종 중 {ok}개 공개 버전 확인")
          PY'

      - name: Show cron
        run: |
          ssh apuda-vps 'crontab -l'
