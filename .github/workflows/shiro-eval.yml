name: 흰둥이 공부 답변 점검 (수동)
# 수동 실행만. 가상의 공부 질문 16개로 흰둥이 답을 받아 자동 검사한다(질문은 지어낸 예시, 개인 정보 없음).
on:
  workflow_dispatch:
    inputs:
      models:
        description: '비교할 모델 (haiku = Netlify 기본, sonnet = 실시간 서버 공부 모델)'
        default: 'haiku,sonnet'
permissions:
  contents: write
jobs:
  eval:
    runs-on: ubuntu-latest
    environment: apuda-ai-vps
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ask 흰둥이
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODELS: ${{ inputs.models }}
          EVAL_OUT: shiro-eval.md
        run: node future-compass/scripts/eval-shiro.mjs
      - name: 지금 흰둥이 AI 상태 (실시간 서버 /health — 키 값은 안 나옴)
        env:
          H: ${{ vars.FUTURE_LIVE_HOST || 'live.apuda.app' }}
          HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          HAS_OPENAI: ${{ secrets.OPENAI_API_KEY != '' }}
          OLLAMA: ${{ vars.FC_OLLAMA_MODEL || secrets.FC_OLLAMA_MODEL }}
        run: |
          { echo; echo "## 지금 흰둥이 AI 상태"; echo "- 실시간 서버: $(curl -s -m 8 https://$H/health || echo 연결 안 됨)"; echo "- GitHub 비밀값: Claude 키 $HAS_KEY · OpenAI 키 $HAS_OPENAI · 무료 모델 ${OLLAMA:-없음}"; } >> shiro-eval.md
      - name: Save result to branch eval-results (main에는 안 남김)
        run: |
          mkdir -p /tmp/ev && cp shiro-eval.md /tmp/ev/
          cd /tmp/ev && git init -q -b eval-results && git config user.name 'future-compass-bot' && git config user.email 'future-compass-bot@users.noreply.github.com'
          git add shiro-eval.md && git commit -qm "흰둥이 답변 점검 $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" eval-results
