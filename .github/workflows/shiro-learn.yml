name: 흰둥이 hourly study (개념 사전 자동 학습)
# 매시간: 진도·교과 단원·진로 직업·연결 문서를 위키백과에서 몇 개씩 읽어 dist/shiro-learn.json 에 쌓고
# shiro-kb.json(흰둥이 지식 묶음)을 다시 만든다. 학교 자료 수집·배포는 future-compass.yml(2시간)이 그대로 맡는다.
# 커밋에 [skip netlify]를 달아 매시간 사이트 빌드는 하지 않는다. 흰둥이 서버는 GitHub 최신본을 30분마다 읽는다.
on:
  schedule:
    - cron: '23 * * * *' # 매시간 23분 (GitHub 사정으로 늦어질 수 있음)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: shiro-learn
  cancel-in-progress: false
jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Study (위키백과 개념 읽기)
        continue-on-error: true
        run: node future-compass/scripts/build_learn.mjs
      - name: Rebuild 흰둥이 knowledge
        run: node future-compass/scripts/build_kb.mjs
      - name: Save
        run: |
          git config user.name 'future-compass-bot'
          git config user.email 'future-compass-bot@users.noreply.github.com'
          git add future-compass/dist/shiro-learn.json future-compass/dist/shiro-kb.json
          if git diff --cached --quiet; then echo 'nothing new' >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          git commit -m 'chore(compass): 흰둥이 hourly study [skip netlify]'
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && break
            sleep 10
          done
          node -e "const k=require('./future-compass/dist/shiro-kb.json');console.log('개념 '+k.learn.total+'개 · 최근 24시간 +'+k.learn.today)" >> "$GITHUB_STEP_SUMMARY"
