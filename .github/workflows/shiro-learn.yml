name: 흰둥이 daily update (매일 아침 지식 갱신)
# 매일 아침 한 번(05:47 KST): 학교 자료·급식·일정을 흰둥이 지식 묶음(shiro-kb.json)에 반영하고,
# 진도·교과 단원·직업 개념을 위키백과에서 30개씩 읽어 개념 사전에 더한다.
# 학교 자료 수집 자체는 future-compass.yml(2시간)이 그대로 하지만, 흰둥이에게는 아침 기준 자료만 들어간다.
on:
  schedule:
    - cron: '47 20 * * *' # 매일 05:47 KST (UTC 20:47, GitHub 사정으로 늦어질 수 있음)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: shiro-learn
  cancel-in-progress: false
jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Study (위키백과 개념 읽기)
        continue-on-error: true
        env:
          LEARN_PER_RUN: '30'
        run: node future-compass/scripts/build_learn.mjs
      - name: Rebuild 흰둥이 knowledge
        run: node future-compass/scripts/build_kb.mjs
      - name: Save
        run: |
          git config user.name 'future-compass-bot'
          git config user.email 'future-compass-bot@users.noreply.github.com'
          git add future-compass/dist/shiro-learn.json future-compass/dist/shiro-kb.json
          if git diff --cached --quiet; then echo 'nothing new' >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          git commit -m 'chore(compass): 흰둥이 daily update [skip netlify]'
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && break
            sleep 10
          done
          node -e "const k=require('./future-compass/dist/shiro-kb.json');console.log('개념 '+k.learn.total+'개 · 최근 24시간 +'+k.learn.today)" >> "$GITHUB_STEP_SUMMARY"
