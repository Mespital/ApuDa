name: ApuDa AI Service CI

on:
  pull_request:
    paths:
      - "services/ai/**"
      - ".github/workflows/ai-service-ci.yml"
  push:
    branches:
      - "main"
    paths:
      - "services/ai/**"
      - ".github/workflows/ai-service-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax check
        run: python -m compileall -q app worker.py tests

      - name: Parser unit tests
        run: PYTHONPATH=. python -m unittest discover -s tests -v

      - name: Validate Docker Compose
        run: |
          cp .env.example .env
          docker compose config -q
