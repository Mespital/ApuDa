services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      - apuda-ai
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ai-tmp:/data/tmp
      - ai-models:/root/.cache
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - apuda-ai
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    build: .
    restart: unless-stopped
    command: ["python", "worker.py"]
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ai-tmp:/data/tmp
      - ai-models:/root/.cache
    networks:
      - apuda-ai

volumes:
  redis-data:
  ai-tmp:
  ai-models:

networks:
  apuda-ai:
    driver: bridge
